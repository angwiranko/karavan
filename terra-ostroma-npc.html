<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Ostroma NPC</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --border: #3b3b45;
      --accent: #ffcc33;
      --terra: #9ccfff;
      --mars: #ff774d;
      --text-primary: #f5f5f5;
      --text-secondary: #b7b7c5;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top, rgba(31, 26, 38, 0.82), rgba(5, 5, 9, 0.96)), url('images/starfort.jpg') center/cover fixed;
      color: var(--text-primary);
      padding: clamp(14px, 2vw, 28px);
    }

    .page-shell {
      width: min(1680px, 100%);
      min-height: calc(100vh - clamp(28px, 4vw, 56px));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 22px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      align-items: end;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.7rem, 2.7vw, 3rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 204, 51, 0.36);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-secondary);
      font-size: 0.82rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(26, 26, 26, 0.98), rgba(43, 43, 43, 0.98));
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.16);
    }

    .nav-button.active {
      border-color: rgba(255, 204, 51, 0.72);
      box-shadow: 0 0 12px rgba(255, 204, 51, 0.28);
    }

    .nav-button.terra {
      color: var(--terra);
      border-color: rgba(156, 207, 255, 0.46);
      background: linear-gradient(145deg, rgba(9, 39, 54, 0.96), rgba(4, 18, 24, 0.96));
    }

    .nav-button.mars {
      color: var(--mars);
      border-color: rgba(255, 119, 77, 0.5);
      background: linear-gradient(145deg, rgba(71, 17, 10, 0.96), rgba(18, 9, 7, 0.96));
    }

    .empty-gallery {
      min-height: 420px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 204, 51, 0.18);
      border-radius: 8px;
      background: linear-gradient(160deg, rgba(33, 33, 44, 0.86), rgba(11, 11, 16, 0.94));
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.38);
      color: var(--text-secondary);
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      header {
        grid-template-columns: 1fr;
      }

      .top-nav {
        justify-content: flex-start;
      }

      .nav-button {
        flex: 1 1 130px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div>
        <h1>Terra Ostroma NPC</h1>
        <p class="subtitle">NPC galéria</p>
      </div>
      <nav class="top-nav" aria-label="Terra Ostroma menü">
        <a class="nav-button" href="terra-ostroma.html">Ostrom</a>
        <a class="nav-button" href="terra-ostroma-karakterek.html">Karakterek</a>
        <a class="nav-button active" href="terra-ostroma-npc.html">NPC</a>
        <a class="nav-button terra" href="earth/index.html">Terra</a>
        <a class="nav-button mars" href="mars/index.html">Mars</a>
      </nav>
    </header>

    <main class="empty-gallery">NPC galéria előkészítve</main>
  </div>
</body>
</html>
