      { id: 'npc-mortarion', name: 'Mortarion', image: 'images/terra-ostroma/NPC/mortarion.png' },
      { id: 'npc-fulgrim', name: 'Fulgrim', image: 'images/terra-ostroma/NPC/fulgrim.png' }
    ];

    const grid = document.getElementById('npcGrid');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const modalName = document.getElementById('modalName');
    let activeIndex = 0;
    let opener = null;

    grid.innerHTML = npcs.map((npc, index) => `
      <button type="button" class="character-card" data-npc-id="${npc.id}" aria-label="${npc.name} portréjának megnyitása">
        <img class="character-image" src="${npc.image}" alt="${npc.name}" loading="lazy" decoding="async">
        <span class="character-name"><span class="character-number">${String(index + 1).padStart(2, '0')}</span>${npc.name}</span>
      </button>
    `).join('');

    function showPortrait(index) {
      activeIndex = (index + npcs.length) % npcs.length;
      const npc = npcs[activeIndex];
      modalImage.src = npc.image;
      modalImage.alt = npc.name;
      modalName.textContent = npc.name;
      document.getElementById('portraitCount').textContent = `${activeIndex + 1} / ${npcs.length}`;
    }

    grid.addEventListener('click', event => {
      const card = event.target.closest('.character-card');
      if (!card) return;
      const index = npcs.findIndex(item => item.id === card.dataset.npcId);
      if (index < 0) return;
      opener = card;
      showPortrait(index);
      modal.showModal();
    });
    document.getElementById('previousPortrait').addEventListener('click', () => showPortrait(activeIndex - 1));
    document.getElementById('nextPortrait').addEventListener('click', () => showPortrait(activeIndex + 1));
    modal.addEventListener('click', event => {
      if (event.target === modal || event.target.closest('.close-modal')) modal.close();
    });
    modal.addEventListener('close', () => opener?.focus());
    document.addEventListener('keydown', event => {
      if (!modal.open) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); showPortrait(activeIndex - 1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); showPortrait(activeIndex + 1); }
    });
  </script>
