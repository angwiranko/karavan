<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starfort Karakterek</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0f;
      --panel: #15151b;
      --panel-alt: #1c1c23;
      --border: #3b3b45;
      --accent: #ffcc33;
      --accent-soft: rgba(255, 204, 51, 0.25);
      --info: #8aa0c9;
      --insider: #ff9933;
      --danger: #ff5555;
      --text-primary: #f5f5f5;
      --text-secondary: #b7b7c5;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top, rgba(22, 22, 34, 0.85), rgba(5, 5, 9, 0.95)), url('images/alap.png') center/cover fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding: clamp(16px, 3vw, 32px);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.75rem, 2.5vw, 2.5rem);
      margin: 0 0 1rem 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 204, 51, 0.35);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: linear-gradient(145deg, #1a1a1a, #2b2b2b);
      color: var(--accent);
      border: 2px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 2rem;
    }

    .back-button:hover {
      background: #333;
      box-shadow: 0 0 12px rgba(255, 204, 51, 0.3);
      transform: translateY(-2px);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .character-card {
      background: linear-gradient(160deg, rgba(33, 33, 44, 0.85), rgba(15, 15, 22, 0.92));
      border: 1px solid rgba(255, 204, 51, 0.18);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .character-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 204, 51, 0.4);
    }

    .character-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .character-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 8px 0;
      text-align: center;
      letter-spacing: 1px;
    }

    .character-info {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.4;
    }

    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin: 2rem 0;
    }

    .error {
      text-align: center;
      font-size: 1rem;
      color: var(--danger);
      margin: 2rem 0;
      padding: 1rem;
      background: rgba(255, 85, 85, 0.1);
      border: 1px solid rgba(255, 85, 85, 0.3);
      border-radius: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 2rem;
      max-width: 90vw;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.5);
    }

    .modal-image {
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-modal:hover {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .character-grid {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
      }

      .character-card {
        padding: 16px;
      }

      .character-image {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="starfort.html" class="back-button">
      ← Vissza a Starfort-hoz
    </a>
    <h1>Starfort Karakterek</h1>
  </header>

  <main>
    <div id="loading" class="loading">Karakterek betöltése...</div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="characterGrid" class="character-grid"></div>
  </main>

  <!-- Modal for enlarged view -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <img id="modalImage" class="modal-image" src="" alt="">
      <h2 id="modalName" class="character-name"></h2>
      <p id="modalInfo" class="character-info"></p>
    </div>
  </div>

  <script>
    // List of character images to load from images/starfort/
    const characterImages = [
      'character1.jpg',
      'character2.jpg', 
      'character3.jpg',
      'character4.jpg',
      'character5.jpg',
      'character6.jpg',
      'character7.jpg',
      'character8.jpg',
      'character9.jpg',
      'character10.jpg',
      'portrait1.jpg',
      'portrait2.jpg',
      'portrait3.jpg',
      'portrait4.jpg',
      'portrait5.jpg',
      'npc1.jpg',
      'npc2.jpg',
      'npc3.jpg',
      'npc4.jpg',
      'npc5.jpg'
    ];

    const characterGrid = document.getElementById('characterGrid');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const modal = document.getElementById('modal');

    async function loadCharacters() {
      try {
        loading.style.display = 'block';
        
        const validImages = [];
        
        // Check which images actually exist
        for (const imageName of characterImages) {
          const imagePath = `images/starfort/${imageName}`;
          try {
            const response = await fetch(imagePath, { method: 'HEAD' });
            if (response.ok) {
              validImages.push({
                name: imageName,
                path: imagePath,
                displayName: formatName(imageName)
              });
            }
          } catch (e) {
            // Image doesn't exist, skip it
          }
        }

        loading.style.display = 'none';

        if (validImages.length === 0) {
          error.textContent = 'Nem találhatók karakterek az images/starfort/ mappában.';
          error.style.display = 'block';
          return;
        }

        // Create character cards
        validImages.forEach(character => {
          const card = createCharacterCard(character);
          characterGrid.appendChild(card);
        });

      } catch (err) {
        loading.style.display = 'none';
        error.textContent = 'Hiba történt a karakterek betöltése során: ' + err.message;
        error.style.display = 'block';
      }
    }

    function formatName(filename) {
      // Convert filename to display name
      // Remove extension and format nicely
      return filename
        .replace(/\.(jpg|jpeg|png|gif|webp)$/i, '')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, l => l.toUpperCase());
    }

    function createCharacterCard(character) {
      const card = document.createElement('div');
      card.className = 'character-card';
      
      card.innerHTML = `
        <img class="character-image" src="${character.path}" alt="${character.displayName}" 
             onerror="this.parentElement.style.display='none';">
        <h3 class="character-name">${character.displayName}</h3>
        <p class="character-info">Starfort karakter portré</p>
      `;

      card.addEventListener('click', () => {
        openModal(character);
      });

      return card;
    }

    function openModal(character) {
      document.getElementById('modalImage').src = character.path;
      document.getElementById('modalName').textContent = character.displayName;
      document.getElementById('modalInfo').textContent = `Teljes felbontású kép: ${character.name}`;
      modal.style.display = 'block';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    // Close modal when clicking outside
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // Close modal with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display === 'block') {
        closeModal();
      }
    });

    // Initialize
    loadCharacters();
  </script>
</body>
</html>
