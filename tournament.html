<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sol Tournament</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Share+Tech+Mono&display=swap" rel="stylesheet"> 
  <link rel="stylesheet" href="https://use.typekit.net/xmi4cwr.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <style>

	
	html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
	  font-family: 'Orbitron', sans-serif;
	  background-color: #0a0a0f;

	}
	#c {
	  width: 100%;
	  height: 100%;
	  display: block;
	}
	
	#uiPanel {
	  position: absolute;
	  top: 30px;
	  left: 10px;
	  z-index: 10;
	  display: flex;
	  flex-direction: column;
	  align-items: flex-start;
	  gap: 10px;
	}

	#controls {
	  display: flex;
	  flex-direction: row;
	  gap: 8px;
	  flex-wrap: wrap;
	}

    .sci-button {
      font-family: "Orbitron", sans-serif;
      background: linear-gradient(145deg, #1a1a1a, #2b2b2b);
      color: #00ffff;
      border: 2px solid #666;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-shadow: 0 0 3px #000;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s;
	  width: auto;
	  height: auto;
	  white-space: nowrap;
    }

    .sci-button:hover {
      background: #333;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
    }

    .sci-button img {
      width: 24px;
      height: 24px;
      filter: brightness(1.5);
    }

    .infoBox {
      position: relative;
      top: 20px;
      left: 20px;
      background: radial-gradient(ellipse at top left, #0f1a2e 60%, #050a14 100%);
      border: 2px solid #666;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
      color: #a3d9ff;
      font-family: "Share Tech Mono", monospace;
      font-weight: 400;
      text-shadow: 0 0 3px #000;
      border-radius: 8px;
      z-index: 1000;
      padding: 16px;
      width: auto;
	}

    #infoPanel {
      display: none;
	  position: fixed;
      right: -330px;
      top: 50%;
      transform: translateY(-50%);
	  padding: 16px;
      background: radial-gradient(ellipse at top left, #0f1a2e 60%, #050a14 100%);
      border: 2px solid #666;
      border-right: none;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
      color: #a3d9ff;
      font-family: "Share Tech Mono", monospace;
      font-weight: 400;
      text-shadow: 0 0 3px #000;
      border-radius: 8px 0 0 8px;
      width: 300px;
      z-index: 10;
      max-height: 90vh;
      overflow-y: auto;
      transition: right 0.3s ease;
    }
    
    #infoPanel.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      right: -330px;
    }
    
    #infoPanel.expanded {
      right: 0;
    }
    
    #infoPanelHandle {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 80px;
      background: radial-gradient(ellipse at top left, #0f1a2e 60%, #050a14 100%);
      border: 2px solid #666;
      border-right: none;
      border-radius: 8px 0 0 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      color: #00ffff;
      font-size: 24px;
      transition: all 0.3s;
      z-index: 9;
      pointer-events: auto;
    }
    
    #infoPanel.active ~ #infoPanelHandle,
    #infoPanelHandle.active {
      display: flex;
    }
    
    #infoPanelHandle:hover {
      background: #1a2a3e;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
    }
    
    @media (max-width: 1200px) {
      #infoPanel {
        right: -300px;
        width: 280px;
      }
      #infoPanel.active {
        right: -240px;
      }
      #infoPanel.expanded {
        right: 0;
      }
    }
	.infoName {
      font-family: "Orbitron", sans-serif;
      color: #00ffff;
      padding: 4px 4px;
      font-size: 14px;
	}
	.infoHP {
      font-family: "Share Tech Mono", monospace;
      font-weight: 400;
      padding: 4px 4px;
      font-size: 14px;
	}
	
	.nametag {
	color: #a3d9ff;
	background: #0a0a0f;
	width: auto;
	}
	
	.attribute-grid {
	  display: grid;
	  grid-template-columns: 1fr 1fr;
	  gap: 6px;
	  width: 100%;
	  margin: 8px 0;
	}
	
	.attribute-item {
	  display: flex;
	  flex-direction: column;
	  gap: 2px;
	}
	
	.attribute-label {
	  font-size: 10px;
	  color: #00ffff;
	  font-family: "Share Tech Mono", monospace;
	}
	
	.attribute-input {
	  background: #0a0a0f;
	  border: 1px solid #00ffff;
	  color: #a3d9ff;
	  padding: 4px;
	  border-radius: 4px;
	  font-family: "Share Tech Mono", monospace;
	  font-size: 12px;
	  width: 100%;
	}
	
	.section-divider {
	  width: 100%;
	  height: 1px;
	  background: #00ffff;
	  opacity: 0.3;
	  margin: 8px 0;
	}
	
	#rotationControls {
	  display: grid;
	  grid-template-columns: 1fr 1fr 1fr;
	  gap: 4px;
	  margin-bottom: 8px;
	}
	
	.rotation-button {
	  width: 40px;
	  height: 40px;
	  background: linear-gradient(145deg, #1a3a3a, #2b5a5a);
	  color: #00ffff;
	  border: 2px solid #00ffff;
	  border-radius: 4px;
	  cursor: pointer;
	  transition: all 0.2s;
	  font-family: "Material Icons";
	  font-size: 20px;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  padding: 0;
	}
	
	.rotation-button:hover {
	  background: #2b5a5a;
	  box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
	}
	
	#headingDisplay {
	  font-family: "Share Tech Mono", monospace;
	  color: #00ffff;
	  font-size: 12px;
	  text-align: center;
	  min-width: 120px;
	}
	
	#headingCompass {
	  width: 60px;
	  height: 60px;
	  border: 2px solid #00ffff;
	  border-radius: 50%;
	  position: relative;
	  background: rgba(0, 255, 255, 0.05);
	}
	
	#compassNeedle {
	  position: absolute;
	  top: 50%;
	  left: 50%;
	  width: 2px;
	  height: 20px;
	  background: #00ffff;
	  transform: translate(-50%, -50%);
	  transform-origin: center 12px;
	  box-shadow: 0 0 5px rgba(0, 255, 255, 0.8);
	}
	
	#compassLabel {
	  position: absolute;
	  font-size: 10px;
	  color: #00ffff;
	  font-weight: bold;
	  font-family: "Share Tech Mono", monospace;
	}
	
	#compassN {
	  top: 2px;
	  left: 50%;
	  transform: translateX(-50%);
	}
	
	.nametag {
	color: #a3d9ff;
	background: #0a0a0f;
	width: auto;
	}
	#ui {
	  pointer-events: none;
	}

	#ui button {
	  pointer-events: auto;
	}
	
    .color-button {
      width: 30px;
      height: 30px;
      border: 2px solid white;
      margin: 2px;
      cursor: pointer;
      border-radius: 50%;
      outline: none;
    }
    .color-button.selected {
      border: 3px solid #00ffff;
    }

    #backButton {
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 10;
    }
  </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/loaders/DRACOLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
		"three/examples/jsm/geometries/TextGeometry.js": "https://unpkg.com/three@0.160.0/examples/jsm/geometries/TextGeometry.js",
		"three/examples/jsm/loaders/FontLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FontLoader.js"
      }
    }
    </script>
</head>
<body>

<canvas id="c"></canvas>

<button id="backButton" class="sci-button">⬅️ Vissza</button>

<div id="uiPanel">

  <div id="controls">
    <button id="toggleNames" class="sci-button">👁️ Nevek</button>
	<button id="addPlayer" class="sci-button">➕ Új Hajó</button>
    <button id="addNPC" class="sci-button">➕ Új Ellenfél</button>
    <button id="addStation" class="sci-button">🛸 Állomás</button>
    <button id="deleteSelected" class="sci-button">🗑️ Törlés</button>
    <button id="undoMove" class="sci-button">↶ Visszavonás</button>
    <button id="saveMap" class="sci-button">💾 Mentés</button>
    <button id="loadMap" class="sci-button">📂 Betöltés</button>
    <input type="file" id="fileInput" style="display: none;">
  </div>
  
  <div id="popup" class="infoBox" style="display: none;">
    <h3 style="font-family:'Orbitron'; color:#00ffff; padding-top:4px; padding-bottom:12px; font-size: 20px; margin:0px">Új Hajó</h3>
    <label>Név: <input type="text" id="charName" value="Hajó" class="nametag"></label><br><br>
    <div id="colorPalette">
      <label>Szín:</label>
      <button class="color-button" style="background-color: #ff0000;" data-color="#ff0000"></button>
      <button class="color-button" style="background-color: #00ff00;" data-color="#00ff00"></button>
      <button class="color-button" style="background-color: #0000ff;" data-color="#0000ff"></button>
      <button class="color-button" style="background-color: #ffffff;" data-color="#ffffff"></button>
      <button class="color-button" style="background-color: #FFD700;" data-color="#FFD700"></button>
      <button class="color-button" style="background-color: #333333;" data-color="#333333"></button>
      <button class="color-button" style="background: linear-gradient(135deg, #696969 50%, transparent 50%), linear-gradient(-135deg, #696969 50%, transparent 50%); border: 2px solid #696969;" data-color="#696969" title="Default"></button>
    </div>
    <br>
    <label>Hajó típusa: 
      <select id="shipModelType" class="nametag" style="width: 100%; padding: 4px;">
        <option value="gemini3_anim1_draco.glb">Gemini (Alapértelmezett)</option>
        <option value="cruiser.glb">Cruiser</option>
        <option value="destroyer.glb">Destroyer</option>
        <option value="fregatt.glb">Fregatt</option>
        <option value="squadron.glb">Squadron</option>
        <option value="base.glb">Base</option>
      </select>
    </label><br><br>
    <label>Méret: <input type="number" id="charSize" class="nametag" value="25"></label><br><br>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div>
        <label>Sebesség: <input type="number" id="shipSpeed" class="nametag" value="25" min="0"></label>
      </div>
      <div>
        <label>Pajzs: <input type="number" id="shipShield" class="nametag" value="1" min="0" max="5"></label>
      </div>
      <div>
        <label>Radar: <input type="number" id="shipShortRange" class="nametag" value="45" min="0"></label>
      </div>
      <div>
        <label>Fegyvertáv: <input type="number" id="shipLongRange" class="nametag" value="100" min="0"></label>
      </div>
      <div>
        <label>Hátsó ágyúk: <input type="number" id="shipFront" class="nametag" value="0.6" min="0" max="5"></label>
      </div>
      <div>
        <label>Oldal ágyúk: <input type="number" id="shipSide" class="nametag" value="1" min="0" max="5"></label>
      </div>
      <div>
        <label>Front ágyúk: <input type="number" id="shipRear" class="nametag" value="2" min="0" max="5"></label>
      </div>
    </div>
    <br>
    <div style="display: flex; flex-direction:row; gap:8px">
      <button id="confirmAdd" class="sci-button">➕ Létrehozás</button>
      <button id="cancelAdd" class="sci-button">❌ Mégse</button>
    </div>
  </div>

  <div id="infoPanelHandle" title="Toggle Panel">
    <span class="material-icons" id="handleIcon">chevron_left</span>
  </div>

  <div id="infoPanel">
    <!-- Portrait -->
    <div id="infoPortraitPanel" style="text-align:center; margin-bottom:8px;">
      <canvas id="infoPortraitCanvas" width="128" height="128" style="border-radius:12px;"></canvas>
    </div>
    
    <!-- Ship Name and Speed -->
    <div id="infoName" class="infoName">Hajó: -</div>
    <div id="infoHP" class="infoHP">Sebesség: -</div>
    
    <div class="section-divider"></div>
    
    <!-- Rotation Controls -->
    <div id="headingDisplay" style="font-family: 'Share Tech Mono', monospace; color: #00ffff; font-size: 12px; text-align: center; min-width: 120px;">Heading: 0°</div>
    <div id="headingCompass" style="width: 60px; height: 60px; border: 2px solid #00ffff; border-radius: 50%; position: relative; background: rgba(0, 255, 255, 0.05);">
      <div id="compassNeedle" style="position: absolute; top: 50%; left: 50%; width: 2px; height: 20px; background: #00ffff; transform: translate(-50%, -50%); transform-origin: center 12px; box-shadow: 0 0 5px rgba(0, 255, 255, 0.8);"></div>
      <div id="compassLabel" style="position: absolute; font-size: 10px; color: #00ffff; font-weight: bold; font-family: 'Share Tech Mono', monospace; top: 2px; left: 50%; transform: translateX(-50%);">N</div>
    </div>
    <div id="rotationControls" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 8px;">
      <div style="grid-column: 1/2;"></div>
      <button class="rotation-button" id="rotateUp"><span class="material-icons">arrow_upward</span></button>
      <div style="grid-column: 3/4;"></div>
      <button class="rotation-button" id="rotateLeft"><span class="material-icons">arrow_back</span></button>
      <button class="rotation-button" id="rotateCenter"><span class="material-icons">adjust</span></button>
      <button class="rotation-button" id="rotateRight"><span class="material-icons">arrow_forward</span></button>
      <div style="grid-column: 1/2;"></div>
      <button class="rotation-button" id="rotateDown"><span class="material-icons">arrow_downward</span></button>
      <div style="grid-column: 3/4;"></div>
    </div>
    <div style="font-size: 10px; color: #666; text-align: center; margin-bottom: 4px;">Q/E or Left/Right Arrows to rotate</div>
    <div style="font-size: 10px; color: #666; text-align: center; margin-bottom: 4px;">WASD to move horizontally</div>
    <div style="font-size: 10px; color: #666; text-align: center;">Up/Down Arrows for altitude</div>
    
    <div class="section-divider"></div>
    
    <!-- Attribute Editing Section -->
    <div style="font-family: 'Orbitron', sans-serif; color: #00ffff; font-size: 12px; text-align: center; margin-bottom: 4px;">ATTRIBUTES</div>
    
    <div class="attribute-grid">
      <div class="attribute-item">
        <span class="attribute-label">Size</span>
        <input type="number" id="editSize" class="attribute-input" min="10" max="200" step="5">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Speed</span>
        <input type="number" id="editSpeed" class="attribute-input" min="0" max="100" step="5">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Shield</span>
        <input type="number" id="editShield" class="attribute-input" min="0" max="5" step="0.5">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Radar</span>
        <input type="number" id="editShortRange" class="attribute-input" min="0" max="200" step="10">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Weapon Range</span>
        <input type="number" id="editLongRange" class="attribute-input" min="0" max="300" step="10">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Rear Guns</span>
        <input type="number" id="editFront" class="attribute-input" min="0" max="5" step="0.01">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Side Guns</span>
        <input type="number" id="editSide" class="attribute-input" min="0" max="5" step="0.01">
      </div>
      <div class="attribute-item">
        <span class="attribute-label">Front Guns</span>
        <input type="number" id="editRear" class="attribute-input" min="0" max="5" step="0.01">
      </div>
    </div>
    
    <div class="section-divider"></div>
    
    <!-- Range Visuals Toggle -->
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 8px 0;">
      <span style="font-family: 'Share Tech Mono', monospace; color: #00ffff; font-size: 11px;">Show Ranges</span>
      <label style="position: relative; display: inline-block; width: 40px; height: 20px;">
        <input type="checkbox" id="toggleRanges" checked style="opacity: 0; width: 0; height: 0;">
        <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #0a0a0f; border: 1px solid #00ffff; border-radius: 10px; transition: .3s;"></span>
        <span id="rangeSlider" style="position: absolute; content: ''; height: 14px; width: 14px; left: 3px; bottom: 2px; background-color: #00ffff; border-radius: 50%; transition: .3s;"></span>
      </label>
    </div>
    
    <button id="applyAttributes" class="sci-button" style="width: 100%; margin-top: 8px;">✅ Apply Changes</button>
  </div>
  
</div>

<style>
  #toggleRanges:checked + span + #rangeSlider {
    transform: translateX(20px);
  }
</style>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
  import { FontLoader } from 'three/examples/jsm/loaders/FontLoader.js';
  import { TextGeometry } from 'three/examples/jsm/geometries/TextGeometry.js';

  // Toast notification function
  function showToast(message, type = 'success') {
    const backgroundColor = type === 'error' 
      ? 'linear-gradient(to right, #ff4444, #cc0000)'
      : 'radial-gradient(circle,rgba(0, 100, 150, 1) 60%, rgba(0, 50, 100, 1) 100%)';
    
    Toastify({
      text: message,
      duration: 1500,
      gravity: "top",
      position: "right",
      style: {
        background: backgroundColor,
        fontFamily: "'Orbitron', sans-serif",
        fontSize: "14px",
        borderRadius: "8px",
        border: "2px solid #666",
        boxShadow: "0 0 12px " + (type === 'error' ? '#ff4444' : '#00ffff')
      }
    }).showToast();
  };

  // Back button
  document.getElementById('backButton').addEventListener('click', () => {
    window.location.href = 'starfort.html';
  });

  // Scene, Camera, Renderer

  let scene, camera, renderer, controls;
  
  const canvas = document.querySelector( '#c' );
  renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
  renderer.setSize(window.innerWidth, window.innerHeight, true);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 400, 400);
  camera.lookAt(0, 0, 0);  
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.Fog(0x0a0a0f, 1500, 2000);
  
  // Create environment map for reflections
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  
  // Create a simple gradient environment
  const envScene = new THREE.Scene();
  const envGradient = new THREE.Mesh(
    new THREE.SphereGeometry(500, 32, 32),
    new THREE.MeshBasicMaterial({
      color: 0x1a1a2e,
      side: THREE.BackSide
    })
  );
  envScene.add(envGradient);
  
  const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
  scene.environment = envMap;
  pmremGenerator.dispose();
  
  // OrbitControls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.update();
  
  // Trigger render when camera moves
  controls.addEventListener('change', () => {
    sceneNeedsUpdate = true;
  });
  
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selectedPlayer = null;
  let originalMaterial = null;
  let originalMaterials = []; // Store all original materials for complex models
  let hoverIndicator = null;
  let sceneNeedsUpdate = true; // Dirty flag for rendering optimization
  
  // Undo/Redo system
  const stateHistory = [];
  const MAX_HISTORY = 50;
  
  function captureState() {
    const state = {
      players: [],
      enemies: []
    };
    
    // Capture all player states
    players.children.forEach(player => {
      state.players.push({
        id: player.uuid,
        position: { x: player.position.x, y: player.position.y, z: player.position.z },
        heading: player.userData.heading || 0,
        rotation: { x: player.rotation.x, y: player.rotation.y, z: player.rotation.z },
        y: player.userData.y || player.position.y
      });
    });
    
    // Capture all enemy states
    enemies.children.forEach(enemy => {
      state.enemies.push({
        id: enemy.uuid,
        position: { x: enemy.position.x, y: enemy.position.y, z: enemy.position.z },
        heading: enemy.userData.heading || 0,
        rotation: { x: enemy.rotation.x, y: enemy.rotation.y, z: enemy.rotation.z },
        y: enemy.userData.y || enemy.position.y
      });

      if (player) {
        player.position.set(savedPlayer.position.x, savedPlayer.position.y, savedPlayer.position.z);
        player.userData.heading = savedPlayer.heading;
        player.userData.y = savedPlayer.y || savedPlayer.position.y;
        player.rotation.y = savedPlayer.heading;
        player.rotation.x = savedPlayer.rotation.x;
        player.rotation.z = savedPlayer.rotation.z;

    });
    
    // Restore enemy states
    state.enemies.forEach(savedEnemy => {
      const enemy = [...enemies.children].find(e => e.uuid === savedEnemy.id);
      if (enemy) {
        enemy.position.set(savedEnemy.position.x, savedEnemy.position.y, savedEnemy.position.z);

  // Cache for multiple model types
  const shipModels = new Map(); // Map<modelType, loadedModel>
  const modelLoadingStatus = new Map(); // Map<modelType, boolean>
  const modelLoadErrors = new Map(); // Map<modelType, boolean>

  async function loadShipModel(modelType = 'gemini3_anim1_draco.glb') {
    return new Promise((resolve) => {
      // If already loaded, clone and return
      if (shipModels.has(modelType)) {
        const cachedModel = shipModels.get(modelType);
        const clonedModel = cachedModel.clone();
        // Deep clone materials to avoid sharing between instances
        clonedModel.traverse((node) => {
          if (node.isMesh && node.material) {
            node.material = node.material.clone();
          }
        });
        resolve(clonedModel);
        return;
      }

      // If already loading, wait a bit and try again
      if (modelLoadingStatus.get(modelType)) {
        setTimeout(() => loadShipModel(modelType).then(resolve), 100);
        return;
      }

      // If loading failed before, just resolve with null to use fallback
      if (modelLoadErrors.get(modelType)) {
        resolve(null);
        return;
      }

      modelLoadingStatus.set(modelType, true);

      gltfLoader.load(
        modelType,
        (gltf) => {
          shipModels.set(modelType, gltf.scene);
          modelLoadingStatus.set(modelType, false);
          console.log(`✅ Ship model loaded successfully: ${modelType}`);
          const clonedModel = gltf.scene.clone();
          // Deep clone materials
          clonedModel.traverse((node) => {
            if (node.isMesh && node.material) {
              node.material = node.material.clone();
            }
          });
          resolve(clonedModel);
        },
        (progress) => {
          if (progress.total > 0) {
            console.log(`Loading ${modelType}:`, (progress.loaded / progress.total * 100).toFixed(0) + '%');
          }
        },
        (error) => {
          modelLoadingStatus.set(modelType, false);
          modelLoadErrors.set(modelType, true);
          console.warn(`⚠️ Could not load ship model ${modelType}:`, error);
          resolve(null);
        }
      );
    });
  }

  // Name labels for ships
  function createNameLabel(name, portreURL = "/images/spaceship.jpg") {
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 128;

    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(120, 60, 1);
    sprite.visible = namesVisible;
    sprite.userData.isNameLabel = true;

    const img = new Image();
    img.src = portreURL;

    img.onload = () => {
      context.clearRect(0, 0, canvas.width, canvas.height);

      const cropSize = Math.min(img.width, img.height);
      const cropX = (img.width - cropSize) / 2;
      const cropY = (img.height - cropSize) / 2;

      const radius = 8;
      const drawX = (canvas.width - 64) / 2;
      const drawY = 0;

      context.save();
      context.beginPath();
      context.moveTo(drawX + radius, drawY);
      context.lineTo(drawX + 64 - radius, drawY);
      context.quadraticCurveTo(drawX + 64, drawY, drawX + 64, drawY + radius);
      context.lineTo(drawX + 64, drawY + 64 - radius);
      context.quadraticCurveTo(drawX + 64, drawY + 64, drawX + 64 - radius, drawY + 64);
      context.lineTo(drawX + radius, drawY + 64);
      context.quadraticCurveTo(drawX, drawY + 64, drawX, drawY + 64 - radius);
      context.lineTo(drawX, drawY + radius);
      context.quadraticCurveTo(drawX, drawY, drawX + radius, drawY);
      context.closePath();
      context.clip();

      context.drawImage(img, cropX, cropY, cropSize, cropSize, drawX, drawY, 64, 64);
      context.restore();

      context.fillStyle = '#00ffff';
      context.font = 'bold 24px monospace';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(name, canvas.width / 2, 96);

      texture.needsUpdate = true;
    };

    img.onerror = () => {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#00ffff';
      context.fillRect(0, 0, 256, 128);
      context.fillStyle = '#000';
      context.font = 'bold 24px monospace';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(name, canvas.width / 2, 64);
      texture.needsUpdate = true;
    };

    return sprite;
  }

  function getCorrectYPosition(x, z, size) {
    return size;
  }

  let lastValidPosition = null;
  let positionCache = new Map();
  const CACHE_GRID_SIZE = 10;
  
  function getCacheKey(x, z) {
    const gridX = Math.floor(x / CACHE_GRID_SIZE);
    const gridZ = Math.floor(z / CACHE_GRID_SIZE);
    return `${gridX},${gridZ}`;
  }

  function isValidPosition(x, z, size) {
    const cacheKey = getCacheKey(x, z);
    if (positionCache.has(cacheKey)) {
      return positionCache.get(cacheKey);
    }
    
    const tempRaycaster = new THREE.Raycaster();
    const characterHeight = size;
    
    const checkDirections = [
      new THREE.Vector3(1, 0, 0),
      new THREE.Vector3(-1, 0, 0),
      new THREE.Vector3(0, 0, 1),
      new THREE.Vector3(0, 0, -1),
    ];
    
    let isValid = true;
    
    for (const direction of checkDirections) {
      const origin = new THREE.Vector3(x, characterHeight, z);
      tempRaycaster.set(origin, direction);
      
      const intersects = tempRaycaster.intersectObjects(terrain.children, true);
      
      for (const hit of intersects) {
        if (hit.distance < size + 5) {
          isValid = false;
          break;
        }
      }
      if (!isValid) break;
    }
    
    positionCache.set(cacheKey, isValid);
    return isValid;
  }

  function findNearestValidPosition(targetX, targetZ, size) {
    if (isValidPosition(targetX, targetZ, size)) {
      lastValidPosition = { x: targetX, z: targetZ };
      return lastValidPosition;
    }
    
    if (lastValidPosition) {
      const distance = Math.sqrt(
        Math.pow(targetX - lastValidPosition.x, 2) + 
        Math.pow(targetZ - lastValidPosition.z, 2)
      );
      
      if (distance < 30) {
        for (let t = 0.1; t <= 1.0; t += 0.1) {
          const interpX = lastValidPosition.x + (targetX - lastValidPosition.x) * t;
          const interpZ = lastValidPosition.z + (targetZ - lastValidPosition.z) * t;
          
          if (isValidPosition(interpX, interpZ, size)) {
            lastValidPosition = { x: interpX, z: interpZ };
            return lastValidPosition;
          }
        }
      }
    }
    
    const searchRadius = 10;
    const maxRadius = 50;
    const angleSteps = 6;
    
    for (let radius = searchRadius; radius <= maxRadius; radius += 10) {
      for (let i = 0; i < angleSteps; i++) {
        const angle = (i / angleSteps) * Math.PI * 2;
        const testX = targetX + Math.cos(angle) * radius;
        const testZ = targetZ + Math.sin(angle) * radius;
        
        if (isValidPosition(testX, testZ, size)) {
          lastValidPosition = { x: testX, z: testZ };
          return lastValidPosition;
        }
      }
    }
    
    return lastValidPosition || { x: targetX, z: targetZ };
  }

  // Hover indicator
  function createHoverIndicator(size = 20, color = 0x00ffff) {
    const innerRadius = size * 0.75;
    const outerRadius = size * 1.25;
    const ringGeometry = new THREE.RingGeometry(innerRadius, outerRadius, 32);
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
    ring.rotation.x = -Math.PI / 2;
    
    const discRadius = size * 0.6;
    const discGeometry = new THREE.CircleGeometry(discRadius, 32);
    const discMaterial = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.3
    });
    const disc = new THREE.Mesh(discGeometry, discMaterial);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = 0.1;
    
    const beamRadius = size * 0.4;
    const beamHeight = size * 2;
    const beamGeometry = new THREE.CylinderGeometry(beamRadius, beamRadius, beamHeight, 8, 1, true);
    const beamMaterial = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.2,
      side: THREE.DoubleSide
    });
    const beam = new THREE.Mesh(beamGeometry, beamMaterial);
    beam.position.y = beamHeight / 2;
    
    const indicator = new THREE.Group();
    indicator.add(ring);
    indicator.add(disc);
    indicator.add(beam);
    indicator.visible = false;
    
    indicator.userData = {
      time: 0,
      size,
      color,
      originalRingOpacity: ringMaterial.opacity,
      originalDiscOpacity: discMaterial.opacity,
      originalBeamOpacity: beamMaterial.opacity
    };
    
    scene.add(indicator);
    return indicator;
  }

  function updateHoverIndicator() {
    if (!hoverIndicator || !hoverIndicator.visible) return;
    
    hoverIndicator.userData.time += 0.05;
    const pulseValue = Math.sin(hoverIndicator.userData.time) * 0.3 + 0.7;
    
    hoverIndicator.children[0].material.opacity = hoverIndicator.userData.originalRingOpacity * pulseValue;
    hoverIndicator.children[1].material.opacity = hoverIndicator.userData.originalDiscOpacity * pulseValue;
    hoverIndicator.children[2].material.opacity = hoverIndicator.userData.originalBeamOpacity * pulseValue;
    
    hoverIndicator.children[2].rotation.y += 0.02;
    
    if (hoverIndicator.userData.targetPosition) {
      const current = hoverIndicator.position;
      const target = hoverIndicator.userData.targetPosition;
      const lerpFactor = 0.15;
      
      current.lerp(target, lerpFactor);
      
      if (current.distanceTo(target) < 1) {
        hoverIndicator.userData.targetPosition = null;
      }
    }
  }

  function showHoverIndicator(x, y, z, size = 20, color = 0x00ffff) {
    if (!hoverIndicator || (hoverIndicator.userData.size !== size) || (hoverIndicator.userData.color !== color)) {
      if (hoverIndicator) {
        scene.remove(hoverIndicator);
      }
      hoverIndicator = createHoverIndicator(size, color);
    }
    
    // Always keep indicator on grid level (Y=1)
    const targetPosition = new THREE.Vector3(x, 1, z);
    
    if (!hoverIndicator.visible) {
      hoverIndicator.position.copy(targetPosition);
      hoverIndicator.visible = true;
    } else {
      hoverIndicator.userData.targetPosition = targetPosition;
    }
  }

  function hideHoverIndicator() {
    if (hoverIndicator) {
      hoverIndicator.visible = false;
    }
  }
  
  // Create visual range indicators - Flat 2D Board Game Style
  function createRangeVisuals(shipObject, attributes, color, modelScale = 1.0) {
    const group = new THREE.Group();
    group.name = "RangeVisuals";
    // Counter-scale the group to make it independent of ship model's scale
    const counterScale = 1.0 / modelScale;
    group.scale.set(counterScale, counterScale, counterScale);
    group.userData = { 
      time: 0, 
      animatingChildren: [],
      attributes: { ...attributes } // Store attributes for comparison later
    };
    
    const speedScale = 4.0;
    const rangeScale = 3.5;
    
    // Convert color to THREE.Color if it's a number
    const shipColor = new THREE.Color(color);
    
    // Speed circle - thin dashed line
    if (attributes.speed > 0) {
      const speedRadius = attributes.speed * speedScale;
      const points = [];
      const segments = 360; 
      const dashLength = 2;
      
      for (let i = 0; i < segments; i++) {
        if (Math.floor(i / dashLength) % 2 === 0) {
          const angle = (i / segments) * Math.PI * 2;
          points.push(new THREE.Vector3(
            Math.cos(angle) * speedRadius,
            0.01,
            Math.sin(angle) * speedRadius
          ));
        }
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({
        color: shipColor,
        transparent: true,
        opacity: 0.4,
        linewidth: 1
      });
      const line = new THREE.LineSegments(geometry, material);
      line.userData = { isSpeedRing: true, baseOpacity: 0.4 };
      group.add(line);
      group.userData.animatingChildren.push(line);
    }
    
    // Short range - simple ring (filled circle outline)
    if (attributes.shortRange > 0) {
      const shortRadius = attributes.shortRange * rangeScale;
      const points = [];
      const segments = 64;
      
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(
          Math.cos(angle) * shortRadius,
          0.02,
          Math.sin(angle) * shortRadius
        ));
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({
        color: shipColor,
        transparent: true,
        opacity: 0.35,
        linewidth: 1
      });
      const line = new THREE.Line(geometry, material);
      line.userData = { isShortRange: true, baseOpacity: 0.35 };
      group.add(line);
      group.userData.animatingChildren.push(line);
    }
    
    // Shield - tiny center sphere with gradient opacity (transparent at poles)
    if (attributes.shield > 0) {
      const baseSize = attributes.size || 50;
      const shieldRadius = Math.max(30, baseSize * 0.4);
      
      // Calculate base opacity based on shield value (0-5)
      // Higher shield = higher opacity, lower shield = lower opacity
      const baseOpacity = Math.min(1, Math.max(0.1, attributes.shield / 5)); // Normalize 0-5 to 0.1-1.0
      
      console.log('Creating shield sphere with shield value:', attributes.shield, 'baseOpacity:', baseOpacity);
      
      const sphereGeometry = new THREE.SphereGeometry(shieldRadius, 32, 32);
      
      // Create vertex colors for gradient opacity effect
      const colors = [];
      const positionAttribute = sphereGeometry.getAttribute('position');
      
      for (let i = 0; i < positionAttribute.count; i++) {
        const y = positionAttribute.getY(i);
        // Calculate opacity based on distance from poles (y-axis)
        // Maximum opacity at equator (y=0), minimum at poles (y=±radius)
        const normalizedY = Math.abs(y) / shieldRadius;
        const gradientOpacity = 1 - normalizedY; // 1 at equator, 0 at poles
        
        colors.push(shipColor.r, shipColor.g, shipColor.b, gradientOpacity);
      }
      
      sphereGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 4));
      
      const sphereMaterial = new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.DoubleSide,
        uniforms: {
          baseColor: { value: shipColor.clone() },
          baseOpacity: { value: baseOpacity }
        },
        vertexShader: `
          attribute vec4 color;
          varying vec4 vColor;
          void main() {
            vColor = color;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float baseOpacity;
          varying vec4 vColor;
          void main() {
            gl_FragColor = vec4(vColor.rgb, vColor.a * baseOpacity * 0.6);
          }
        `
      });
      
      sphereMaterial.needsUpdate = true;
      
      const shieldSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      shieldSphere.position.y = 0.03;
      shieldSphere.name = 'ShieldSphere_' + Date.now(); // Unique name for debugging
      shieldSphere.userData = { isShieldSphere: true, shieldValue: attributes.shield, baseOpacity: baseOpacity };
      console.log('Shield sphere created:', shieldSphere.name, 'baseOpacity uniform:', sphereMaterial.uniforms.baseOpacity.value);
      group.add(shieldSphere);
      group.userData.animatingChildren.push(shieldSphere);
    }
    
    // Long range - directional flat arcs (4 wedge sections, scaled by attribute values)
    if (attributes.longRange > 0) {
      const baseRadius = attributes.longRange * rangeScale;
      const arcWidth = Math.PI / 4; // 45 degrees per section
      
      // Front (90°) - scaled by attributes.front (0-5)
      if (attributes.front > 0) {
        const frontScale = Math.min(5, Math.max(0.01, attributes.front)) / 5; // Normalize 0.01-5 to proportional scale
        const frontMaxRadius = baseRadius * frontScale;
        addFlatArcSegment(group, 0, frontMaxRadius * 0.33, Math.PI / 2 - arcWidth/2, Math.PI / 2 + arcWidth/2, shipColor, 0.25);
        addFlatArcSegment(group, frontMaxRadius * 0.33, frontMaxRadius * 0.66, Math.PI / 2 - arcWidth/2, Math.PI / 2 + arcWidth/2, shipColor, 0.18);
        addFlatArcSegment(group, frontMaxRadius * 0.66, frontMaxRadius, Math.PI / 2 - arcWidth/2, Math.PI / 2 + arcWidth/2, shipColor, 0.12);
      }
      
      // Left (180°) - scaled by attributes.side (0-5)
      if (attributes.side > 0) {
        const sideScale = Math.min(5, Math.max(0.01, attributes.side)) / 5;
        const sideMaxRadius = baseRadius * sideScale;
        addFlatArcSegment(group, 0, sideMaxRadius * 0.33, Math.PI - arcWidth/2, Math.PI + arcWidth/2, shipColor, 0.25);
        addFlatArcSegment(group, sideMaxRadius * 0.33, sideMaxRadius * 0.66, Math.PI - arcWidth/2, Math.PI + arcWidth/2, shipColor, 0.18);
        addFlatArcSegment(group, sideMaxRadius * 0.66, sideMaxRadius, Math.PI - arcWidth/2, Math.PI + arcWidth/2, shipColor, 0.12);
      }
      
      // Right (0°) - scaled by attributes.side (0-5)
      if (attributes.side > 0) {
        const sideScale = Math.min(5, Math.max(0.01, attributes.side)) / 5;
        const sideMaxRadius = baseRadius * sideScale;
        addFlatArcSegment(group, 0, sideMaxRadius * 0.33, -arcWidth/2, arcWidth/2, shipColor, 0.25);
        addFlatArcSegment(group, sideMaxRadius * 0.33, sideMaxRadius * 0.66, -arcWidth/2, arcWidth/2, shipColor, 0.18);
        addFlatArcSegment(group, sideMaxRadius * 0.66, sideMaxRadius, -arcWidth/2, arcWidth/2, shipColor, 0.12);
      }
      
      // Rear (270°) - scaled by attributes.rear (0-5)
      if (attributes.rear > 0) {
        const rearScale = Math.min(5, Math.max(0.01, attributes.rear)) / 5; // Normalize 0.01-5 to proportional scale
        const rearMaxRadius = baseRadius * rearScale;
        addFlatArcSegment(group, 0, rearMaxRadius * 0.33, -Math.PI / 2 - arcWidth/2, -Math.PI / 2 + arcWidth/2, shipColor, 0.25);
        addFlatArcSegment(group, rearMaxRadius * 0.33, rearMaxRadius * 0.66, -Math.PI / 2 - arcWidth/2, -Math.PI / 2 + arcWidth/2, shipColor, 0.18);
        addFlatArcSegment(group, rearMaxRadius * 0.66, rearMaxRadius, -Math.PI / 2 - arcWidth/2, -Math.PI / 2 + arcWidth/2, shipColor, 0.12);
      }
    }
    
    return group;
  }
  
  // Helper: Add a simple flat arc line segment
  function addFlatArcSegment(group, innerRadius, outerRadius, startAngle, endAngle, color, opacity) {
    const segments = 32;
    const vertices = [];
    const indices = [];
    
    // Create vertices for the arc shape
    // Outer arc vertices
    for (let i = 0; i <= segments; i++) {
      const angle = startAngle + (endAngle - startAngle) * (i / segments);
      vertices.push(
        Math.cos(angle) * outerRadius,
        0.02,
        Math.sin(angle) * outerRadius
      );
    }
    
    // Inner arc vertices
    for (let i = 0; i <= segments; i++) {
      const angle = startAngle + (endAngle - startAngle) * (i / segments);
      vertices.push(
        Math.cos(angle) * innerRadius,
        0.02,
        Math.sin(angle) * innerRadius
      );
    }
    
    // Create triangles between outer and inner arcs
    for (let i = 0; i < segments; i++) {
      const outerIndex1 = i;
      const outerIndex2 = i + 1;
      const innerIndex1 = segments + 1 + i;
      const innerIndex2 = segments + 1 + i + 1;
      
      // First triangle
      indices.push(outerIndex1, outerIndex2, innerIndex1);
      // Second triangle
      indices.push(outerIndex2, innerIndex2, innerIndex1);
    }
    
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    
    const material = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: opacity,
      side: THREE.DoubleSide
    });
    
    const mesh = new THREE.Mesh(geometry, material);
    mesh.userData = { isRangeArc: true, baseOpacity: opacity };
    group.add(mesh);
    group.userData.animatingChildren.push(mesh);
  }
  
  // Animate range visuals - simple opacity pulse
  function updateRangeVisuals() {
    const time = Date.now() * 0.001;
    
    const updateShipRanges = (ships) => {
      ships.forEach(ship => {
        const rangeGroup = ship.getObjectByName("RangeVisuals");
        if (!rangeGroup || !rangeGroup.userData.animatingChildren) return;
        
        rangeGroup.userData.animatingChildren.forEach(child => {
          if (!child.material) return;
          
          if (child.userData.isSpeedRing && child.userData.baseOpacity) {
            const pulse = Math.sin(time * 0.6) * 0.15 + 0.85;
            child.material.opacity = child.userData.baseOpacity * pulse;
          } else if (child.userData.isShortRange && child.userData.baseOpacity) {
            const pulse = Math.sin(time * 0.7) * 0.1 + 0.9;
            child.material.opacity = child.userData.baseOpacity * pulse;
          } else if (child.userData.isShieldSphere && child.userData.baseOpacity) {
            // Shield sphere uses ShaderMaterial with uniforms, not regular opacity
            const shimmer = Math.sin(time * 0.5) * 0.08 + 0.92;
            if (child.material.uniforms && child.material.uniforms.baseOpacity) {
              child.material.uniforms.baseOpacity.value = child.userData.baseOpacity * shimmer;
            }
          } else if (child.userData.isRangeArc && child.userData.baseOpacity) {
            const wave = Math.sin(time * 0.5) * 0.15 + 0.85;
            child.material.opacity = child.userData.baseOpacity * wave;
          }
        });
      });
    };
    
    updateShipRanges(players.children);
    updateShipRanges(enemies.children);
  }
  
  // Helper: Create a solid circle (line geometry) - already in XZ plane
  function createSolidCircle(radius, segments) {
    const points = [];
    for (let i = 0; i <= segments; i++) {
      const angle = (i / segments) * Math.PI * 2;
      points.push(new THREE.Vector3(
        Math.cos(angle) * radius,
        0,
        Math.sin(angle) * radius
      ));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    return geometry;
  }
  
  // Helper: Create a dashed circle - already in XZ plane
  function createDashedCircle(radius, segments) {
    const points = [];
    const dashSegments = 12; // 12 dashes
    const segmentsPerDash = segments / dashSegments;
    let onDash = true;
    
    for (let i = 0; i <= segments; i++) {
      const segmentIndex = Math.floor(i / segmentsPerDash);
      onDash = (segmentIndex % 2) === 0;
      
      if (onDash || i === segments) {
        const angle = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(
          Math.cos(angle) * radius,
          0,
          Math.sin(angle) * radius
        ));
      }
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    return geometry;
  }
  
  // Helper: Create a solid circle (line geometry) - already in XZ plane
  async function createPlayer(x, z, color = 0x0000ff, name = "Player", size = 20, attributes = {}, modelType = 'gemini3_anim1_draco.glb') {
    // Set default attributes
    const attrs = {
      speed: attributes.speed || 30,
      shield: attributes.shield || 3,
      shortRange: attributes.shortRange || 20,
      longRange: attributes.longRange || 100,
      front: attributes.front || 3,
      side: attributes.side || 1,
      rear: attributes.rear || 1,
      size: size
    };

    let shipObject;
    let scale = 1.0; // Default scale for fallback sphere
    const model = await loadShipModel(modelType);
    
    if (model) {
      shipObject = model;
      
      // Calculate bounding box to determine scale
      const bbox = new THREE.Box3().setFromObject(shipObject);
      const bboxSize = bbox.getSize(new THREE.Vector3());
      const maxDim = Math.max(bboxSize.x, bboxSize.y, bboxSize.z);
      
      // Scale to desired size
      scale = (size * 2) / maxDim;
      shipObject.scale.set(scale, scale, scale);
      
      // Apply color and material to all meshes
      shipObject.traverse((node) => {
        if (node.isMesh) {
          // Preserve original material if it exists, otherwise create new one
          if (node.material) {
            // Keep original material but adjust properties
            node.material = node.material.clone();
            // Subtle color tint using emissive instead of base color
            node.material.emissive = new THREE.Color(color);
            node.material.emissiveIntensity = 0.15;
            // Ensure proper lighting response
            node.material.metalness = Math.min(node.material.metalness || 0.3, 0.3);
            node.material.roughness = Math.max(node.material.roughness || 0.7, 0.7);
          } else {
            // Fallback material with neutral color
            node.material = new THREE.MeshStandardMaterial({
              color: 0xcccccc,
              metalness: 0.3,
              roughness: 0.7,
              emissive: new THREE.Color(color),
              emissiveIntensity: 0.15
            });
          }
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
      
      console.log('✅ Player ship model applied (scale: ' + scale.toFixed(2) + ')');
    } else {
      // Fallback to sphere
      const geometry = new THREE.SphereGeometry(size, 16, 16);
      const material = new THREE.MeshStandardMaterial({ 
        color: new THREE.Color(color),
        metalness: 0.2,
        roughness: 0.7
      });
      shipObject = new THREE.Mesh(geometry, material);
      console.log('⚠️ Player ship using fallback sphere');
    }

    const nameLabel = createNameLabel(name);
    nameLabel.visible = namesVisible;
    shipObject.add(nameLabel);
    nameLabel.position.set(0, size + 20, 0);

    // Create range visuals (pass scale factor for counter-scaling)
    const modelScale = model ? scale : 1.0;
    const rangeVisuals = createRangeVisuals(shipObject, attrs, color, modelScale);
    shipObject.add(rangeVisuals);

    const validPosition = findNearestValidPosition(x, z, size);
    const correctY = getCorrectYPosition(validPosition.x, validPosition.z, size);
    shipObject.position.set(validPosition.x, correctY, validPosition.z);
  
    shipObject.userData = {
      type: "player",
      name,
      size,
      color: color,
      modelType: modelType,
      showRanges: true,
      y: correctY,
      ...attrs
    };

    players.add(shipObject);
    return shipObject;
  }

  function createSpaceStation(x, z, name = "Stanice", scale = 50) {

    for (let i = 0; i < 4; i++) {

    // Side pods (engine/shield generators) - better integrated
    for (let side = -1; side <= 1; side += 2) {
      for (let dir = 0; dir < 2; dir++) {

        pod.receiveShadow = true;

        // Reactor glow

        const glowMaterial = new THREE.MeshStandardMaterial({

    }
    
    // Bottom armor plates for stability
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const platX = Math.cos(angle) * scale * 0.55;
      const platZ = Math.sin(angle) * scale * 0.55;
      
      const platGeometry = new THREE.BoxGeometry(scale * 0.3, scale * 0.1, scale * 0.3);
      const plat = new THREE.Mesh(platGeometry, turretMaterial);
      plat.position.set(platX, -scale * 0.25, platZ);
      plat.castShadow = true;
      plat.receiveShadow = true;
      stationGroup.add(plat);
    }
    
    // Additional turrets scattered around the station
    const extraTurretCount = 16;
    for (let i = 0; i < extraTurretCount; i++) {
      const angle = (i / extraTurretCount) * Math.PI * 2;
      const distance = scale * (0.5 + Math.random() * 0.4);
      const turretX = Math.cos(angle) * distance;
      const turretZ = Math.sin(angle) * distance;
      const turretY = (Math.random() - 0.5) * scale * 0.6;
      
      const smallTurretGeometry = new THREE.CylinderGeometry(scale * 0.1, scale * 0.1, scale * 0.3, 6);
      const smallTurret = new THREE.Mesh(smallTurretGeometry, turretMaterial);
      smallTurret.position.set(turretX, turretY, turretZ);
      smallTurret.castShadow = true;
      smallTurret.receiveShadow = true;
      stationGroup.add(smallTurret);
    }
    
    // Position and add to scene
    const validPosition = findNearestValidPosition(x, z, scale * 1.5);
    const correctY = getCorrectYPosition(validPosition.x, validPosition.z, scale * 1.5) + scale * 0.3;
    stationGroup.position.set(validPosition.x, correctY, validPosition.z);
    
    stationGroup.userData = {
      type: "station",
      name: name,
      size: scale
    };
    
    // Add name label
    const nameLabel = createNameLabel(name);
    nameLabel.visible = namesVisible;
    stationGroup.add(nameLabel);
    nameLabel.position.set(0, scale + 30, 0);
    
    terrain.add(stationGroup);
    return stationGroup;

  // Seed-based random
  let globalSeed = Math.floor(Math.random() * 1000000);
  
  function seededRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }
  
  let randomCounter = 0;
  function nextRandom() {
    return seededRandom(globalSeed + randomCounter++);
  }
  
  function setSeed(seed) {
    globalSeed = seed;
    randomCounter = 0;
  }

  // Asteroid/Space Debris generation
  function generateTerrain() {
    terrain.clear();
    positionCache.clear();
    lastValidPosition = null;
    randomCounter = 0;
    
    const gridSize = 10;
    const cellSize = 100;

    // Create random asteroids and space debris
    for (let i = 0; i < 20 + nextRandom() * 15; i++) {
      const x = (nextRandom() - 0.5) * 1000;
      const z = (nextRandom() - 0.5) * 1000;
      const y = (nextRandom() - 0.5) * 200;

      // Random asteroid or debris
      const type = nextRandom();
      let geometry;
      let size;

      if (type < 0.6) {
        // Asteroid
        size = nextRandom() * 30 + 10;
        geometry = new THREE.IcosahedronGeometry(size, 2);
      } else if (type < 0.85) {
        // Debris (irregular)
        size = nextRandom() * 15 + 5;
        geometry = new THREE.BoxGeometry(size, size * 0.7, size * 0.5);
      } else {
        // Floating rock
        size = nextRandom() * 20 + 5;
        geometry = new THREE.SphereGeometry(size, 3, 3);
      }

      const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0, 0, 0.3 + nextRandom() * 0.3),
        metalness: nextRandom() * 0.4,
        roughness: 0.8 + nextRandom() * 0.2
      });

      const asteroid = new THREE.Mesh(geometry, material);
      asteroid.position.set(x, y, z);
      asteroid.rotation.set(
        nextRandom() * Math.PI * 2,
        nextRandom() * Math.PI * 2,
        nextRandom() * Math.PI * 2
      );
      asteroid.userData = { type: "asteroid" };

      terrain.add(asteroid);
    }

    // Floating debris field
    for (let i = 0; i < 30 + nextRandom() * 20; i++) {
      const x = (nextRandom() - 0.5) * 1200;
      const z = (nextRandom() - 0.5) * 1200;
      const y = (nextRandom() - 0.5) * 300;

      const sizeDebris = nextRandom() * 8 + 2;
      const geometry = new THREE.BoxGeometry(sizeDebris, sizeDebris * 0.6, sizeDebris * 0.3);
      const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.05 + nextRandom() * 0.1, 0.3, 0.25 + nextRandom() * 0.2),
        metalness: 0.6 + nextRandom() * 0.3,
        roughness: 0.5 + nextRandom() * 0.3
      });

      const debris = new THREE.Mesh(geometry, material);
      debris.position.set(x, y, z);
      debris.rotation.set(
        nextRandom() * Math.PI * 2,
        nextRandom() * Math.PI * 2,
        nextRandom() * Math.PI * 2
      );
      debris.userData = { type: "debris" };

      terrain.add(debris);
    }
    sceneNeedsUpdate = true;
  }

  generateTerrain();

  // Helper function to get shortest angle difference
  function shortestAngleDifference(from, to) {
    let diff = to - from;
    // Normalize to [-π, π]
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    return diff;
  }

  // Smooth movement
  function smoothMove(object, targetX, targetY, targetZ, duration = 500) {
    // Capture state before movement
    captureState();
    
    const startPosition = object.position.clone();
    const startTime = performance.now();
    const startHeading = object.userData.heading || 0;
    
    // Calculate target heading (angle to face the destination)
    const dx = targetX - startPosition.x;
    const dz = targetZ - startPosition.z;
    const targetHeading = Math.atan2(dx, dz) + Math.PI;
    
    // Calculate shortest angle difference
    const angleDiff = shortestAngleDifference(startHeading, targetHeading);
    
    function animate() {
      const elapsed = performance.now() - startTime;
      const t = Math.min(elapsed / duration, 1);
      
      // During first 33% of movement: turn and move
      // After 33%: just move to position
      if (t <= 0.33) {
        // Turn towards target during first 33%, taking shortest path
        object.userData.heading = startHeading + angleDiff * (t / 0.33);
        object.rotation.y = object.userData.heading;
      }
      
      // Always move towards target
      object.position.lerpVectors(startPosition, new THREE.Vector3(targetX, targetY, targetZ), t);
      sceneNeedsUpdate = true;
  
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        // Ensure final heading is set
        object.userData.heading = targetHeading;
        object.rotation.y = targetHeading;
      }
    }
  
    animate();
  }

  // Track mouse position for distinguishing clicks from drags
  let mouseDownPos = { x: 0, y: 0 };
  let mouseUpPos = { x: 0, y: 0 };
  const DRAG_THRESHOLD = 5; // pixels
  
  renderer.domElement.addEventListener('mousedown', (event) => {
    mouseDownPos.x = event.clientX;
    mouseDownPos.y = event.clientY;
  });
  
  renderer.domElement.addEventListener('mouseup', (event) => {
    mouseUpPos.x = event.clientX;
    mouseUpPos.y = event.clientY;
  });
  
  renderer.domElement.addEventListener('click', (event) => {
      event.preventDefault();
      
      // Check if this was a drag (camera movement) or a click
      const dragDistance = Math.sqrt(
        Math.pow(mouseUpPos.x - mouseDownPos.x, 2) + 
        Math.pow(mouseUpPos.y - mouseDownPos.y, 2)
      );
      
      // If dragged more than threshold, ignore the click
      if (dragDistance > DRAG_THRESHOLD) {
        return;
      }
	   
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
      raycaster.setFromCamera(mouse, camera);
  
      // First check if clicking on any ship (for selection/deselection)
      const intersects = raycaster.intersectObjects([...players.children, ...enemies.children], true);
		  
          // Filter out name labels and range visuals (circles, arcs, etc.)
          const validIntersects = intersects.filter(i => {
            if (i.object.userData.isNameLabel) return false;
            
            // Check if this object is part of RangeVisuals group
            let current = i.object;
            while (current) {
              if (current.name === "RangeVisuals") return false;
              if (current.userData.isSpeedRing || current.userData.isShortRange || 
                  current.userData.isShieldSphere || current.userData.isRangeArc) return false;
              current = current.parent;
            }
            return true;
          });
          
          if (validIntersects.length > 0) {
              // Find the actual ship object (parent if needed)
              let shipObject = validIntersects[0].object;
              
              // If we hit a child mesh, find the parent ship
              while (shipObject && shipObject.userData.type !== "player" && shipObject.userData.type !== "Enemy") {
                shipObject = shipObject.parent;
              }
              
              if (!shipObject) shipObject = validIntersects[0].object.parent || validIntersects[0].object;
          
              // Check if clicking on the same ship - deselect it
              if (selectedPlayer === shipObject) {
                // Restore materials and deselect
                if (selectedPlayer.isMesh && originalMaterial) {
                  selectedPlayer.material = originalMaterial;
                } else if (originalMaterials.length > 0) {
                  let matIdx = 0;
                  selectedPlayer.traverse((node) => {
                    if (node.isMesh && matIdx < originalMaterials.length) {
                      node.material = originalMaterials[matIdx++];
                    }
                  });
                }
                hideHoverIndicator();
                selectedPlayer = null;
                originalMaterial = null;
                originalMaterials = [];
                updateInfoPanel(null);
                sceneNeedsUpdate = true;
                console.log('Deselected ship');
                return; // Exit early, don't process movement
              } else {
                // Selecting a different ship
                // Restore previous selection's materials
                if (selectedPlayer) {
                  if (selectedPlayer.isMesh && originalMaterial) {
                    selectedPlayer.material = originalMaterial;
                  } else if (originalMaterials.length > 0) {
                    let matIdx = 0;
                    selectedPlayer.traverse((node) => {
                      if (node.isMesh && matIdx < originalMaterials.length) {
                        node.material = originalMaterials[matIdx++];
                      }
                    });
                  }
                  hideHoverIndicator();
                }
            
                // Save new selection's materials
                selectedPlayer = shipObject;
                originalMaterials = [];
                
                if (selectedPlayer.isMesh) {
                  originalMaterial = selectedPlayer.material;
                } else {
                  // For complex models, save all mesh materials (as clones to preserve originals)
                  selectedPlayer.traverse((node) => {
                    if (node.isMesh && node.material) {
                      originalMaterials.push(node.material);
                    }
                  });
                }
            
                // Apply selection highlight using the ship's base color
                const baseColor = selectedPlayer.userData.color || 0x00ffff;
                const newMat = new THREE.MeshStandardMaterial({
                    color: baseColor,
                    emissive: baseColor,

                    metalness: 0.3,
                    roughness: 0.5
                });
                
                if (selectedPlayer.isMesh) {
                  selectedPlayer.material = newMat;
                } else {
                  // For complex models, apply to all meshes except RangeVisuals
                  selectedPlayer.traverse((node) => {
                    if (node.isMesh && node.parent?.name !== "RangeVisuals") {
                      node.material = newMat.clone();
                    }
                  });
                }
            
                updateInfoPanel(selectedPlayer);
                updateRotationDisplay();
                
                // Check if range visuals need to be updated based on current userData
                const rangeVisuals = selectedPlayer.children.find(child => child.name === 'RangeVisuals');
                if (rangeVisuals) {
                  console.log('Checking range visuals sync:', {
                    stored: rangeVisuals.userData.attributes,
                    current: {
                      shield: selectedPlayer.userData.shield,

                      rear: selectedPlayer.userData.rear
                    }
                  });
                  
                  // Check if attributes have changed since range visuals were created
                  const needsUpdate = !rangeVisuals.userData.attributes || 
                    rangeVisuals.userData.attributes.shield !== selectedPlayer.userData.shield ||
                    rangeVisuals.userData.attributes.speed !== selectedPlayer.userData.speed ||
                    rangeVisuals.userData.attributes.shortRange !== selectedPlayer.userData.shortRange ||
                    rangeVisuals.userData.attributes.longRange !== selectedPlayer.userData.longRange ||
                    rangeVisuals.userData.attributes.front !== selectedPlayer.userData.front ||
                    rangeVisuals.userData.attributes.side !== selectedPlayer.userData.side ||
                    rangeVisuals.userData.attributes.rear !== selectedPlayer.userData.rear;
                  
                  console.log('Needs update?', needsUpdate);
                  
                  if (needsUpdate) {
                    console.log('Range visuals out of sync, recreating...');
                    const wasVisible = rangeVisuals.visible;
                    selectedPlayer.remove(rangeVisuals);
                    
                    const attributes = {
                      speed: selectedPlayer.userData.speed,

                      front: selectedPlayer.userData.front,
                      side: selectedPlayer.userData.side,

                    };
                    const color = selectedPlayer.userData.color || 0x00ffff;
                    // Get the ship's current scale to maintain correct visual proportions

                    selectedPlayer.add(newRangeVisuals);

              }
          }
          
          // If we reach here, either no ship was clicked or we're switching selection
          // If a ship is selected and we clicked empty space, try to move
          if (selectedPlayer) {
              const terrainIntersects = raycaster.intersectObjects(terrain.children, true);
              const planeIntersects = raycaster.intersectObject(plane, true);
              const size = selectedPlayer.userData.size || 20;
  
              let targetX, targetZ;
              
              if (terrainIntersects.length > 0) {
                  targetX = terrainIntersects[0].point.x;
                  targetZ = terrainIntersects[0].point.z;
              } else if (planeIntersects.length > 0) {
                  targetX = planeIntersects[0].point.x;
                  targetZ = planeIntersects[0].point.z;
              }
              
              if (targetX !== undefined && targetZ !== undefined) {
                  const validPosition = findNearestValidPosition(targetX, targetZ, size);
                  const targetY = getCorrectYPosition(validPosition.x, validPosition.z, size);
                  smoothMove(selectedPlayer, validPosition.x, targetY, validPosition.z, 1500);
                  updateInfoPanel(null);
                  
                  hideHoverIndicator();
                  // Restore original materials
                  if (selectedPlayer.isMesh && originalMaterial) {
                    selectedPlayer.material = originalMaterial;
                  } else if (originalMaterials.length > 0) {
                    let matIdx = 0;
                    selectedPlayer.traverse((node) => {
                      if (node.isMesh && matIdx < originalMaterials.length) {
                        node.material = originalMaterials[matIdx++];
                      }
                    });
                  }
                  selectedPlayer = null;
                  originalMaterial = null;
                  originalMaterials = [];

              }
          } else {
              // Deselect if clicking on nothing and nothing is selected
              if (selectedPlayer) {
                if (selectedPlayer.isMesh && originalMaterial) {
                  selectedPlayer.material = originalMaterial;
                } else if (originalMaterials.length > 0) {
                  let matIdx = 0;
                  selectedPlayer.traverse((node) => {
                    if (node.isMesh && matIdx < originalMaterials.length) {
                      node.material = originalMaterials[matIdx++];
                    }
                  });
                }
                hideHoverIndicator();
                selectedPlayer = null;
                originalMaterial = null;
                originalMaterials = [];
                sceneNeedsUpdate = true;
                updateInfoPanel(null);
              }
          }
  });

  let lastMouseMoveTime = 0;
  const MOUSE_MOVE_THROTTLE = 50;
  
  renderer.domElement.addEventListener('mousemove', (event) => {
      const now = performance.now();
      if (now - lastMouseMoveTime < MOUSE_MOVE_THROTTLE) {
          return;
      }
      lastMouseMoveTime = now;
      
      if (!selectedPlayer) {
          hideHoverIndicator();
          return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const terrainIntersects = raycaster.intersectObjects(terrain.children, true);
      const planeIntersects = raycaster.intersectObject(plane, true);
      const size = selectedPlayer.userData.size || 20;

      let targetX, targetZ;

      if (terrainIntersects.length > 0) {
          targetX = terrainIntersects[0].point.x;
          targetZ = terrainIntersects[0].point.z;
      } else if (planeIntersects.length > 0) {
          targetX = planeIntersects[0].point.x;
          targetZ = planeIntersects[0].point.z;
      }

      if (targetX !== undefined && targetZ !== undefined) {
          const validPosition = findNearestValidPosition(targetX, targetZ, size);
          const targetY = getCorrectYPosition(validPosition.x, validPosition.z, size);
          const shipColor = selectedPlayer.userData.color || 0x00ffff;
          const indicatorSize = 20;
          showHoverIndicator(validPosition.x, targetY - size + 2, validPosition.z, indicatorSize, shipColor);
          sceneNeedsUpdate = true;
      } else {
          hideHoverIndicator();
      }
  });

  // Render loop with dirty flag optimization
  function animate() {
    requestAnimationFrame(animate);
	controls.update();
    updateHoverIndicator();
    updateRangeVisuals();
    
    // Only render if scene needs update
    if (sceneNeedsUpdate) {
      renderer.render(scene, camera);
      sceneNeedsUpdate = false;
    }
  }
    
	
  createLetterNumberGrid();
  animate();
    
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    sceneNeedsUpdate = true;
  });
  
  
  loadMapBtn.onclick = () => {
    console.log("📂 Load map");
    fileInput2.click();
  };

  fileInput2.onchange = (e) => {
    console.log("📂 File input changed!");

    const file = e.target.files[0];
    if (!file) {
      console.warn("⚠️ No file selected");
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      console.log("📂 File read");
      let data;
      try {
        data = JSON.parse(reader.result);
        console.log("✅ JSON loaded:", data);
      } catch (err) {
        console.error("❌ JSON parse error:", err);
        showToast("❌ Invalid file format!", 'error');
        return;
      }

      players.clear();
      enemies.clear();
      
      if (data.seed !== undefined) {
        setSeed(data.seed);
        generateTerrain();
      }

      requestAnimationFrame(async () => {
        for (const item of data.players) {
          const colorNum = typeof item.color === 'string' && item.color.startsWith('#') 
            ? parseInt(item.color.slice(1), 16) 
            : (typeof item.color === 'number' ? item.color : parseInt(item.color, 16));
          const modelType = item.modelType || 'gemini3_anim1_draco.glb';
          const ship = await createPlayer(item.position.x, item.position.z, colorNum, item.name, item.size, {
            speed: item.speed,
            shield: item.shield,
            shortRange: item.shortRange,
            longRange: item.longRange,
            front: item.front,
            side: item.side,
            rear: item.rear
          }, modelType);
          if (item.position.y !== undefined) {
            ship.position.y = item.position.y;
            ship.userData.y = item.position.y;
          }
          if (item.heading !== undefined) {
            ship.userData.heading = item.heading;
            ship.rotation.y = item.heading;
          }
          if (item.showRanges !== undefined) {
            ship.userData.showRanges = item.showRanges;
            const rangeVisuals = ship.children.find(child => child.name === 'RangeVisuals');
            if (rangeVisuals) {
              rangeVisuals.visible = item.showRanges;
            }
          }
        }

        for (const item of data.enemies) {
          const colorNum = typeof item.color === 'string' && item.color.startsWith('#') 
            ? parseInt(item.color.slice(1), 16) 
            : (typeof item.color === 'number' ? item.color : parseInt(item.color, 16));
          const modelType = item.modelType || 'gemini3_anim1_draco.glb';
          const ship = await createEnemy(item.position.x, item.position.z, colorNum, item.name, item.size, {
            speed: item.speed,
            shield: item.shield,
            shortRange: item.shortRange,
            longRange: item.longRange,
            front: item.front,
            side: item.side,
            rear: item.rear
          }, modelType);
          if (item.position.y !== undefined) {
            ship.position.y = item.position.y;
            ship.userData.y = item.position.y;
          }
          if (item.heading !== undefined) {
            ship.userData.heading = item.heading;
            ship.rotation.y = item.heading;
          }
          if (item.showRanges !== undefined) {
            ship.userData.showRanges = item.showRanges;
            const rangeVisuals = ship.children.find(child => child.name === 'RangeVisuals');
            if (rangeVisuals) {
              rangeVisuals.visible = item.showRanges;
            }
          }
        }

        sceneNeedsUpdate = true;
      });

      showToast("✅ Load successful!");
    };
    reader.readAsText(file);
  };

  // Save
  saveMapBtn.onclick = () => {
    const mapData = {
      seed: globalSeed,
      players: [],
      enemies: []
    };
  
    players.children.forEach(obj => {
      // Get color from userData, or fallback to extracting from mesh material
      let colorHex = '#0000ff';
      if (obj.userData.color !== undefined) {
        // Convert stored color (hex number or string) to hex string
        if (typeof obj.userData.color === 'string') {
          colorHex = obj.userData.color.startsWith('#') ? obj.userData.color : '#' + obj.userData.color;
        } else {
          colorHex = '#' + obj.userData.color.toString(16).padStart(6, '0');
        }
      } else {
        // Fallback: extract from mesh material
        obj.traverse((node) => {
          if (colorHex === '#0000ff' && node.isMesh && node.material && node.material.color) {
            colorHex = '#' + node.material.color.getHexString();
          }
        });
      }
      
      mapData.players.push({
        name: obj.userData.name,
        size: obj.userData.size,
        color: colorHex,
        modelType: obj.userData.modelType || 'gemini3_anim1_draco.glb',
        heading: obj.userData.heading || 0,
        speed: obj.userData.speed || 0,
        shield: obj.userData.shield || 0,
        shortRange: obj.userData.shortRange || 0,
        longRange: obj.userData.longRange || 0,
        front: obj.userData.front || 0,
        side: obj.userData.side || 0,
        rear: obj.userData.rear || 0,
        showRanges: obj.userData.showRanges !== undefined ? obj.userData.showRanges : true,
        position: {
          x: obj.position.x,
          y: obj.position.y,
          z: obj.position.z
        }
      });
    });
  
    enemies.children.forEach(obj => {
      // Get color from userData, or fallback to extracting from mesh material
      let colorHex = '#ff0000';
      if (obj.userData.color !== undefined) {
        // Convert stored color (hex number or string) to hex string
        if (typeof obj.userData.color === 'string') {
          colorHex = obj.userData.color.startsWith('#') ? obj.userData.color : '#' + obj.userData.color;
        } else {
          colorHex = '#' + obj.userData.color.toString(16).padStart(6, '0');
        }
      } else {
        // Fallback: extract from mesh material
        obj.traverse((node) => {
          if (colorHex === '#ff0000' && node.isMesh && node.material && node.material.color) {
            colorHex = '#' + node.material.color.getHexString();
          }
        });
      }
      
      mapData.enemies.push({
        name: obj.userData.name,
        size: obj.userData.size,
        color: colorHex,
        modelType: obj.userData.modelType || 'gemini3_anim1_draco.glb',
        heading: obj.userData.heading || 0,
        speed: obj.userData.speed || 0,
        shield: obj.userData.shield || 0,
        shortRange: obj.userData.shortRange || 0,
        longRange: obj.userData.longRange || 0,
        front: obj.userData.front || 0,
        side: obj.userData.side || 0,
        rear: obj.userData.rear || 0,
        showRanges: obj.userData.showRanges !== undefined ? obj.userData.showRanges : true,
        position: {
          x: obj.position.x,
          y: obj.position.y,
          z: obj.position.z
        }
      });
    });
  
    const now = new Date();
    const formatter = new Intl.DateTimeFormat('en-CA');
    const filename = `tournament ${formatter.format(now)}.json`;

    const blob = new Blob([JSON.stringify(mapData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

</script>
