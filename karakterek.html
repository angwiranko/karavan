<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Karakterek - Vulturii Szent Karaván</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Share+Tech+Mono&display=swap" rel="stylesheet"> 
  <link rel="stylesheet" href="https://use.typekit.net/xmi4cwr.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: "Orbitron", sans-serif;
      font-weight: 900;
      font-style: normal;
      font-optical-sizing: auto;
      color: #ffee55;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: auto;
      background-color: #000;
    }

    #characterPanel {
      position: relative;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100%;
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      overflow-y: auto;
      padding: 20px;
    }

    #characterPanel.hidden-portraits .portrait-wrapper {
      display: none;
    }

    #characterGrid {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
      gap: 16px;
    }

    .ceszkoz {
      color: #f9eaa3;
      font-size: 20px;
      padding-top: 4px;
      padding-bottom: 4px;
    }

    .ceszkoz h3 {
      color: #ffee55;
      font-size: 14px;
    }

    .clabel {
      color: #fff;
      font-size: 14px;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      max-width: 300px;
      background: radial-gradient(ellipse at top left, #222 60%, #000 100%);
      padding: 20px;
      border: 2px solid #ffaa00;
      border-radius: 10px;
    }

    .dice-row {
      display: flex;
      gap: 12px;
      padding: 8px;
      flex-wrap: wrap;
    }

    .dice {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #ffaa00;
      transition: transform 0.1s;
    }

    .dice.active {
      color: #000;
    }

    .dice.active img {
      filter: drop-shadow(0 0 5px #ffaa00);
      transition: filter 0.2s, opacity 0.2s;
    }

    .dice.inactive img {
      filter: grayscale(1) brightness(0.5);
      opacity: 0.4;
    }

    @keyframes shake {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-2px, 1px); transform: rotate(20deg); }
      50%  { transform: translate(2px, -1px); transform: rotate(-20deg);}
      75%  { transform: translate(-1px, 2px); transform: rotate(0deg);}
      100% { transform: translate(0, 0); }
    }

    .shake {
      animation: shake 0.3s ease;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .loot-item {
      margin-right: 0px;
      padding: 4px 4px;
      border: 1px solid #ffaa00;
      border-radius: 6px;
      cursor: pointer;
      color: #ffee55;
      font-size: 13px;
      background: #222;
    }

    .loot-item.faded {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .sci-button {
      font-family: "Orbitron", sans-serif;
      background: linear-gradient(145deg, #1a1a1a, #2b2b2b);
      color: #ffee55;
      border: 2px solid #666;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-shadow: 0 0 3px #000;
      box-shadow: 0 0 10px #ffaa00;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s;
      width: auto;
      height: auto;
      white-space: nowrap;
    }

    .sci-button:hover {
      background: #333;
    }

    .sci-button img {
      width: 24px;
      height: 24px;
      filter: brightness(1.5);
    }

    #infoTitle {
      margin-top: 8px;
      margin-bottom: 8px;
      letter-spacing: 0.1em;
      font-family: "Orbitron", sans-serif;
      font-size: 1.2em;
      font-weight: 900;
      color: #ffee55;
    }

    .info-section {
      font-family: "Share Tech Mono", monospace;
      font-weight: 400;
      margin-bottom: 12px;
      padding: 0px;
    }

    .info-section strong {
      display: inline;
      margin-right: 6px;
      font-size: 14px;
      color: #ffee55;
      margin-bottom: 4px;
      padding-top: 4px;
      padding-bottom: 4px;
    }

    .info-section p,
    .info-section div {
      font-size: 14px;
      margin: 0;
    }

    .portrait-wrapper {
      text-align: center;
    }

    .portrait-wrapper img {
      border-radius: 6px;
      margin-bottom: 10px;
    }

    #inputFile {
      display: none;
    }
  </style>
</head>
<body>
  <div id="characterPanel">
    <div class="top-buttons">
      <button id="backToCanvas" class="sci-button">Vissza</button>
      <button id="resetdiceButton" class="sci-button">Reset</button>
      <button id="undoButton" class="sci-button">Undo</button>
      <button id="exportButton" class="sci-button">Export</button>
      <input type="file" id="inputFile" />
      <button id="importButton" class="sci-button">Load</button>
      <button id="hidepixButton" class="sci-button">Hide</button>
    </div>
    <div id="characterGrid"></div>
  </div>

  <script>
    // State management
    let state = {};
    let lastState = {};

    function saveState() {
      localStorage.setItem("diceState", JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem("diceState");
      state = saved ? JSON.parse(saved) : {};
      lastState = JSON.parse(JSON.stringify(state));
    }

    loadState();

    const characterPanel = document.getElementById('characterPanel');
    const characterGrid = document.getElementById('characterGrid');
    const resetBtn = document.getElementById('resetdiceButton');
    const undoBtn = document.getElementById('undoButton');
    const exportBtn = document.getElementById('exportButton');
    const importBtn = document.getElementById('importButton');
    const importInput = document.getElementById('inputFile');

    function profitTemplate(value) {
      return `
        <div id="infoProfitContainer">
          <div id="infoProfitIcon">
            <div class="profit-label">PROFIT</div>
            <div id="infoProfit">${value}</div>
          </div>
        </div>
      `;
    }

    // Karakterek betöltése Google Sheets-ből
    async function loadCharacters() {
      const sheetUrl = "https://docs.google.com/spreadsheets/d/1HS2z9dVFxzIzQCb3Ix2e7fDNlU_unGRhQncjLFmzrN0/gviz/tq?gid=835830883&tqx=out:json";
      const res = await fetch(sheetUrl);
      const text = await res.text();
      const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\((.*)\);/)[1]);
      const table = json.table;
      const headers = table.cols.map(c => c.label.toLowerCase());
      const data = table.rows.map(row => Object.fromEntries(row.c.map((cell, i) => [headers[i], cell?.v ?? ""])));

      characterGrid.innerHTML = "";
      data.forEach(char => {
        const card = document.createElement("div");
        card.className = "character-card";

        const lootItems = (char.loot || "").split(",").map(i => i.trim()).filter(Boolean);

        card.innerHTML = `
          <h2 id="infoTitle" style="text-align:center">${char.nev}</h2>
          <div class="info-section portrait-wrapper" style="text-align:center;">
            <img src="/images/${char.portre}" style="width: 250px; border-radius: 6px; margin-bottom: 10px;" />
          </div>
          <div class="info-section">
            <p style="height:7.5ex;">${char.leiras}</p>
            <p style="margin-top:8px; text-align:center";><strong style="color:#f9eaa3;">-==TALENTUM==-</strong></p>
            <div class="dice-row" id="willContainer-${char.id}-kockak9"></div>
            <p>⮡ ${char.kepesseg1}</p>
            <p>⮡ ${char.kepesseg2}</p>
            <p>⮡ ${char.kepesseg3}</p>

            <p style="margin-top:8px; text-align:center;"><strong style="color: #f9eaa3;">-==BEVÉTEL==-</strong></p>

            <div class="ceszkoz"><h3>${char.factorium1}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak1"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo1}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium2}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak2"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo2}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium3}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak3"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo3}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium4}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak4"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo4}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium5}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak5"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo5}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium6}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak6"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo6}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium7}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak7"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo7}</span>
            </div>

            <div class="ceszkoz"><h3>${char.factorium8}</h3>
            <div class="dice-row" id="diceContainer-${char.id}-kockak8"></div>
            <span class="clabel">⮡ Felügyelő: ${char.felugyelo8}</span>

            </div>

            <div class="ceszkoz"><p style="color: #f9eaa3; margin-top:8px";><strong>Loot:</strong></p>
              <div id="loot-${char.id}" class="dice-row"></div>
            </div>
          </div>
          ${profitTemplate(char.profit)}
        `;

        characterGrid.appendChild(card);

        const lootDiv = document.getElementById(`loot-${char.id}`);
        lootDiv.className = "dice-row";
        lootDiv.id = `loot-${char.id}`;

        lootItems.forEach(item => {
          const span = document.createElement("span");
          span.textContent = item;
          span.className = "loot-item";
          const isFaded = (state[char.id]?.lootFaded || []).includes(item);
          if (isFaded) span.classList.add("faded");

          span.onclick = () => {
            lastState = JSON.parse(JSON.stringify(state));
            state[char.id] = state[char.id] || {};
            state[char.id].lootFaded = state[char.id].lootFaded || [];

            if (state[char.id].lootFaded.includes(item)) {
              state[char.id].lootFaded = state[char.id].lootFaded.filter(i => i !== item);
            } else {
              state[char.id].lootFaded.push(item);
            }
            saveState();
            loadCharacters();
          };

          lootDiv.appendChild(span);
        });

        for (let i = 1; i <= 1; i++) {
          const row = document.createElement("div");
          row.className = "dice-row";
          const val = Number(state[char.id]?.[`kockak9`] ?? char[`kockak9`] ?? 0);
          const container = document.getElementById(`willContainer-${char.id}-kockak9`);
          if (container) {

            container.innerHTML = "";
            for (let j = 1; j <= 3; j++) {
              const w = document.createElement("div");
              w.className = "dice";
              if (j <= val) {
                w.classList.add("active");
              } else {
                w.classList.add("inactive");
              }

              const img = document.createElement("img");
              img.src = "https://img.icons8.com/office/40/fire-element--v1.png";
              img.style.width = "28px";
              img.style.height = "28px";
              img.style.pointerEvents = "none";
              w.appendChild(img);

              w.onclick = () => {
                lastState = JSON.parse(JSON.stringify(state));
                state[char.id] = state[char.id] || {};
                const current = state[char.id]?.[`kockak9`] ?? char[`kockak9`];
                if (j <= current) {
                  state[char.id][`kockak9`] = j - 1;
                } else {
                  state[char.id][`kockak9`] = j;
                }
                const img = w.querySelector("img");
                if (img) {
                  img.classList.remove("shake");
                  void img.offsetWidth;
                  img.classList.add("shake");
                  setTimeout(() => img.classList.remove("shake"), 300);
                }
                saveState();
                loadCharacters();
              };
              container.appendChild(w);
            }
          }
        }

        for (let i = 1; i <= 9; i++) {
          const row = document.createElement("div");
          row.className = "dice-row";
          const val = Number(state[char.id]?.[`kockak${i}`] ?? char[`kockak${i}`] ?? 0);
          const container = document.getElementById(`diceContainer-${char.id}-kockak${i}`);
          if (container) {

            container.innerHTML = "";
            for (let j = 1; j <= 6; j++) {
              const d = document.createElement("div");
              d.className = "dice";
              if (j <= val) {
                d.classList.add("active");
              } else {
                d.classList.add("inactive");
              }

              const img = document.createElement("img");
              img.src = "https://img.icons8.com/color/48/dice.png";
              img.style.width = "28px";
              img.style.height = "28px";
              img.style.pointerEvents = "none";
              d.appendChild(img);

              d.onclick = () => {
                lastState = JSON.parse(JSON.stringify(state));
                state[char.id] = state[char.id] || {};
                const current = state[char.id]?.[`kockak${i}`] ?? char[`kockak${i}`];
                if (j <= current) {
                  state[char.id][`kockak${i}`] = j - 1;
                } else {
                  state[char.id][`kockak${i}`] = j;
                }
                const img = d.querySelector("img");
                if (img) {
                  img.classList.remove("shake");
                  void img.offsetWidth;
                  img.classList.add("shake");
                  setTimeout(() => img.classList.remove("shake"), 300);
                }
                saveState();
                loadCharacters();
              };
              container.appendChild(d);
            }
          }
        }
      });
    }

    // Back button
    document.getElementById('backToCanvas').addEventListener('click', () => {
      window.history.back();
    });

    resetBtn.onclick = () => {
      lastState = JSON.parse(JSON.stringify(state));
      state = {};
      localStorage.removeItem("diceState");
      loadCharacters();
    };

    undoBtn.onclick = () => {
      state = lastState;
      saveState();
      loadCharacters();
    };

    exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "diceState.json";
      a.click();
      URL.revokeObjectURL(url);
    };

    importBtn.onclick = () => importInput.click();
    importInput.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          state = JSON.parse(reader.result);
          saveState();
          loadCharacters();
        } catch (err) {
          alert("Hibás fájlformátum.");
        }
      };
      reader.readAsText(file);
    };

    document.getElementById('hidepixButton').addEventListener('click', () => {
      characterPanel.classList.toggle('hidden-portraits');
      const hidden = characterPanel.classList.contains('hidden-portraits');
      document.getElementById('hidepixButton').textContent = hidden ? 'Show' : 'Hide';
    });

    // Initialize
    loadCharacters();
  </script>
</body>
</html>
