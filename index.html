<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
  import { MeshoptDecoder } from 'https://unpkg.com/three@0.160.0/examples/jsm/libs/meshopt_decoder.module.js';

	//HUD váltó
	const statusEl = document.getElementById("hudStatus");
    let currentState = 0;
    const states = ["nominal", "warning", "abort"];
    const texts = ["NOMINAL", "WARNING", "ABORT"];

    setInterval(() => {
      currentState = (currentState + 1) % states.length;
      statusEl.className = `status ${states[currentState]}`;
      statusEl.textContent = texts[currentState];
    }, 5000);


	//timer
	let duration = 60 * 60;
    let remaining = duration;
    let timerInterval = null;
    let running = false;

    const display = document.getElementById('timerDisplay');
    const startPauseButton = document.getElementById('startPauseButton');
    const resetButton = document.getElementById('resetButton');
    const message = document.getElementById('timerMessage');

    function updateDisplay() {
      if (remaining <= 0) {
        return;
      }

      let output = '';
      if (remaining < 60) {
        output = `${String(remaining).padStart(2, '0')}s`;
      } else {
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');

        output = `${m}:${s}`;
      }

    }

      if (!running) {

        timerInterval = setInterval(() => {
          remaining--;
          updateDisplay();
          if (remaining <= 0) {
            clearInterval(timerInterval);
            message.textContent = 'ABORT';
            running = false;
            startPauseButton.textContent = 'Indít';
          }
        }, 1000);
        startPauseButton.textContent = 'Szünet';
        running = true;
      } else {
        clearInterval(timerInterval);
        startPauseButton.textContent = 'Indít';
        running = false;
      }
    }

		  lastGroupId = current.userData.groupId;

	function animate() {
	  requestAnimationFrame(animate);

	    if (selectedObject) updateTooltipPosition(selectedObject);
	    if (model && rotate) model.rotation.y += -0.0002;
		if (tooltipsVisible) {
		  allTooltips.forEach(({ element, target }) => {
			const vector = new THREE.Vector3();
			target.getWorldPosition(vector);
			vector.project(camera);

			const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
			const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
			element.style.left = `${x}px`;
			element.style.top = `${y}px`;
			
			// csak ha a tooltip a kamerában van
			if (
			  vector.z > 1 ||  // túl közel vagy mögöttünk
			  vector.z < -1 || // kamera mögött
			  vector.x < -1 || vector.x > 1 ||
			  vector.y < -1 || vector.y > 1
			) {
			  element.style.display = "none";  // elrejtés
			  return;
			}

			element.style.display = "block";  // mutatjuk újra, ha kell

			// Kamera távolság alapú méretezés
			const distance = camera.position.distanceTo(target.getWorldPosition(new THREE.Vector3()));

			// Táv alapján fontméret számítás
			const minSize = 2;
			const maxSize = 22;
			const scale = Math.max(minSize, maxSize - distance * 2);
			element.style.fontSize = `${scale}px`;
			element.style.transition = "font-size 0.2s";
					
			// ✨ áttetszőség dinamikusan, távolság alapján
			
			const minOpacity = 0;
			const maxOpacity = 0.95;
			const fadeStart = 1;
			const fadeEnd = 20;     

			const opacity =
			  distance < fadeStart
				? maxOpacity
				: distance > fadeEnd
				? minOpacity
				: maxOpacity - ((distance - fadeStart) / (fadeEnd - fadeStart)) * (maxOpacity - minOpacity);

			element.style.opacity = opacity.toFixed(2);
			console.log(`ID: ${resolveGroupId(target)} | distance: ${distance.toFixed(1)} | opacity: ${opacity.toFixed(2)}`);

			
			
		});
		
	}

	  controls.update();
	  renderer.render(scene, camera);
	  

	}
	
	//KAMERA KONTROLL
	function focusCameraOnGroup(group) {
	  const box = new THREE.Box3().setFromObject(group);
	  const center = new THREE.Vector3();
	  box.getCenter(center);

	  const size = box.getSize(new THREE.Vector3()).length();
	  const distance = size * 1.5;

	  const direction = new THREE.Vector3()
		.subVectors(camera.position, controls.target)
		.normalize();

	  const newPosition = new THREE.Vector3().addVectors(center, direction.multiplyScalar(distance));

	  controls.target.copy(center);
	  camera.position.copy(newPosition);
	  controls.update();
	}
	
	function findGroupByName(name) {
	  let found = null;
	  model.traverse(obj => {
		if (!found && obj.name === name) {
		  found = obj;
		}
	  });
	  return found;
	}
	
	function selectGroupById(groupId) {
  const group = findGroupByName(groupId);
  if (!group) {
    console.warn(`❌ Group '${groupId}' nem található`);
    return;
  }

  focusCameraOnGroup(group);
  clearSelection();

  selectedGroup = [];

  let representativeMesh = null;

  group.traverse(obj => {
    if (obj.isMesh) {
      if (!obj.userData.originalMaterial) {
        obj.userData.originalMaterial = obj.material;
        obj.material = obj.material.clone();
        obj.material.emissive = new THREE.Color(0xffaa00);
        obj.material.emissiveIntensity = 0.8;
      }
      selectedGroup.push(obj);
      if (!representativeMesh) representativeMesh = obj;
    }
  });

  // ➕ Hozzáadjuk ezt, hogy az animáció és tooltip működjön
  if (representativeMesh) {
    selectedObject = representativeMesh;
    previousSelection = representativeMesh;
  }

  const info = data.find(row =>
    row.id?.trim().toLowerCase() === groupId?.trim().toLowerCase()
  );

  if (info) {
    document.getElementById('infoTitle').textContent = info.nev || groupId;
    document.getElementById('infoDetails').textContent = info.leiras || 'Nincs leírás.';
    document.getElementById('infoBox').style.display = 'block';
    document.getElementById('infoPortrait').src = "images/" + (info.portre || "alap.jpg");
    document.getElementById('infoLeader').textContent = info.vezeto || 'ismeretlen vezető';
    document.getElementById('infoAbility').textContent = info.kepesseg || '';
    document.getElementById('infoHuberur').textContent = info.huberur || 'nincs';
    document.getElementById('infoProfit').textContent = "" + (info.profit || '?');

    document.getElementById('tooltipText').innerText = info.nev || groupId;
    tooltip.style.display = 'block';

    setTimeout(() => {
      updateTooltipPosition(representativeMesh || group);
    }, 100);
  } else {
    console.warn(`ℹ️ Nincs adat ehhez az ID-hez: ${groupId}`);
  }
}
	
	window.goToGroup = function(groupName) {
  const group = findGroupByName(groupName);
  if (!group) {
    console.warn(`❌ Group '${groupName}' nem található`);
    return;
  }

  focusCameraOnGroup(group);

  setTimeout(() => {
    const event = new MouseEvent('click', {
      clientX: window.innerWidth / 2,
      clientY: window.innerHeight / 2,
      bubbles: true,
      cancelable: true
    });
    document.querySelector('canvas').dispatchEvent(event);
  }, 300); // várunk kicsit, hogy a kamera odaérjen
};
