    }

      margin: 0;
      font-family: 'Orbitron', sans-serif;

      color: var(--text-primary);

      padding: clamp(16px, 3vw, 32px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    h1 {
      font-size: clamp(1.75rem, 2.5vw, 2.5rem);
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 204, 51, 0.35);

    .subtitle {
      font-size: clamp(1.1rem, 1.6vw, 1.35rem);
      color: var(--accent);
      margin: 0;
    }

    .location-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .location-selector label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 1px;
    }

    select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .alert-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;

      font-size: 0.95rem;
      letter-spacing: 1.5px;
    }

      gap: 10px;

      color: #201600;

      gap: 20px;

      align-items: start;
    }

      flex-direction: column;

    function cloneState(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function createItem(label, status = 'info', id = cryptoRandomId()) {
      return {
        id,
        label,
        status
      };
    }

    function cryptoRandomId() {
      return 'itm-' + Math.random().toString(16).slice(2, 10);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timeoutId);
      showToast.timeoutId = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function slugify(value) {
      return value
        .toString()
        .normalize('NFD')
        .replace(/\p{Diacritic}/gu, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)+/g, '');
    }

    function ensureItemIds(targetState) {
      targetState.locations.forEach(location => {
        location.sectors.forEach(sector => {
          sector.categories.forEach(category => {
            category.items.forEach(item => {
              if (!item.id) {
                item.id = cryptoRandomId();
              }
            });
          });
          if (!Array.isArray(sector.assetSlots)) {
            sector.assetSlots = ['inactive', 'inactive', 'inactive'];
          } else if (sector.assetSlots.length < 3) {
            sector.assetSlots = [...sector.assetSlots, ...Array(3 - sector.assetSlots.length).fill('inactive')];
          }
        });
      });
    }

    async function syncWithSheet(action, payload = {}, { silent = false } = {}) {
      if (!SHEET_API_URL) {
        console.info(`ℹ️ Sheet API URL nincs beállítva, kihagyva a(z) "${action}" szinkront.`);
        return { skipped: true };
      }

      try {
        const response = await fetch(SHEET_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            action,
            ...payload
          })
        });

        const rawText = await response.text();
        let data = null;
        try {
          data = rawText ? JSON.parse(rawText) : null;
        } catch (error) {
          console.warn('Nem JSON választ kaptunk a Google Apps Script-től:', rawText);
        }

        if (!response.ok || (data && data.success === false)) {
          const message = data?.message || `Sheet API hiba (${response.status})`;
          throw new Error(message);
        }

        if (!silent) {
          showToast('Mentve a Google Sheet-be.');
        }

        return data || { success: true };
      } catch (error) {
        console.error(`❌ Sheet szinkron hiba (${action}):`, error);
        if (!silent) {
          showToast('Nem sikerült szinkronizálni a Google Sheet-tel.');
        }
        throw error;
      }
    }

    async function reloadStateFromSheet({ silent = false } = {}) {
      const latest = await loadFromSheet();
      if (!latest) {
        if (!silent) {
          showToast('Nem sikerült frissíteni a Google Sheet adatait.');
        }
        return false;
      }

      ensureItemIds(latest);
      const previousLocationId = currentLocationId;
      state = latest;
      const fallbackLocation = state.locations.find(loc => loc.id === previousLocationId) || state.locations[0];
      currentLocationId = fallbackLocation ? fallbackLocation.id : previousLocationId;
      populateLocationSelect();
      renderLocation(currentLocationId);
      if (!silent) {
        showToast('Adatok frissítve a Google Sheet-ből.');
      }
      return true;
    }

    function countInsiders(sector) {
      return sector.categories.reduce((total, category) => (
        total + category.items.filter(item => item.status === 'insider').length
      ), 0);
    }

    function saveState() {
      // Disabled - using Google Sheets only
      // localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      console.log('💾 State save disabled - using Google Sheets only');
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        ensureItemIds(parsed);
        return parsed;
      } catch (error) {
        console.warn('Nem sikerült betölteni a mentett állapotot', error);
        return null;
      }
    }

    async function loadFromSheet() {
      if (!SHEET_URL) return null;
      try {
        console.log('🔄 Fetching from Google Sheets:', SHEET_URL);
        // CSV export URL formátum: https://docs.google.com/spreadsheets/d/SPREADSHEET_ID/export?format=csv&gid=SHEET_GID
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        console.log('📄 Raw CSV data:', text.substring(0, 200) + '...');
        
        // CSV parsing
        const lines = text.trim().split('\n');
        console.log('📊 CSV lines count:', lines.length);
        const headers = lines[0].split(',').map(header => slugify(header.replace(/"/g, '')));
        console.log('📋 Headers found:', headers);
        const rows = lines.slice(1).map(line => {
          const values = line.split(',').map(value => value.replace(/"/g, ''));
          return Object.fromEntries(values.map((value, index) => [headers[index], value]));
        });
        console.log('🔢 Data rows count:', rows.length);

        const sheetState = { locations: [] };
        const locationMap = new Map();

        rows.forEach(entry => {
          const locationName = entry.location || entry.helyszin || entry.location_name;
          const sectorName = entry.sektor || entry.sector || entry.negyed;
          const categoryName = entry.kategoria || entry.category;
          const itemLabel = entry.tartalom || entry.item || entry.nev;
          if (!locationName || !sectorName || !categoryName || !itemLabel) {
            return;
          }

          const locationId = slugify(entry.location_id || locationName);
          const sectorId = slugify(entry.sector_id || sectorName);
          const categoryId = slugify(entry.category_id || categoryName);
          const itemStatus = (entry.statusz || entry.status || 'info').toLowerCase() === 'insider' ? 'insider' : 'info';

          if (!locationMap.has(locationId)) {
            const location = {
              id: locationId,
              name: entry.location_title || locationName,
              subtitle: entry.location_subtitle || '',
              alertLevel: Number(entry.riado || entry.alert || 0) || 0,
              sectors: []
            };
            locationMap.set(locationId, location);
            sheetState.locations.push(location);
          }

          const location = locationMap.get(locationId);
          let sector = location.sectors.find(sec => sec.id === sectorId);
          if (!sector) {
            sector = {
              id: sectorId,
              name: sectorName,
              order: Number(entry.sector_sorrend || entry.sector_order || 0) || 0,
              assetSlots: Array(3).fill('inactive'),
              categories: []
            };
            location.sectors.push(sector);
          }

          let category = sector.categories.find(cat => cat.id === categoryId);
          if (!category) {
            category = {
              id: categoryId,
              name: categoryName,
              order: Number(entry.category_sorrend || entry.category_order || 0) || 0,
              items: []
            };
            sector.categories.push(category);
          }

          const itemId = entry.item_id || entry.itemid || entry.id || entry.unique_id;
          category.items.push({
            id: itemId || cryptoRandomId(),
            label: itemLabel,
            status: itemStatus
          });
        });

        sheetState.locations.forEach(location => {
          location.sectors.sort((a, b) => a.order - b.order);
          location.sectors.forEach(sector => {
            sector.categories.sort((a, b) => a.order - b.order);
          });
        });

        ensureItemIds(sheetState);
        console.log('✅ Sheet state created with', sheetState.locations.length, 'locations');
        return sheetState.locations.length ? sheetState : null;
      } catch (error) {
        console.error('❌ Failed to load Google Sheet data:', error);
        return null;
      }
    }

    function mergeBaseIntoStored(stored, base) {
      const result = cloneState(stored);
      const locationIndex = new Map(result.locations.map(loc => [loc.id, loc]));

      base.locations.forEach(baseLocation => {
        let targetLocation = locationIndex.get(baseLocation.id);
        if (!targetLocation) {
          result.locations.push(cloneState(baseLocation));
          locationIndex.set(baseLocation.id, result.locations[result.locations.length - 1]);
          targetLocation = locationIndex.get(baseLocation.id);
        } else {
          targetLocation.name = baseLocation.name;
          targetLocation.subtitle = baseLocation.subtitle;
        }

        const sectorIndex = new Map(targetLocation.sectors.map(sector => [sector.id, sector]));
        baseLocation.sectors.forEach(baseSector => {
          let targetSector = sectorIndex.get(baseSector.id);
          if (!targetSector) {
            targetLocation.sectors.push(cloneState(baseSector));
            sectorIndex.set(baseSector.id, targetLocation.sectors[targetLocation.sectors.length - 1]);
            targetSector = sectorIndex.get(baseSector.id);
          } else {
            targetSector.name = baseSector.name;
          }

          const categoryIndex = new Map(targetSector.categories.map(cat => [cat.id, cat]));
          baseSector.categories.forEach(baseCategory => {
            let targetCategory = categoryIndex.get(baseCategory.id);
            if (!targetCategory) {
              targetSector.categories.push(cloneState(baseCategory));
              categoryIndex.set(baseCategory.id, targetSector.categories[targetSector.categories.length - 1]);
              targetCategory = categoryIndex.get(baseCategory.id);
            } else {
              targetCategory.name = baseCategory.name;
              baseCategory.items.forEach(baseItem => {
                if (!targetCategory.items.some(item => item.label === baseItem.label)) {
                  targetCategory.items.push(cloneState(baseItem));
                }
              });
            }
          });
        });
      });

      ensureItemIds(result);
      return result;
    }

    function populateLocationSelect() {
      locationSelect.innerHTML = '';
      state.locations.forEach(location => {
        const option = document.createElement('option');
        option.value = location.id;
        option.textContent = location.subtitle ? `${location.name} — ${location.subtitle}` : location.name;
        locationSelect.appendChild(option);
      });
      locationSelect.value = currentLocationId;
    }

    function renderAlert(location) {
      alertLevelsContainer.innerHTML = '';
      const levels = Array.from({ length: 6 }, (_, index) => index + 1);
      levels.forEach(level => {
        const die = document.createElement('div');
        die.className = 'alert-die';
        die.textContent = level;
        die.dataset.level = level;
        if (location.alertLevel >= level) {
          die.classList.add('active');
        }
        alertLevelsContainer.appendChild(die);
      });
    }

    function ensureAssetSlotsState(sector) {
      if (!Array.isArray(sector.assetSlots) || sector.assetSlots.length !== 3) {
        sector.assetSlots = Array(3).fill('inactive');
      }
      const insiders = countInsiders(sector);
      sector.assetSlots = sector.assetSlots.map((slot, index) => {
        if (index < insiders) {
          return slot === 'spent' ? 'spent' : 'available';
        }
        return 'inactive';
      });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderLocation(locationId) {
      const location = state.locations.find(loc => loc.id === locationId);
      if (!location) return;
      currentLocationId = location.id;
      locationTitle.textContent = location.name;
      locationSubtitle.textContent = location.subtitle || '';
      renderAlert(location);

      sectorContainer.innerHTML = '';
      location.sectors.forEach((sector, sectorIndex) => {
        ensureAssetSlotsState(sector);
        const card = document.createElement('section');
        card.className = 'sector-card';

        const header = document.createElement('div');
        header.className = 'sector-header';
        const title = document.createElement('h2');
        title.className = 'sector-title';
        title.textContent = sector.name;
        header.appendChild(title);
        card.appendChild(header);

        const content = document.createElement('div');
        content.className = 'sector-content';

        const assetTrack = document.createElement('div');
        assetTrack.className = 'asset-track';
        const assetLabel = document.createElement('h3');
        assetLabel.textContent = 'INSIDER SLOTOK';
        assetTrack.appendChild(assetLabel);
        const diceColumn = document.createElement('div');
        diceColumn.className = 'asset-dice';

        sector.assetSlots.forEach((slot, slotIndex) => {
          const die = document.createElement('div');
          die.className = 'asset-die';
          die.dataset.sectorIndex = sectorIndex;
          die.dataset.slotIndex = slotIndex;
          if (slot !== 'inactive') {
            die.classList.add('active');
          }
          if (slot === 'spent') {
            die.classList.add('spent');
          }
          diceColumn.appendChild(die);
        });
        assetTrack.appendChild(diceColumn);
        content.appendChild(assetTrack);

        const categoriesContainer = document.createElement('div');
        categoriesContainer.className = 'categories';

        sector.categories.forEach((category, categoryIndex) => {
          const categoryCard = document.createElement('div');
          categoryCard.className = 'category-card';

          const categoryHeader = document.createElement('div');
          categoryHeader.className = 'category-header';
          const categoryTitle = document.createElement('h3');
          categoryTitle.textContent = category.name;
          categoryHeader.appendChild(categoryTitle);
          categoryCard.appendChild(categoryHeader);

          const columns = document.createElement('div');
          columns.className = 'category-columns';

          const infoColumn = document.createElement('div');
          const infoTitle = document.createElement('div');
          infoTitle.className = 'column-title';
          infoTitle.textContent = 'INFO';
          const infoList = document.createElement('div');
          infoList.className = 'entry-list';

          const insiderColumn = document.createElement('div');
          const insiderTitle = document.createElement('div');
          insiderTitle.className = 'column-title';
          insiderTitle.textContent = 'INSIDER';
          const insiderList = document.createElement('div');
          insiderList.className = 'entry-list';

          category.items.forEach(item => {
            const chip = document.createElement('div');
            chip.className = `entry-chip ${item.status}`;
            chip.dataset.locationId = location.id;
            chip.dataset.sectorId = sector.id;
            chip.dataset.categoryId = category.id;
            chip.dataset.itemId = item.id;
            chip.innerHTML = `
              <span class="entry-label">${escapeHtml(item.label)}</span>
              <button class="entry-remove" title="Eltávolítás" aria-label="Eltávolítás">×</button>
            `;
            if (item.status === 'insider') {
              insiderList.appendChild(chip);
            } else {
              infoList.appendChild(chip);
            }
          });

          if (!infoList.children.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-message';
            empty.textContent = 'Nincs felvéve információ';
            infoList.appendChild(empty);
          }

          if (!insiderList.children.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-message';
            empty.textContent = 'Nincs aktív insider';
            insiderList.appendChild(empty);
          }

          infoColumn.appendChild(infoTitle);
          infoColumn.appendChild(infoList);
          insiderColumn.appendChild(insiderTitle);
          insiderColumn.appendChild(insiderList);

          columns.appendChild(infoColumn);
          columns.appendChild(insiderColumn);
          categoryCard.appendChild(columns);

          const form = document.createElement('form');
          form.className = 'category-add';
          form.dataset.locationId = location.id;
          form.dataset.sectorId = sector.id;
          form.dataset.categoryId = category.id;
          form.innerHTML = `
            <input type="text" placeholder="Új bejegyzés hozzáadása..." maxlength="160" required />
            <button type="submit">+</button>
          `;
          categoryCard.appendChild(form);

          categoriesContainer.appendChild(categoryCard);
        });

        content.appendChild(categoriesContainer);
        card.appendChild(content);
        sectorContainer.appendChild(card);
      });
    }

    function findCategory(locationId, sectorId, categoryId) {
      const location = state.locations.find(loc => loc.id === locationId);
      if (!location) return null;
      const sector = location.sectors.find(sec => sec.id === sectorId);
      if (!sector) return null;
      const category = sector.categories.find(cat => cat.id === categoryId);
      if (!category) return null;
      return { location, sector, category };
    }

    function buildSheetContext(location, sector, category) {
      const toNumberOrEmpty = value => {
        if (value === undefined || value === null || value === '') {
          return '';
        }
        const numeric = Number(value);
        return Number.isFinite(numeric) ? numeric : '';
      };

      return {
        locationId: location.id,
        locationName: location.name,
        locationTitle: location.name,
        locationSubtitle: location.subtitle || '',
        alertLevel: toNumberOrEmpty(location.alertLevel),
        sectorId: sector.id,
        sectorName: sector.name,
        sectorOrder: toNumberOrEmpty(sector.order),
        categoryId: category.id,
        categoryName: category.name,
        categoryOrder: toNumberOrEmpty(category.order)
      };
    }

    async function toggleItemStatus(locationId, sectorId, categoryId, itemId) {
      const found = findCategory(locationId, sectorId, categoryId);
      if (!found) return;
      const { location, sector, category } = found;
      const item = category.items.find(entry => entry.id === itemId);
      if (!item) return;

      const previousStatus = item.status;
      if (item.status === 'info') {
        const insiders = countInsiders(sector);
        if (insiders >= 3) {
          showToast('Maximálisan 3 insider lehet szektoronként.');
          return;
        }
        item.status = 'insider';
      } else {
        item.status = 'info';
      }
      ensureAssetSlotsState(sector);
      renderLocation(currentLocationId);

      const context = buildSheetContext(location, sector, category);

      try {
        const result = await syncWithSheet('update-status', {
          ...context,
          itemId,
          status: item.status,
          label: item.label
        }, { silent: true });

        if (result?.skipped) {
          showToast('Státusz módosítva (Sheet API nincs beállítva).');
        } else {
          showToast('Státusz mentve a Google Sheet-be.');
        }
      } catch (error) {
        item.status = previousStatus;
        ensureAssetSlotsState(sector);
        renderLocation(currentLocationId);
        await reloadStateFromSheet({ silent: true });
        showToast('Hiba történt, visszaállítottuk az állapotot.');
      }
    }

    async function removeItem(locationId, sectorId, categoryId, itemId) {
      const found = findCategory(locationId, sectorId, categoryId);
      if (!found) return;
      const { location, sector, category } = found;
      const context = buildSheetContext(location, sector, category);
      const index = category.items.findIndex(entry => entry.id === itemId);
      if (index === -1) return;
      const [removed] = category.items.splice(index, 1);
      ensureAssetSlotsState(sector);
      renderLocation(currentLocationId);

      try {
        const result = await syncWithSheet('remove-item', {
          ...context,
          itemId,
          label: removed?.label || '',
          status: removed?.status || ''
        }, { silent: true });

        if (result?.skipped) {
          showToast('Elem eltávolítva (Sheet API nincs beállítva).');
        } else {
          showToast('Elem törölve a Google Sheet-ben is.');
        }
      } catch (error) {
        if (removed) {
          category.items.splice(index, 0, removed);
          ensureAssetSlotsState(sector);
          renderLocation(currentLocationId);
        }
        await reloadStateFromSheet({ silent: true });
        showToast('Nem sikerült törölni, az adatokat visszaállítottuk.');
      }
    }

    async function addItem(locationId, sectorId, categoryId, label) {
      if (!label.trim()) return;
      const found = findCategory(locationId, sectorId, categoryId);
      if (!found) return;
      const { location, sector, category } = found;
      const newItem = createItem(label.trim());
      category.items.push(newItem);
      renderLocation(currentLocationId);

      const context = buildSheetContext(location, sector, category);

      try {
        const result = await syncWithSheet('add-item', {
          ...context,
          itemId: newItem.id,
          label: newItem.label,
          status: newItem.status
        }, { silent: true });

        if (result?.skipped) {
          showToast('Új bejegyzés hozzáadva (Sheet API nincs beállítva).');
        } else {
          showToast('Új bejegyzés mentve a Google Sheet-be.');
        }
      } catch (error) {
        const index = category.items.findIndex(item => item.id === newItem.id);
        if (index !== -1) {
          category.items.splice(index, 1);
        }
        renderLocation(currentLocationId);
        await reloadStateFromSheet({ silent: true });
        showToast('Nem sikerült hozzáadni, próbáld újra később.');
      }
    }

    function toggleAssetSlot(sectorIndex, slotIndex) {
      const location = state.locations.find(loc => loc.id === currentLocationId);
      if (!location) return;
      const sector = location.sectors[sectorIndex];
      if (!sector) return;
      const insiders = countInsiders(sector);
      if (slotIndex >= insiders) {
        showToast('Előbb jelölj insider státuszt az információk között.');
        return;
      }
      sector.assetSlots[slotIndex] = sector.assetSlots[slotIndex] === 'spent' ? 'available' : 'spent';
      saveState();
      renderLocation(currentLocationId);
    }

    alertLevelsContainer.addEventListener('click', event => {
      const die = event.target.closest('.alert-die');
      if (!die) return;
      const location = state.locations.find(loc => loc.id === currentLocationId);
      if (!location) return;
      const level = Number(die.dataset.level) || 0;
      location.alertLevel = location.alertLevel === level ? 0 : level;
      saveState();
      renderAlert(location);
    });

    sectorContainer.addEventListener('click', async event => {
      const removeBtn = event.target.closest('.entry-remove');
      if (removeBtn) {
        const chip = removeBtn.closest('.entry-chip');
        if (!chip) return;
        await removeItem(chip.dataset.locationId, chip.dataset.sectorId, chip.dataset.categoryId, chip.dataset.itemId);
        event.stopPropagation();
        return;
      }

      const chip = event.target.closest('.entry-chip');
      if (chip) {
        await toggleItemStatus(chip.dataset.locationId, chip.dataset.sectorId, chip.dataset.categoryId, chip.dataset.itemId);
        return;
      }

      const assetDie = event.target.closest('.asset-die');
      if (assetDie) {
        toggleAssetSlot(Number(assetDie.dataset.sectorIndex), Number(assetDie.dataset.slotIndex));
      }
    });

    sectorContainer.addEventListener('submit', async event => {
      const form = event.target.closest('.category-add');
      if (!form) return;
      event.preventDefault();
      const input = form.querySelector('input[type="text"]');
      if (!input) return;
      await addItem(form.dataset.locationId, form.dataset.sectorId, form.dataset.categoryId, input.value);
      input.value = '';
      input.focus();
    });

    locationSelect.addEventListener('change', event => {
      renderLocation(event.target.value);
      saveState();
    });

    // 🛠️ DEBUG: Uncomment this line to force using ONLY Google Sheets data (ignores localStorage)
    // localStorage.removeItem(STORAGE_KEY);

    (async function init() {
      const sheetState = await loadFromSheet();
      // Ignore localStorage - only use Google Sheets!

      console.log('🔄 Init state check:');
      console.log('📊 Sheet state exists:', !!sheetState);

      if (sheetState) {
        console.log('� Using sheet state (Google Sheets takes priority)');
        state = sheetState;
      } else if (savedState) {
        console.log('� Using saved state (no sheet data available)');
        state = savedState;
      } else if (savedState) {
        console.log('💾 Using saved state only');
        state = savedState;
      } else {
        console.log('🔧 Using fallback state');
        state = cloneState(fallbackState);
      }

      ensureItemIds(state);
      currentLocationId = state.locations[0]?.id || 'tartaros-starfort';
      populateLocationSelect();
      renderLocation(currentLocationId);
    })();
  </script>
</body>
