<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternity Gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --panel: rgba(18, 16, 16, 0.92);
      --border: #5a4930;
      --accent: #d8ad4b;
      --accent-bright: #f0cf77;
      --bone: #d8d0bf;
      --crimson: #6d1712;
      --silent: #9fadb3;
      --terra: #c9b56d;
      --mars: #b86a42;
      --text-primary: #efe8d6;
      --text-secondary: #aaa292;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.44);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background:
        linear-gradient(90deg, rgba(49, 11, 8, 0.24), rgba(0, 0, 0, 0) 22%, rgba(104, 83, 44, 0.13) 50%, rgba(0, 0, 0, 0) 78%, rgba(49, 11, 8, 0.22)),
        radial-gradient(circle at top, rgba(55, 45, 30, 0.72), rgba(5, 5, 9, 0.96)),
        url('images/starfort.jpg') center/cover fixed;
      color: var(--text-primary);
      padding: clamp(12px, 1.7vw, 24px);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.055) 0 1px, transparent 1px 7px),
        linear-gradient(90deg, transparent, rgba(216, 173, 75, 0.07) 50%, transparent);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent 74%);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1880px, 100%);
      min-height: calc(100vh - clamp(24px, 3.4vw, 48px));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(12px, 1.4vw, 18px);
    }

    header {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      align-items: end;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.65rem, 2.5vw, 3rem);
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 18px rgba(216, 173, 75, 0.24);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-secondary);
      font-size: clamp(0.78rem, 0.9vw, 0.95rem);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.08) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(28, 24, 20, 0.98), rgba(10, 10, 12, 0.98));
      color: var(--bone);
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(216, 173, 75, 0.08), 0 10px 26px rgba(0, 0, 0, 0.28);
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .nav-button:hover,
    .nav-button.active {
      border-color: rgba(255, 204, 51, 0.72);
      color: var(--accent-bright);
      box-shadow: inset 0 -3px 0 rgba(216, 173, 75, 0.58), 0 0 10px rgba(216, 173, 75, 0.16);
      transform: translateY(-1px);
    }

    .nav-button.terra {
      color: var(--terra);
      border-color: rgba(201, 181, 109, 0.44);
    }

    .nav-button.mars {
      color: var(--mars);
      border-color: rgba(184, 106, 66, 0.5);
    }

    .workbench {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
      gap: clamp(12px, 1.3vw, 18px);
    }

    .viz-frame,
    .data-panel {
      min-height: 0;
      border: 1px solid rgba(216, 173, 75, 0.26);
      border-radius: 8px;
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.04) 0 1px, transparent 1px 8px),
        linear-gradient(160deg, rgba(34, 29, 24, 0.9), rgba(11, 10, 12, 0.96));
      box-shadow: inset 0 0 0 1px rgba(239, 207, 119, 0.055), var(--shadow);
    }

    .viz-frame {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .viz-header {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
      border-bottom: 1px double rgba(216, 173, 75, 0.28);
      background: rgba(0, 0, 0, 0.22);
    }

    .metric {
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid rgba(216, 173, 75, 0.18);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.24);
    }

    .metric strong {
      display: block;
      color: var(--accent-bright);
      font-size: clamp(0.86rem, 1.1vw, 1.18rem);
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: 0.58rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .diagram-wrap {
      min-height: 0;
      padding: clamp(8px, 1vw, 14px);
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 620px;
      display: block;
    }

    .grid-line {
      fill: none;
      stroke: rgba(216, 173, 75, 0.13);
      stroke-width: 1;
    }

    .label {
      fill: var(--text-secondary);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .small-label {
      fill: rgba(216, 208, 191, 0.78);
      font-size: 11px;
      letter-spacing: 0.6px;
    }

    .mountain-far {
      fill: url(#mountainFar);
      opacity: 0.78;
    }

    .mountain-mid {
      fill: url(#mountainMid);
      opacity: 0.9;
    }

    .mountain-near {
      fill: url(#mountainNear);
      opacity: 0.96;
    }

    .ridge-light {
      fill: none;
      stroke: rgba(240, 207, 119, 0.32);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .snow-line {
      fill: none;
      stroke: rgba(216, 208, 191, 0.3);
      stroke-width: 1;
      stroke-dasharray: 8 9;
    }

    .iso-grid {
      fill: none;
      stroke: rgba(216, 173, 75, 0.11);
      stroke-width: 1;
    }

    .iso-deck {
      fill: url(#deckTop);
      stroke: rgba(216, 173, 75, 0.36);
      stroke-width: 1.3;
      filter: drop-shadow(0 22px 24px rgba(0, 0, 0, 0.38));
    }

    .iso-side {
      fill: url(#deckSide);
      stroke: rgba(216, 173, 75, 0.16);
      stroke-width: 1;
    }

    .iso-cut {
      fill: rgba(8, 8, 10, 0.78);
      stroke: rgba(216, 173, 75, 0.2);
      stroke-width: 1;
    }

    .iso-corridor {
      fill: url(#routeGold);
      stroke: rgba(255, 231, 158, 0.62);
      stroke-width: 1;
      filter: drop-shadow(0 0 8px rgba(216, 173, 75, 0.32));
    }

    .iso-corridor-dark {
      fill: rgba(5, 5, 7, 0.72);
      stroke: rgba(216, 173, 75, 0.16);
      stroke-width: 1;
    }

    .iso-room-top {
      fill: url(#roomTop);
      stroke: rgba(216, 173, 75, 0.58);
      stroke-width: 1.15;
    }

    .iso-room-left {
      fill: url(#roomLeft);
      stroke: rgba(216, 173, 75, 0.24);
      stroke-width: 1;
    }

    .iso-room-right {
      fill: url(#roomRight);
      stroke: rgba(216, 173, 75, 0.2);
      stroke-width: 1;
    }

    .iso-room-top.machine {
      fill: url(#machineTop);
      stroke: rgba(184, 106, 66, 0.78);
    }

    .iso-room-top.ritual {
      fill: url(#ritualTop);
      stroke: rgba(240, 207, 119, 0.86);
    }

    .iso-room-top.silent {
      fill: url(#silentTop);
      stroke: rgba(159, 173, 179, 0.68);
    }

    .iso-room-top.empty {
      fill: rgba(216, 208, 191, 0.045);
      stroke: rgba(216, 173, 75, 0.24);
    }

    .iso-wall {
      fill: url(#wallFace);
      stroke: rgba(216, 173, 75, 0.28);
      stroke-width: 1;
    }

    .fort-spire {
      fill: url(#spireGold);
      stroke: rgba(240, 207, 119, 0.72);
      stroke-width: 1;
      filter: drop-shadow(0 0 7px rgba(216, 173, 75, 0.24));
    }

    .micro-window {
      fill: rgba(255, 228, 151, 0.34);
      stroke: rgba(216, 173, 75, 0.22);
      stroke-width: 0.7;
    }

    .depth-shadow {
      fill: rgba(0, 0, 0, 0.42);
      filter: blur(10px);
    }

    .zoom-shadow {
      fill: rgba(0, 0, 0, 0.28);
      filter: blur(16px);
    }

    .zoom-stage {
      transform-origin: 600px 370px;
      animation: settleZoom 0.36s ease-out both;
    }

    .measure-line {
      fill: none;
      stroke: rgba(216, 208, 191, 0.44);
      stroke-width: 1;
      stroke-dasharray: 4 6;
    }

    .measure-text {
      fill: rgba(216, 208, 191, 0.72);
      font-size: 10px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .route-line {
      fill: none;
      stroke: url(#routeGold);
      stroke-width: 8;
      stroke-linecap: square;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 5px rgba(216, 173, 75, 0.24));
    }

    .route-core {
      fill: none;
      stroke: rgba(7, 7, 10, 0.7);
      stroke-width: 3;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .energy-line {
      fill: none;
      stroke: rgba(240, 207, 119, 0.72);
      stroke-width: 2;
      stroke-dasharray: 8 11;
      stroke-linecap: round;
      animation: dash 11s linear infinite;
      filter: drop-shadow(0 0 5px rgba(216, 173, 75, 0.35));
    }

    .warning-line {
      fill: none;
      stroke: rgba(167, 58, 47, 0.8);
      stroke-dasharray: 10 9;
      stroke-width: 1.6;
      animation: dash 14s linear infinite reverse;
    }

    .shield {
      fill: none;
      stroke: rgba(201, 181, 109, 0.48);
      stroke-width: 1.5;
      stroke-dasharray: 12 9;
      animation: dash 22s linear infinite;
    }

    .station {
      cursor: pointer;
      outline: none;
    }

    .station-target {
      fill: rgba(216, 173, 75, 0.08);
      stroke: rgba(216, 173, 75, 0.32);
      stroke-width: 1.3;
      transition: fill 0.18s ease, stroke 0.18s ease;
    }

    .station:hover .station-target,
    .station.active .station-target {
      fill: rgba(216, 173, 75, 0.16);
      stroke: rgba(240, 207, 119, 0.9);
    }

    .station-label {
      fill: var(--bone);
      font-size: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .station-number {
      fill: #1c1200;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }

    .station-dot {
      fill: var(--accent);
      stroke: rgba(240, 207, 119, 0.95);
      stroke-width: 2;
      filter: drop-shadow(0 0 6px rgba(216, 173, 75, 0.34));
    }

    .blueprint-base {
      transition: opacity 0.28s ease, filter 0.28s ease;
    }

    .viz-frame:not([data-view="overview"]) .blueprint-base {
      opacity: 0.11;
      filter: blur(0.3px);
      pointer-events: none;
    }

    .zoom-layer {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .viz-frame[data-view="defense"] .zoom-defense,
    .viz-frame[data-view="battlement"] .zoom-battlement,
    .viz-frame[data-view="processional"] .zoom-processional,
    .viz-frame[data-view="sanctum"] .zoom-sanctum,
    .viz-frame[data-view="dungeon"] .zoom-dungeon,
    .viz-frame[data-view="gate"] .zoom-gate,
    .viz-frame[data-view="throne"] .zoom-throne {
      opacity: 1;
      pointer-events: auto;
    }

    .zoom-title {
      fill: var(--accent-bright);
      font-size: 22px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .zoom-subtitle {
      fill: var(--text-secondary);
      font-size: 12px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .zoom-frame {
      fill: rgba(7, 7, 10, 0.84);
      stroke: rgba(216, 173, 75, 0.38);
      stroke-width: 1.4;
    }

    .room {
      fill: rgba(216, 173, 75, 0.1);
      stroke: rgba(216, 173, 75, 0.55);
      stroke-width: 1.5;
    }

    .room.ritual {
      fill: rgba(216, 173, 75, 0.18);
      stroke: rgba(240, 207, 119, 0.85);
    }

    .room.machine {
      fill: rgba(184, 106, 66, 0.16);
      stroke: rgba(184, 106, 66, 0.78);
    }

    .room.silent {
      fill: rgba(159, 173, 179, 0.09);
      stroke: rgba(159, 173, 179, 0.62);
    }

    .room.empty {
      fill: rgba(216, 208, 191, 0.035);
      stroke: rgba(216, 173, 75, 0.22);
    }

    .corridor {
      fill: none;
      stroke: rgba(216, 173, 75, 0.66);
      stroke-width: 12;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .corridor-edge {
      fill: none;
      stroke: rgba(7, 7, 10, 0.72);
      stroke-width: 7;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .service-line {
      fill: none;
      stroke: rgba(216, 208, 191, 0.48);
      stroke-width: 1.1;
      stroke-dasharray: 5 7;
      animation: dash 18s linear infinite;
    }

    .room-label {
      fill: var(--bone);
      font-size: 12px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .micro-label {
      fill: rgba(216, 208, 191, 0.66);
      font-size: 10px;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    .gate-slab {
      fill: url(#gateGold);
      stroke: rgba(240, 207, 119, 0.84);
      stroke-width: 2;
      filter: drop-shadow(0 0 13px rgba(216, 173, 75, 0.32));
    }

    .gate-lock {
      fill: rgba(7, 7, 10, 0.72);
      stroke: rgba(216, 173, 75, 0.56);
      stroke-width: 1.5;
    }

    .custodes {
      fill: rgba(240, 207, 119, 0.8);
      stroke: rgba(7, 7, 10, 0.8);
      stroke-width: 1;
    }

    .silent-field {
      fill: none;
      stroke: rgba(159, 173, 179, 0.58);
      stroke-width: 1.6;
      stroke-dasharray: 4 8;
      animation: dash 12s linear infinite reverse;
    }

    .throne-glow {
      fill: url(#throneGlow);
      animation: pulseGold 5.5s ease-in-out infinite;
    }

    .webway {
      fill: url(#webwayDark);
      stroke: rgba(159, 173, 179, 0.52);
      stroke-width: 2;
      stroke-dasharray: 13 11;
      animation: dash 20s linear infinite;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 0 12px 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-secondary);
      font-size: 0.58rem;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .swatch {
      width: 22px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(216, 173, 75, 0.35);
    }

    .swatch.warning {
      background: var(--crimson);
    }

    .swatch.silent {
      background: var(--silent);
    }

    .swatch.route {
      background: var(--accent-bright);
    }

    .data-panel {
      padding: clamp(12px, 1.1vw, 16px);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      overflow: hidden;
    }

    .station-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .station-tab {
      min-height: 38px;
      border: 1px solid rgba(216, 173, 75, 0.24);
      border-radius: 6px;
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.06) 0 1px, transparent 1px 7px),
        rgba(0, 0, 0, 0.22);
      color: var(--bone);
      font: inherit;
      font-size: 0.62rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .station-tab.active {
      border-color: rgba(240, 207, 119, 0.76);
      color: var(--accent-bright);
      box-shadow: inset 0 -3px 0 rgba(216, 173, 75, 0.58);
    }

    .panel-title {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.05rem, 1.4vw, 1.55rem);
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .panel-lead {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.76rem;
      line-height: 1.65;
    }

    .info-stack {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 9px;
      padding-right: 4px;
    }

    .info-card {
      border: 1px solid rgba(216, 173, 75, 0.18);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.24);
      padding: 10px;
    }

    .info-card strong {
      display: block;
      color: var(--accent-bright);
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .info-card span {
      display: block;
      margin-top: 6px;
      color: var(--bone);
      font-size: 0.72rem;
      line-height: 1.55;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -160;
      }
    }

    @keyframes pulseGold {
      0%, 100% {
        opacity: 0.62;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes settleZoom {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 1180px) {
      header,
      .workbench {
        grid-template-columns: 1fr;
      }

      .top-nav {
        justify-content: flex-start;
      }

      .data-panel {
        max-height: none;
      }

      svg {
        min-height: 720px;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 1.55rem;
      }

      .subtitle {
        display: none;
      }

      .top-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .nav-button {
        width: 100%;
        min-width: 0;
        padding-inline: 8px;
        font-size: 0.66rem;
      }

      .viz-header,
      .legend,
      .station-tabs {
        grid-template-columns: 1fr;
      }

      svg {
        min-height: 640px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div>
        <h1>Eternity Gate</h1>
        <p class="subtitle">Vízszintes metszeti útvonal - Himalája védelmi vonaltól a trónteremig</p>
      </div>
      <nav class="top-nav" aria-label="Terra Ostroma menü">
        <a class="nav-button" href="terra-ostroma.html">Ostrom</a>
        <a class="nav-button" href="terra-ostroma-karakterek.html">Karakterek</a>
        <a class="nav-button" href="terra-ostroma-npc.html">NPC</a>
        <a class="nav-button" href="terra-ostroma-astronomicon.html">Astronomicon</a>
        <a class="nav-button active" href="terra-ostroma-eternity-gate.html">Eternity Gate</a>
        <a class="nav-button terra" href="earth/index.html">Terra</a>
        <a class="nav-button mars" href="mars/index.html">Mars</a>
      </nav>
    </header>

    <main class="workbench">
      <section class="viz-frame" id="vizFrame" data-view="overview" aria-label="Eternity Gate útvonal metszet">
        <div class="viz-header">
          <div class="metric"><strong>7 pont</strong><span>védelmi útvonal</span></div>
          <div class="metric"><strong>6</strong><span>Végtelen Kapuja</span></div>
          <div class="metric"><strong>300</strong><span>belső Hetaeron őrség</span></div>
          <div class="metric"><strong>zárt</strong><span>Webway és trónmező</span></div>
        </div>

        <div class="diagram-wrap">
          <svg viewBox="0 0 1200 760" role="img" aria-labelledby="diagramTitle diagramDesc">
            <title id="diagramTitle">Eternity Gate vízszintes metszeti infografika</title>
            <desc id="diagramDesc">Kattintható, vízszintes tervrajz a Himalája védelmi vonaltól a Végtelen Kapuján át a Golden Throne csarnokig.</desc>
            <defs>
              <linearGradient id="routeGold" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#6d1712" stop-opacity="0.45" />

                  <polygon class="iso-room-right" points="710,514 758,492 758,530 710,552" />
                  <polygon class="iso-room-top empty" points="640,492 688,470 758,492 710,514" />
                </g>
                <path class="service-line" d="M390 530H438M638 536H702M606 442V516M836 546L884 458" />
                <path class="measure-line" d="M520 246L474 160M704 234L754 160M474 160H754" />

        <div class="legend" aria-label="Jelmagyarázat">
          <div class="legend-item"><span class="swatch route"></span>fő útvonal</div>
          <div class="legend-item"><span class="swatch"></span>energia / trónmező</div>
          <div class="legend-item"><span class="swatch warning"></span>ostromnyomás</div>
          <div class="legend-item"><span class="swatch silent"></span>csendzóna</div>

      </section>

      <aside class="data-panel" aria-label="Eternity Gate információs panel">
        <div class="station-tabs" id="stationTabs"></div>
        <div>
          <h2 class="panel-title" id="panelTitle"></h2>
          <p class="panel-lead" id="panelLead"></p>
        </div>
        <div class="info-stack" id="infoStack"></div>
      </aside>
    </main>
  </div>

  <script>
    const sections = {
      overview: {
        title: 'Totálkép',
        tab: 'Totál',
        lead: 'A vízszintes metszet a Himalája védelmi vonaltól indul, átvezet a palota utolsó külső és belső zónáin, majd a 6-os főpontnál, a Végtelen Kapujánál közvetlenül a trónterem elé ér.',
        cards: [
          ['Útvonal', '1 Védvonal, 2 Delphic Battlement, 3 Grand Processional, 4 Sanctum Imperialis, 5 Imperial Dungeon, 6 Végtelen Kapuja, 7 Golden Throne csarnok.'],
          ['Forma', 'Nem torony, hanem vízszintes hadmérnöki metszet: útvonalak, zsilipkapuk, termek, folyosók és védelmi zónák sorozata.'],
          ['Kapuszerep', 'A Végtelen Kapuja itt a trónterem előtti közvetlen főkapu, ezért a 6-os pont nem külső palotakapu, hanem az utolsó zár a Golden Throne előtt.'],
          ['Olvasás', 'A totálkép áttekintést ad; a többi tab nagyított tervrajzon bontja ki az adott szint logikus belső szerkezetét.']
        ]
      },
      defense: {
        title: '1 - Himalája védelmi vonal',
        tab: '1 Védvonal',
        lead: 'A külső indulópont hegygerincbe épített, erősen rétegzett védelmi rendszer. A cél nem díszlet, hanem ostromlogika: tűzvezetés, pajzs, utánpótlás és páncélos áthaladás.',
        cards: [
          ['Makroágyúk', 'A kazamaták oldalirányban kapcsolódnak a pajzskapcsoló és lőszerlift rendszerhez, így a tűzszektorok nem törik meg a fő útvonalat.'],
          ['Pajzsmező', 'A külső és belső pajzsív külön rétegként fut, hogy a fő palotatengely sérülés esetén is zárható legyen.'],
          ['Üres kamrák', 'A kisebb jelöletlen termek tartalék raktárak vagy lezárt aknák lehetnek; szándékosan nem kap mindegyik infot.'],
          ['Áthaladás', 'A fő folyosók szélei pontosan a termek ajtósíkjára illeszkednek, hogy tervrajzként olvasható maradjon.']
        ]
      },
      battlement: {
        title: '2 - Delphic Battlement',
        tab: '2 Battlement',
        lead: 'Az utolsó nyílt védmű, ahol a visszavonuló és még harcoló erők keverednek. A rajz a frontvonalat, triázst, zsilipkapukat és csendzónát egy tengelyre rendezi.',
        cards: [
          ['Fronttengely', 'A fő védmű hosszú, egyenes folyosóként jelenik meg, oldalsó tűzvezető és ellátó helyiségekkel.'],
          ['Sebesültfolyosó', 'A triázs és menekült sáv külön alacsonyabb szinten fut, hogy a harci forgalommal ne ütközzön.'],
          ['Titan adatkapcsolat', 'A védmű jobb oldalán a titan-tűzvezetés csatlakozik a magasabb pajzs- és célzóhálózathoz.'],
          ['Csendzóna', 'A Sisters of Silence mező külön jelölt, hidegebb vonalrendszerrel jelenik meg.']
        ]
      },
      processional: {
        title: '3 - Grand Processional',
        tab: '3 Processional',
        lead: 'A hősök folyosója és szakrális útvonal: nagy menetirányú közlekedő, zászlósorokkal, relikviafülkékkel és ostrom alatti segédpontokkal.',
        cards: [
          ['Folyosólogika', 'A középső arany tengely a menetirányt mutatja; az oldalsó fülkék függőleges kapcsolatokkal ülnek rá.'],
          ['Relikviák', 'Zászlók, krónikák és relikviafülkék jelzik, hogy ez nem puszta katonai átjáró, hanem birodalmi rituális tér.'],
          ['Ostromüzem', 'Sebészpont és őrfülke került a déli sávba, mert ostrom alatt a ceremoniális folyosó is hadműveleti útvonallá válik.'],
          ['Üres fülkék', 'Több kisebb fülke nincs megnevezve; későbbi karakteres vagy eseményes részleteknek marad hely.']
        ]
      },
      sanctum: {
        title: '4 - Sanctum Imperialis',
        tab: '4 Sanctum',
        lead: 'A belső palotazóna már nem nyílt csatatér. A Hall of Widows, belső palotatengelyek, Custodes kontrollpontok és csendmezők sűrű rendszere vezet mélyebbre.',
        cards: [
          ['Hall of Widows', 'A Sanctum nyitó tere nagy, rituális kontrollcsarnokként jelenik meg, innen ágaznak a belső palotafolyosók.'],
          ['Csendmező', 'A Sisters of Silence zóna külön hideg-ezüst, szaggatott mezőként látszik, mert funkciója nem fizikai ajtó, hanem pszichés zárás.'],
          ['Levéltár és gépészet', 'Az alsó szinten levéltári és karbantartó helyiségek csatlakoznak, de nem bontják meg a fő útvonalat.'],
          ['Üres belső szobák', 'A jelöletlen kisebb kamrák lezárt lakószárnyak, régi adminisztratív termek vagy ismeretlen átjárók lehetnek.']
        ]
      },
      dungeon: {
        title: '5 - Imperial Dungeon',
        tab: '5 Dungeon',
        lead: 'A mély alépítmény gépészeti és szakrális zóna egyszerre: psi-fusion reaktorok, stasis kontroll, kábelkatedrálisok és a végső ajtó előtti zárfolyosó.',
        cards: [
          ['Mélységi szerkezet', 'A dungeon nézetben a folyosók lépcsőzetesen mélyülnek, de a kapcsolódási pontok derékszögű, tervrajzszerű rendben maradnak.'],
          ['Gépészeti gyökerek', 'A kábelkatedrális és hőcsapda a trónterem felé futó fenntartó rendszereket előlegezi.'],
          ['Null átjáró', 'A csendmező itt már belső biztonsági funkció: a pszichés szivárgás és beszivárgás ellen véd.'],
          ['Végső ajtó', 'A dungeon vége a trón előtti zárhoz vezet, amely átadja az útvonalat a 6-os Végtelen Kapujának.']
        ]
      },
      gate: {
        title: '6 - Végtelen Kapuja',
        tab: '6 Kapu',
        lead: 'Ez az oldal főkapuja: közvetlenül a trónterem előtt álló arany, adamantium és ceramite zár. A zoomnézet a kapu zárnyelveit, pecsétmagját és őrségi zónáit mutatja.',
        cards: [
          ['Főkapu', 'A Végtelen Kapuja itt nem távoli bejárat, hanem az utolsó főkapu a Golden Throne csarnok előtt.'],
          ['Őrségi záróvonal', 'A Custodes pontok mindkét oldalon szimmetrikusan ülnek a fő folyosóra, hogy az áthaladás katonailag ellenőrizhető legyen.'],
          ['Csendmező', 'A Sisters of Silence mező a kapu előtti oldalon külön védelmi rétegként működik a pszichés nyomás ellen.'],
          ['Kapuszerkezet', 'A zárnyelvek, pecsétek és kapumag függőleges blokkokként jelennek meg, mert a kapu maga a vízszintes útvonalat metszi át.']
        ]
      },
      throne: {
        title: '7 - Golden Throne csarnok',
        tab: '7 Trónterem',
        lead: 'A végpont egy hatalmas gépészeti csarnok: középen a Golden Throne, mögötte a lezárt Webway-kapu, körülötte Hetaeron őrség, stasis kontroll és psyker-koporsó csatlakozók.',
        cards: [
          ['Golden Throne', 'A trón nem különálló szék, hanem gépészeti és pszichés központ, amelyhez a csarnok rendszerei gyökérszerűen kapcsolódnak.'],
          ['Hetaeron őrség', 'A 300-as belső őrséget nem tömegjelenetként, hanem gyűrűs jelölésekkel mutatja a tervrajz.'],
          ['Webway kapu', 'A trón mögötti lezárt Webway sötét, szaggatott oválként jelenik meg, elkülönítve az arany trónmezőtől.'],
          ['Fenntartó rendszerek', 'Psyker-koporsó csatlakozók, stasis kontroll és gépészeti gyökerek futnak a csarnok alján, pontos folyosókapcsolatokkal.']
        ]
      }
    };

    const tabs = document.getElementById('stationTabs');
    const vizFrame = document.getElementById('vizFrame');
    const panelTitle = document.getElementById('panelTitle');
    const panelLead = document.getElementById('panelLead');
    const infoStack = document.getElementById('infoStack');
    const sectionOrder = ['overview', 'defense', 'battlement', 'processional', 'sanctum', 'dungeon', 'gate', 'throne'];

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function selectSection(sectionId, updateHash = true) {
      const section = sections[sectionId] || sections.overview;
      const activeId = sections[sectionId] ? sectionId : 'overview';
      vizFrame.dataset.view = activeId;
      document.querySelectorAll('.station').forEach(station => {
        station.classList.toggle('active', station.dataset.section === activeId);
      });
      document.querySelectorAll('.station-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.section === activeId);
      });
      panelTitle.textContent = section.title;
      panelLead.textContent = section.lead;
      infoStack.innerHTML = section.cards.map(([title, body]) => `
        <article class="info-card">
          <strong>${escapeHtml(title)}</strong>
          <span>${escapeHtml(body)}</span>
        </article>
      `).join('');
      if (updateHash && window.location.hash.slice(1) !== activeId) {
        history.replaceState(null, '', `#${activeId}`);
      }
    }

    tabs.innerHTML = sectionOrder.map(sectionId => `
      <button class="station-tab" type="button" data-section="${sectionId}">${sections[sectionId].tab}</button>
    `).join('');

    tabs.addEventListener('click', event => {
      const button = event.target.closest('.station-tab');
      if (button) {
        selectSection(button.dataset.section);
      }
    });

    document.querySelectorAll('.station').forEach(station => {
      station.addEventListener('click', () => selectSection(station.dataset.section));
      station.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectSection(station.dataset.section);
        }
      });
    });

    window.addEventListener('hashchange', () => {
      selectSection(window.location.hash.slice(1), false);
    });

    selectSection(window.location.hash.slice(1) || 'overview', false);
  </script>
</body>
</html>
