<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Ostroma</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --panel: rgba(18, 16, 16, 0.9);
      --panel-strong: rgba(27, 23, 21, 0.96);
      --border: #5a4930;
      --accent: #d8ad4b;
      --accent-bright: #f0cf77;
      --bone: #d8d0bf;
      --crimson: #6d1712;
      --danger: #a73a2f;
      --terra: #c9b56d;
      --mars: #b86a42;
      --text-primary: #efe8d6;
      --text-secondary: #aaa292;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.44);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background:
        linear-gradient(90deg, rgba(49, 11, 8, 0.24), rgba(0, 0, 0, 0) 22%, rgba(104, 83, 44, 0.13) 50%, rgba(0, 0, 0, 0) 78%, rgba(49, 11, 8, 0.22)),
        radial-gradient(circle at top, rgba(55, 45, 30, 0.72), rgba(5, 5, 9, 0.96)),
        url('images/starfort.jpg') center/cover fixed;
      color: var(--text-primary);
      padding: clamp(12px, 1.7vw, 24px);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.055) 0 1px, transparent 1px 7px),
        linear-gradient(90deg, transparent, rgba(216, 173, 75, 0.07) 50%, transparent);
      background-size: auto, 100% 100%;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 74%);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1880px, 100%);
      min-height: calc(100vh - clamp(24px, 3.4vw, 48px));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(12px, 1.4vw, 18px);
    }

    header {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      align-items: end;
      gap: 16px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.65rem, 2.5vw, 3rem);
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 18px rgba(216, 173, 75, 0.24);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-secondary);
      font-size: clamp(0.78rem, 0.9vw, 0.95rem);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .nav-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.08) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(28, 24, 20, 0.98), rgba(10, 10, 12, 0.98));
      color: var(--bone);
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: inset 0 0 0 1px rgba(216, 173, 75, 0.08), 0 10px 26px rgba(0, 0, 0, 0.28);
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .nav-button:hover,
    .nav-button.active {
      border-color: rgba(255, 204, 51, 0.72);
      color: var(--accent-bright);
      box-shadow: inset 0 -3px 0 rgba(216, 173, 75, 0.58), 0 0 10px rgba(216, 173, 75, 0.16);
      transform: translateY(-1px);
    }

    .nav-button.terra {
      color: var(--terra);
      border-color: rgba(201, 181, 109, 0.44);
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.07) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(35, 31, 22, 0.96), rgba(11, 14, 14, 0.98));
    }

    .nav-button.mars {
      color: var(--mars);
      border-color: rgba(184, 106, 66, 0.5);
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.06) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(80, 23, 17, 0.94), rgba(20, 11, 9, 0.98));
    }

    .dashboard {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 390px);
      gap: clamp(12px, 1.3vw, 18px);
    }

    .segments-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(10px, 1.1vw, 16px);
    }

    .segment-card,
    .side-panel,
    .group-zone {
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.045) 0 1px, transparent 1px 8px),
        linear-gradient(160deg, rgba(34, 29, 24, 0.9), rgba(11, 10, 12, 0.96));
      border: 1px solid rgba(216, 173, 75, 0.26);
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(239, 207, 119, 0.055), var(--shadow);
    }

    .segment-card {
      position: relative;
      overflow: hidden;
      min-height: 0;
      padding: clamp(12px, 1.2vw, 17px);
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 10px;
    }

    .segment-card::before,
    .group-zone::before {
      content: "";
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(216, 173, 75, 0.64), rgba(109, 23, 18, 0.5), transparent);
      border-radius: 8px 8px 0 0;
    }

    .segment-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px double rgba(216, 173, 75, 0.28);
      padding-bottom: 8px;
    }

    .segment-title {
      margin: 0;
      color: var(--bone);
      font-size: clamp(0.98rem, 1.08vw, 1.28rem);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .segment-tag {
      flex: 0 0 auto;
      color: var(--text-secondary);
      font-size: 0.62rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .defense-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-label {
      color: var(--text-secondary);
      font-size: 0.65rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .defense-track {
      width: min(100%, 320px);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .defense-die {
      width: 100%;
      height: 30px;
      min-width: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-strong);
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .defense-die.active {
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0 1px, transparent 1px 6px),
        linear-gradient(145deg, rgba(240, 207, 119, 0.9), rgba(126, 80, 22, 0.88));
      border-color: rgba(240, 207, 119, 0.85);
      color: #1c1200;
      box-shadow: inset 0 0 0 1px rgba(255, 245, 200, 0.22), 0 0 10px rgba(216, 173, 75, 0.2);
    }

    .entry-list {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 4px;
    }

    .entry-chip {
      display: grid;
      grid-template-columns: 22px 1fr 24px;
      align-items: center;
      gap: 8px;
      padding: 7px 8px 7px 10px;
      border: 1px solid rgba(216, 173, 75, 0.24);
      border-radius: 6px;
      background:
        repeating-linear-gradient(90deg, rgba(216, 173, 75, 0.055) 0 1px, transparent 1px 7px),
        rgba(14, 13, 14, 0.72);
      color: var(--bone);
      font-size: 0.72rem;
      line-height: 1.3;
      user-select: none;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .entry-chip.status-inkognito {
      border-color: rgba(154, 132, 181, 0.68);
      background:
        repeating-linear-gradient(90deg, rgba(154, 132, 181, 0.08) 0 1px, transparent 1px 7px),
        rgba(18, 14, 25, 0.82);
      box-shadow: inset 3px 0 0 rgba(154, 132, 181, 0.72);
    }

    .entry-chip.status-jogosultsag {
      border-color: rgba(216, 173, 75, 0.62);
      background:
        repeating-linear-gradient(90deg, rgba(216, 173, 75, 0.09) 0 1px, transparent 1px 7px),
        rgba(30, 24, 13, 0.82);
      box-shadow: inset 3px 0 0 rgba(216, 173, 75, 0.78);
    }

    .entry-kind-icon {
      width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(216, 173, 75, 0.3);
      border-radius: 50%;
      color: var(--text-secondary);
      font-size: 0.62rem;
      line-height: 1;
    }

    .entry-chip.status-inkognito .entry-kind-icon {
      border-color: rgba(154, 132, 181, 0.74);
      color: #c9b7df;
    }

    .entry-chip.status-jogosultsag .entry-kind-icon {
      border-color: rgba(216, 173, 75, 0.74);
      color: var(--accent-bright);
    }

    .entry-remove {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .entry-remove:hover {
      color: #fff;
      background: rgba(255, 85, 85, 0.42);
    }

    .empty-message {
      color: var(--text-secondary);
      font-size: 0.72rem;
      opacity: 0.74;
    }

    .entry-form {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 8px;
    }

    .entry-form input {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(5, 5, 9, 0.72);
      color: var(--text-primary);
      font: inherit;
      font-size: 0.72rem;
      padding: 8px 10px;
    }

    .entry-form input::placeholder {
      color: rgba(245, 245, 245, 0.55);
    }

    .entry-form button {
      border: 1px solid rgba(255, 204, 51, 0.45);
      border-radius: 6px;
      background: rgba(255, 204, 51, 0.16);
      color: var(--accent);
      font: inherit;
      cursor: pointer;
    }

    .side-panel {
      min-height: 0;
      padding: clamp(12px, 1.2vw, 17px);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
    }

    .admin-log {
      border: 1px solid rgba(216, 173, 75, 0.18);
      border-radius: 6px;
      background:
        repeating-linear-gradient(90deg, rgba(216, 173, 75, 0.04) 0 1px, transparent 1px 7px),
        rgba(0, 0, 0, 0.28);
      padding: 9px 10px;
      display: grid;
      gap: 5px;
      color: var(--text-secondary);
      font-size: 0.62rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .admin-log div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .admin-log strong {
      color: var(--accent-bright);
      font-weight: 700;
      text-align: right;
    }

    .groups {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
    }

    .group-zone {
      min-height: 0;
      padding: 12px;
      display: grid;
      position: relative;
      overflow: hidden;
      grid-template-rows: 3px auto 1fr;
      gap: 10px;
      border-color: rgba(255, 204, 51, 0.2);
    }

    .group-zone.drag-over {
      border-color: rgba(255, 204, 51, 0.9);
      box-shadow: 0 0 18px rgba(255, 204, 51, 0.28);
    }

    .group-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .group-heading h2 {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .group-count {
      color: var(--text-secondary);
      font-size: 0.7rem;
    }

    .character-bin {
      align-content: start;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 96px;
      overflow: auto;
    }

    .character-token {
      width: 78px;
      height: 78px;
      border: 2px solid rgba(216, 173, 75, 0.78);
      border-radius: 50%;
      overflow: hidden;
      background: #111;
      cursor: grab;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.56), 0 0 12px rgba(216, 173, 75, 0.2);
    }

    .character-token:active {
      cursor: grabbing;
    }

    .character-token img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
      display: block;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 4;
      max-width: min(360px, calc(100vw - 36px));
      border: 1px solid rgba(255, 204, 51, 0.35);
      border-radius: 8px;
      background: rgba(10, 10, 14, 0.94);
      color: var(--accent);
      padding: 10px 14px;
      font-size: 0.76rem;
      letter-spacing: 0.4px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1180px) {
      body {
        overflow: auto;
      }

      header,
      .dashboard {
        grid-template-columns: 1fr;
      }

      .top-nav {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-content: stretch;
      }

      .segments-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;
      }

      .side-panel,
      .segment-card {
        min-height: 260px;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .page-shell {
        gap: 10px;
        width: 100%;
        overflow: hidden;
      }

      h1 {
        font-size: 1.65rem;
      }

      .subtitle {
        display: none;
      }

      .segments-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .defense-row,
      .segment-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .segment-card {
        min-height: auto;
        padding: 10px;
        gap: 8px;
      }

      .segment-title {
        font-size: 1rem;
      }

      .segment-tag,
      .section-label {
        font-size: 0.6rem;
      }

      .defense-row {
        gap: 7px;
      }

      .defense-track {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
        min-width: 0;
        overflow: hidden;
      }

      .defense-die {
        width: 100%;
        height: 36px;
        min-width: 0;
        padding: 0;
        font-size: 0.82rem;
      }

      .entry-form {
        grid-template-columns: 1fr 42px;
      }

      .entry-form input {
        min-height: 38px;
        border-color: rgba(255, 204, 51, 0.38);
        background: rgba(5, 5, 9, 0.9);
        font-size: 0.76rem;
      }

      .entry-form button {
        min-height: 38px;
        font-size: 1rem;
      }

      .entry-list {
        min-height: 36px;
        max-height: 118px;
      }

      .nav-button {
        width: 100%;
        min-width: 0;
        padding-inline: 8px;
        font-size: 0.68rem;
      }

      .nav-button.mars {
        grid-column: 1 / -1;
      }

      .character-token {
        width: 68px;
        height: 68px;
      }

      .side-panel {
        grid-template-rows: auto auto;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div>
        <h1>Terra Ostroma</h1>
        <p class="subtitle">Ostromdashboard, szabotázsnyomok és küldöttségi mozgások</p>
      </div>
      <nav class="top-nav" aria-label="Terra Ostroma menü">
        <a class="nav-button active" href="terra-ostroma.html">Ostrom</a>
        <a class="nav-button" href="terra-ostroma-karakterek.html">Karakterek</a>
        <a class="nav-button" href="terra-ostroma-npc.html">NPC</a>
        <a class="nav-button terra" href="earth/index.html">Terra</a>
        <a class="nav-button mars" href="mars/index.html">Mars</a>
      </nav>
    </header>

    <main class="dashboard">
      <section class="segments-grid" id="segmentsGrid" aria-label="Szabotázs szegmensek"></section>

      <aside class="side-panel" aria-label="Küldöttségek">
        <div class="groups">
          <section class="group-zone" data-group="rogue-trader">
            <div class="group-heading">
              <h2>Rogue Trader küldöttség</h2>
              <span class="group-count" id="rogue-trader-count">0</span>
            </div>
            <div class="character-bin" id="rogue-trader-bin"></div>
          </section>

          <section class="group-zone" data-group="smuggler">
            <div class="group-heading">
              <h2>Csempész brigád</h2>
              <span class="group-count" id="smuggler-count">0</span>
            </div>
            <div class="character-bin" id="smuggler-bin"></div>
          </section>
        </div>

        <div class="admin-log" aria-label="Adminisztratív log">
          <div><span>Szerzett nyom</span><strong id="totalEntries">0</strong></div>
          <div><span>Védelem átlag</span><strong id="defenseAverage">2.0</strong></div>
          <div><span>Legaktívabb terület</span><strong id="highestPressure">Paktum</strong></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'terra-ostroma-state-v1';
    const SHEET_NAME = 'TerraOstroma';
    const SHEET_CSV_URL = '';
    const SHEET_API_URL = '';

    const fallbackState = {
      segments: [
        { id: 'paktum', name: 'Paktum', tag: 'frakciók', defense: 2, entries: [] },
        { id: 'propaganda', name: 'Propaganda', tag: 'néptámogatás', defense: 2, entries: [] },
        { id: 'hadmuvelet', name: 'Roham', tag: 'katonai manőverek', defense: 2, entries: [] },
        { id: 'merenylet', name: 'Merénylet', tag: 'asszaszinációk', defense: 2, entries: [] },
        { id: 'blokad', name: 'Blokád', tag: 'gazdaság', defense: 2, entries: [] },
        { id: 'titkok', name: 'Titkok', tag: 'fedett tudás', defense: 2, entries: [] }
      ],
      characters: [
        { id: 'character-01', name: 'Karakter 1', image: 'images/terra-ostroma/character-01.jpg', group: 'rogue-trader' },
        { id: 'character-02', name: 'Karakter 2', image: 'images/terra-ostroma/character-02.jpg', group: 'rogue-trader' },
        { id: 'character-03', name: 'Karakter 3', image: 'images/terra-ostroma/character-03.jpg', group: 'rogue-trader' },
        { id: 'character-04', name: 'Karakter 4', image: 'images/terra-ostroma/character-04.jpg', group: 'smuggler' },
        { id: 'character-05', name: 'Karakter 5', image: 'images/terra-ostroma/character-05.jpg', group: 'smuggler' }
      ]
    };

    let state = normalizeState(loadLocalState() || cloneState(fallbackState));

    const segmentsGrid = document.getElementById('segmentsGrid');
    const toast = document.getElementById('toast');

    function cloneState(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeState(sourceState) {
      const savedSegments = new Map((sourceState.segments || []).map(segment => [segment.id, segment]));
      const savedCharacters = new Map((sourceState.characters || []).map(character => [character.id, character]));
      return {
        segments: fallbackState.segments.map(baseSegment => {
          const savedSegment = savedSegments.get(baseSegment.id) || {};
          return {
            ...baseSegment,
            defense: clampDefense(savedSegment.defense ?? baseSegment.defense),
            entries: Array.isArray(savedSegment.entries) ? savedSegment.entries.map(normalizeEntry) : []
          };
        }),
        characters: fallbackState.characters.map(baseCharacter => {
          const savedCharacter = savedCharacters.get(baseCharacter.id) || {};
          return {
            ...baseCharacter,
            group: savedCharacter.group === 'smuggler' || savedCharacter.group === 'rogue-trader'
              ? savedCharacter.group
              : baseCharacter.group
          };
        })
      };
    }

    function normalizeEntry(entry) {
      return {
        id: entry.id || createId('entry'),
        label: entry.label || '',
        status: normalizeEntryStatus(entry.status)
      };
    }

    function normalizeEntryStatus(status) {
      return ['normal', 'inkognito', 'jogosultsag'].includes(status) ? status : 'normal';
    }

    function nextEntryStatus(status) {
      const order = ['normal', 'inkognito', 'jogosultsag'];
      return order[(order.indexOf(normalizeEntryStatus(status)) + 1) % order.length];
    }

    function entryStatusMeta(status) {
      const normalized = normalizeEntryStatus(status);
      if (normalized === 'inkognito') {
        return { icon: '◐', label: 'Inkognitó' };
      }
      if (normalized === 'jogosultsag') {
        return { icon: '⚜', label: 'Jogosultság' };
      }
      return { icon: '·', label: 'Normál' };
    }

    function createId(prefix) {
      return `${prefix}-${Math.random().toString(16).slice(2, 10)}`;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timeoutId);
      showToast.timeoutId = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.warn('Nem sikerült betölteni a Terra Ostroma helyi állapotát.', error);
        return null;
      }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    async function syncWithSheet(action, payload = {}, { silent = false } = {}) {
      if (!SHEET_API_URL) {
        return { skipped: true };
      }

      const response = await fetch(SHEET_API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          sheetName: SHEET_NAME,
          action,
          ...payload
        })
      });

      const rawText = await response.text();
      let data = null;
      try {
        data = rawText ? JSON.parse(rawText) : null;
      } catch (error) {
        console.warn('Nem JSON választ kaptunk a Google Apps Script-től:', rawText);
      }

      if (!response.ok || (data && data.success === false)) {
        throw new Error(data?.message || `Sheet API hiba (${response.status})`);
      }

      if (!silent) {
        showToast('Mentve a Google Sheet-be.');
      }

      return data || { success: true };
    }

    async function loadFromSheet() {
      if (!SHEET_CSV_URL) {
        return null;
      }

      try {
        const response = await fetch(SHEET_CSV_URL);
        const text = await response.text();
        const rows = parseCsv(text);
        if (!rows.length) {
          return null;
        }

        const nextState = cloneState(fallbackState);
        nextState.segments.forEach(segment => {
          segment.entries = [];
        });

        rows.forEach(row => {
          if (row.record_type === 'segment') {
            const segment = nextState.segments.find(item => item.id === row.segment_id);
            if (segment) {
              segment.defense = clampDefense(row.defense);
            }
          }

          if (row.record_type === 'entry') {
            const segment = nextState.segments.find(item => item.id === row.segment_id);
            if (segment && row.label) {
              segment.entries.push({
                id: row.item_id || createId('entry'),
                label: row.label,
                status: normalizeEntryStatus(row.entry_status || row.status || row.kategoria)
              });
            }
          }

          if (row.record_type === 'character') {
            const character = nextState.characters.find(item => item.id === row.character_id);
            if (character && (row.character_group === 'rogue-trader' || row.character_group === 'smuggler')) {
              character.group = row.character_group;
            }
          }
        });

        return nextState;
      } catch (error) {
        console.warn('Nem sikerült betölteni a Terra Ostroma Google Sheet adatait.', error);
        return null;
      }
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (!lines.length) {
        return [];
      }
      const headers = splitCsvLine(lines[0]).map(normalizeHeader);
      return lines.slice(1).map(line => {
        const values = splitCsvLine(line);
        return headers.reduce((row, key, index) => {
          if (key) {
            row[key] = values[index] || '';
          }
          return row;
        }, {});
      });
    }

    function splitCsvLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        const next = line[index + 1];
        if (char === '"' && next === '"') {
          current += '"';
          index += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    function normalizeHeader(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/\p{Diacritic}/gu, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '');
    }

    function clampDefense(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return 2;
      }
      return Math.min(6, Math.max(2, number));
    }

    function renderSegments() {
      segmentsGrid.innerHTML = '';
      state.segments.forEach(segment => {
        const card = document.createElement('article');
        card.className = 'segment-card';
        card.dataset.segmentId = segment.id;
        card.innerHTML = `
          <div class="segment-header">
            <h2 class="segment-title">${escapeHtml(segment.name)}</h2>
            <span class="segment-tag">${escapeHtml(segment.tag)}</span>
          </div>
          <div class="defense-row">
            <span class="section-label">Terrai védelem</span>
            <div class="defense-track">
              ${[2, 3, 4, 5, 6].map(level => `
                <button class="defense-die ${segment.defense >= level ? 'active' : ''}" type="button" data-level="${level}" aria-label="${segment.name} védelem ${level}">${level}</button>
              `).join('')}
            </div>
          </div>
          <form class="entry-form">
            <input type="text" maxlength="160" placeholder="Siker / info / erőforrás..." aria-label="Új bejegyzés" required>
            <button type="submit" aria-label="Hozzáadás">+</button>
          </form>
          <div class="entry-list">
            ${segment.entries.length ? segment.entries.map(entry => `
              <div class="entry-chip status-${normalizeEntryStatus(entry.status)}" data-entry-id="${entry.id}" data-entry-status="${normalizeEntryStatus(entry.status)}" title="Hosszú kattintás: kategória váltása">
                <span class="entry-kind-icon" aria-label="${entryStatusMeta(entry.status).label}">${entryStatusMeta(entry.status).icon}</span>
                <span>${escapeHtml(entry.label)}</span>
                <button class="entry-remove" type="button" aria-label="Bejegyzés törlése">×</button>
              </div>
            `).join('') : '<div class="empty-message">Nincs még feljegyzett siker, info vagy erőforrás.</div>'}
          </div>
        `;
        segmentsGrid.appendChild(card);
      });
    }

    function renderGroups() {
      const groupIds = ['rogue-trader', 'smuggler'];
      groupIds.forEach(groupId => {
        const bin = document.getElementById(`${groupId}-bin`);
        const characters = state.characters.filter(character => character.group === groupId);
        bin.innerHTML = characters.map(character => `
          <div class="character-token" draggable="true" data-character-id="${character.id}" title="${escapeHtml(character.name)}">
            <img src="${character.image}" alt="${escapeHtml(character.name)}">
          </div>
        `).join('');
        document.getElementById(`${groupId}-count`).textContent = `${characters.length}`;
      });
    }

    function renderSummary() {
      const totalEntries = state.segments.reduce((total, segment) => total + segment.entries.length, 0);
      const defenseAverage = state.segments.reduce((total, segment) => total + segment.defense, 0) / state.segments.length;
      const highest = [...state.segments].sort((a, b) => b.entries.length - a.entries.length || b.defense - a.defense)[0];
      document.getElementById('totalEntries').textContent = totalEntries;
      document.getElementById('defenseAverage').textContent = defenseAverage.toFixed(1);
      document.getElementById('highestPressure').textContent = highest ? highest.name : '-';
    }

    function render() {
      renderSegments();
      renderGroups();
      renderSummary();
    }

    async function updateDefense(segmentId, defense) {
      const segment = state.segments.find(item => item.id === segmentId);
      if (!segment) {
        return;
      }

      const previous = segment.defense;
      segment.defense = defense;
      saveLocalState();
      render();

      try {
        const result = await syncWithSheet('update-segment', { segment }, { silent: true });
        showToast(result?.skipped ? 'Védelem helyben mentve.' : 'Védelem mentve a Google Sheet-be.');
      } catch (error) {
        segment.defense = previous;
        saveLocalState();
        render();
        showToast('Nem sikerült menteni a védelmet.');
      }
    }

    async function addEntry(segmentId, label) {
      const segment = state.segments.find(item => item.id === segmentId);
      if (!segment || !label.trim()) {
        return;
      }

      const entry = { id: createId('entry'), label: label.trim(), status: 'normal' };
      segment.entries.push(entry);
      saveLocalState();
      render();

      try {
        const result = await syncWithSheet('add-entry', { segment, entry }, { silent: true });
        showToast(result?.skipped ? 'Bejegyzés helyben mentve.' : 'Bejegyzés mentve a Google Sheet-be.');
      } catch (error) {
        segment.entries = segment.entries.filter(item => item.id !== entry.id);
        saveLocalState();
        render();
        showToast('Nem sikerült hozzáadni a bejegyzést.');
      }
    }

    async function removeEntry(segmentId, entryId) {
      const segment = state.segments.find(item => item.id === segmentId);
      if (!segment) {
        return;
      }

      const previousEntries = [...segment.entries];
      segment.entries = segment.entries.filter(entry => entry.id !== entryId);
      saveLocalState();
      render();

      try {
        const result = await syncWithSheet('remove-entry', { segmentId, entryId }, { silent: true });
        showToast(result?.skipped ? 'Bejegyzés törölve helyben.' : 'Bejegyzés törölve a Google Sheet-ből.');
      } catch (error) {
        segment.entries = previousEntries;
        saveLocalState();
        render();
        showToast('Nem sikerült törölni a bejegyzést.');
      }
    }

    async function cycleEntryStatus(segmentId, entryId) {
      const segment = state.segments.find(item => item.id === segmentId);
      if (!segment) {
        return;
      }

      const entry = segment.entries.find(item => item.id === entryId);
      if (!entry) {
        return;
      }

      entry.status = nextEntryStatus(entry.status);
      saveLocalState();
      render();

      showToast(`${entryStatusMeta(entry.status).label} helyben jelölve.`);
    }

    async function moveCharacter(characterId, group) {
      const character = state.characters.find(item => item.id === characterId);
      if (!character || character.group === group) {
        return;
      }

      const previousGroup = character.group;
      character.group = group;
      saveLocalState();
      render();

      try {
        const result = await syncWithSheet('update-character-group', { character }, { silent: true });
        showToast(result?.skipped ? 'Csoport helyben mentve.' : 'Csoport mentve a Google Sheet-be.');
      } catch (error) {
        character.group = previousGroup;
        saveLocalState();
        render();
        showToast('Nem sikerült menteni a csoportot.');
      }
    }

    segmentsGrid.addEventListener('click', event => {
      const card = event.target.closest('.segment-card');
      if (!card) {
        return;
      }

      const defenseButton = event.target.closest('.defense-die');
      if (defenseButton) {
        updateDefense(card.dataset.segmentId, Number(defenseButton.dataset.level));
        return;
      }

      const removeButton = event.target.closest('.entry-remove');
      if (removeButton) {
        const chip = removeButton.closest('.entry-chip');
        if (chip) {
          removeEntry(card.dataset.segmentId, chip.dataset.entryId);
        }
        event.stopPropagation();
        return;
      }
    });

    let longPressTimer = null;
    let longPressTarget = null;

    segmentsGrid.addEventListener('pointerdown', event => {
      const chip = event.target.closest('.entry-chip');
      if (!chip || event.target.closest('.entry-remove')) {
        return;
      }

      const card = chip.closest('.segment-card');
      if (!card) {
        return;
      }

      longPressTarget = { segmentId: card.dataset.segmentId, entryId: chip.dataset.entryId };
      longPressTimer = setTimeout(() => {
        if (longPressTarget) {
          cycleEntryStatus(longPressTarget.segmentId, longPressTarget.entryId);
          longPressTarget = null;
        }
      }, 620);
    });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach(eventName => {
      segmentsGrid.addEventListener(eventName, () => {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressTarget = null;
      });
    });

    segmentsGrid.addEventListener('contextmenu', event => {
      if (event.target.closest('.entry-chip') && !event.target.closest('.entry-remove')) {
        event.preventDefault();
      }
    });

    segmentsGrid.addEventListener('submit', event => {
      const form = event.target.closest('.entry-form');
      if (!form) {
        return;
      }
      event.preventDefault();
      const card = form.closest('.segment-card');
      const input = form.querySelector('input');
      addEntry(card.dataset.segmentId, input.value);
      input.value = '';
      input.focus();
    });

    document.addEventListener('dragstart', event => {
      const token = event.target.closest('.character-token');
      if (!token) {
        return;
      }
      event.dataTransfer.setData('text/plain', token.dataset.characterId);
      event.dataTransfer.effectAllowed = 'move';
    });

    document.querySelectorAll('.group-zone').forEach(zone => {
      zone.addEventListener('dragover', event => {
        event.preventDefault();
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('drag-over');
      });

      zone.addEventListener('drop', event => {
        event.preventDefault();
        zone.classList.remove('drag-over');
        const characterId = event.dataTransfer.getData('text/plain');
        moveCharacter(characterId, zone.dataset.group);
      });
    });

    (async function init() {
      const sheetState = await loadFromSheet();
      if (sheetState) {
        state = sheetState;
        saveLocalState();
      }
      render();
    })();
  </script>
</body>
</html>
