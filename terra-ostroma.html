<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Ostroma</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0f;
      --accent: #ffcc33;
      --text-primary: #f5f5f5;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top, rgba(22, 22, 34, 0.85), rgba(5, 5, 9, 0.95)), url('images/starfort.jpg') center/cover fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 3vw, 32px);
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(2rem, 7vw, 5rem);
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 204, 51, 0.35), 0 0 32px rgba(255, 153, 51, 0.22);
    }
  </style>
</head>
<body>
  <h1>Terra Ostroma</h1>
</body>
</html>
