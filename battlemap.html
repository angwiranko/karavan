<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
  import { FontLoader } from 'three/examples/jsm/loaders/FontLoader.js';

  // Toast notification function
  function showToast(message, type = 'success') {
    const backgroundColor = type === 'error' 
      ? 'linear-gradient(to right, #ff4444, #cc0000)'
      : 'radial-gradient(circle,rgba(32, 97, 43, 1) 60%, rgba(67, 97, 41, 1) 100%)';
    
    Toastify({
      text: message,
      duration: 1500,
      gravity: "top",
      position: "right",
      backgroundColor: backgroundColor,
      style: {
        fontFamily: "'Orbitron', sans-serif",
        fontSize: "14px",
        borderRadius: "8px",
        border: "2px solid #666",
        boxShadow: "0 0 12px " + (type === 'error' ? '#ff4444' : '#ffaa00')
      }
    }).showToast();
  };

  // Scene, Camera, Renderer

  let scene, camera, renderer, controls;
  
  const canvas = document.querySelector( '#c' );
  renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
  renderer.setSize(window.innerWidth, window.innerHeight, true);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 800, 800);
  camera.lookAt(0, 0, 0);  
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);
  
  // OrbitControls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.update();
  
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selectedPlayer = null;
  let originalMaterial = null;
  let hoverIndicator = null; // For the holographic hover effect
	
    // Gombok
  const addPlayerBtn = document.getElementById('addPlayer');
  const addNPCBtn = document.getElementById('addNPC');
  const deleteSelectedBtn = document.getElementById('deleteSelected');
  const popup = document.getElementById('popup');
  const saveMapBtn = document.getElementById('saveMap');
  const loadMapBtn = document.getElementById('loadMap');
  const fileInput2 = document.getElementById('fileInput');
  console.log("fileInput:", fileInput2);
  const toggleNamesBtn = document.getElementById('toggleNames');
  let namesVisible = false;
  
  toggleNamesBtn.addEventListener('click', () => {
    namesVisible = !namesVisible;
  
    [...players.children, ...enemies.children].forEach(obj => {
      if (obj.children.length > 0) {
        obj.children.forEach(child => {
          if (child.type === "Sprite") {
            child.visible = namesVisible;
          }
        });
      }
    });
  });
  
  
  // popup
  const charNameInput = document.getElementById('charName');
  const charColorInput = document.getElementById('charColor');
  const charSizeInput = document.getElementById('charSize');
  const confirmAddBtn = document.getElementById('confirmAdd');
  const cancelAddBtn = document.getElementById('cancelAdd');
  
  let selectedColor = "#00ffff"; // alapértelmezett szín

  const colorButtons = document.querySelectorAll('.color-button');
  colorButtons.forEach(button => {
    button.addEventListener('click', () => {
      selectedColor = button.getAttribute('data-color');
  
      // Kijelölés vizuálisan
      colorButtons.forEach(btn => btn.classList.remove('selected'));
      button.classList.add('selected');
    });
  });
  
  function openPopup() {
    popup.style.display = 'block';
  }
  
  function closePopup() {
    popup.style.display = 'none';
  }
  
  // infopanel
  const infoPanel = document.getElementById('infoPanel');
  const infoName = document.getElementById('infoName');
  const infoHP = document.getElementById('infoHP');
  
  function updateInfoPanel(object) {
    if (!object) {
      infoPanel.style.display = 'none';
      return;
    }
  
    const { name, size } = object.userData || {};
    
    const portraitCanvas = document.getElementById('infoPortraitCanvas');
    const ctx = portraitCanvas.getContext('2d');
    const img = new Image();
    img.src = "/images/" + (name?.toLowerCase() || "alap") + ".jpg";
    
    img.onload = () => {
      ctx.clearRect(0, 0, 128, 128);
    
      const cropSize = Math.min(img.width, img.height);
      const cropX = (img.width - cropSize) / 2;
      const cropY = (img.height - cropSize) / 2;
    
      const radius = 12;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(128 - radius, 0);
      ctx.quadraticCurveTo(128, 0, 128, radius);
      ctx.lineTo(128, 128 - radius);
      ctx.quadraticCurveTo(128, 128, 128 - radius, 128);
      ctx.lineTo(radius, 128);
      ctx.quadraticCurveTo(0, 128, 0, 128 - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.clip();
    
      ctx.drawImage(img, cropX, cropY, cropSize, cropSize, 0, 0, 128, 128);
      ctx.restore();
    };
	
    infoName.textContent = `${name || '-'}`;
    infoHP.textContent = `HP: ${size != null ? (size / 20).toFixed(0) : '-'}`;
    infoPanel.style.display = 'block';
  }
  
  // Popup gombok
  cancelAddBtn.addEventListener('click', () => {
    closePopup();
  });
  
  // Létrehozás gomb
  confirmAddBtn.addEventListener('click', () => {
    const name = charNameInput.value;
    const color = selectedColor;
    const size = parseFloat(charSizeInput.value);
  
    if (creatingType === "player") {
      createPlayer(0, 0, color, name, size);
    } else if (creatingType === "enemy") {
      createEnemy(0, 0, color, name, size);
    }
  
    closePopup();
  });

let creatingType = null; // "player" vagy "enemy"
  
  // Player hozzáadása
  addPlayerBtn.addEventListener('click', () => {
    creatingType = "player";
    openPopup();
  });
  
  // NPC hozzáadása
  addNPCBtn.addEventListener('click', () => {
    creatingType = "enemy";
    openPopup();
  });
    
  // Kijelölt törlése
  deleteSelectedBtn.addEventListener('click', () => {
    if (selectedPlayer) {
      selectedPlayer.parent.remove(selectedPlayer);
      selectedPlayer = null;
	  updateInfoPanel(null);
      originalMaterial = null;
    }
  });
  
  // Fények
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
  directionalLight.position.set(100, 500, 100);
  scene.add(directionalLight);

  // Talaj (Plane)
  const planeGeometry = new THREE.PlaneGeometry(1000, 1000, 10, 10);
  const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, wireframe: false });
  const plane = new THREE.Mesh(planeGeometry, planeMaterial);
  plane.rotation.x = -Math.PI / 2;
  scene.add(plane);
  
  // BOX (Plane)
  const boxGeometry = new THREE.PlaneGeometry(1000, 100, 10, 1);
  const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x444444, wireframe: true });
  const box = new THREE.Mesh(boxGeometry, boxMaterial);
  box.rotation.x = -Math.PI / 2;
  box.position.set(0, 0, 550);
  scene.add(box);

  // Grid Helper
  const grid = new THREE.GridHelper(1000, 10, 0x888888, 0x444444);
  scene.add(grid);
  
  // Gridszámozás
  function createLetterNumberGrid(gridSize = 10, cellSize = 100) {
    const loader = new FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const label = `${letters[row]}${col + 1}`;
  
          const textGeometry = new TextGeometry(label, {
            font: font,
            size: 8,
            height: 1,
          });
  
          const textMaterial = new THREE.MeshBasicMaterial({
            color: 0xffff00,
            transparent: true,
            opacity: 0.5
          });
          const textMesh = new THREE.Mesh(textGeometry, textMaterial);
  
          const posX = col * cellSize - (gridSize * cellSize) / 2 + cellSize / 2;
          const posZ = row * cellSize - (gridSize * cellSize) / 2 + cellSize / 2;
  
          textMesh.position.set(posX, 2, posZ);
          textMesh.rotation.x = -Math.PI / 2;
  
          scene.add(textMesh);
        }
      }
    });
  }

  // Terrain csoport
  const terrain = new THREE.Group();
  terrain.name = "Terrain";
  scene.add(terrain);
  
  // Karakterek (Players) és Ellenfelek (Enemies) csoport
  const players = new THREE.Group();
  players.name = "Players";
  scene.add(players);
  
  const enemies = new THREE.Group();
  enemies.name = "Enemies";
  scene.add(enemies);
  
  //névtagek karaktereknek
  function createNameLabel(name, portreURL = "/images/alap.jpg") {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  canvas.width = 256;
  canvas.height = 128;

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(120, 60, 1);
  sprite.visible = namesVisible;
  sprite.userData.isNameLabel = true;

  const img = new Image();
  img.src = portreURL;

  img.onload = () => {
    context.clearRect(0, 0, canvas.width, canvas.height);

    // Négyzetes crop középről
    const cropSize = Math.min(img.width, img.height);
    const cropX = (img.width - cropSize) / 2;
    const cropY = (img.height - cropSize) / 2;

    // Lekerekített kép – középre igazítva
    const radius = 8;
    const drawX = (canvas.width - 64) / 2;
    const drawY = 0;

    context.save();
    context.beginPath();
    context.moveTo(drawX + radius, drawY);
    context.lineTo(drawX + 64 - radius, drawY);
    context.quadraticCurveTo(drawX + 64, drawY, drawX + 64, drawY + radius);
    context.lineTo(drawX + 64, drawY + 64 - radius);
    context.quadraticCurveTo(drawX + 64, drawY + 64, drawX + 64 - radius, drawY + 64);
    context.lineTo(drawX + radius, drawY + 64);
    context.quadraticCurveTo(drawX, drawY + 64, drawX, drawY + 64 - radius);
    context.lineTo(drawX, drawY + radius);
    context.quadraticCurveTo(drawX, drawY, drawX + radius, drawY);
    context.closePath();
    context.clip();

    context.drawImage(img, cropX, cropY, cropSize, cropSize, drawX, drawY, 64, 64);
    context.restore();

    // Szöveg középen
    context.fillStyle = 'white';
    context.font = 'bold 24px monospace';
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillText(name, canvas.width / 2, 96);

    texture.needsUpdate = true;
  };

  return sprite;
}

  // Helper function to check if a character should be on top of a building and avoid walls
  function getCorrectYPosition(x, z, size) {
    // Create a temporary raycaster to check for buildings at this position
    const tempRaycaster = new THREE.Raycaster();
    const origin = new THREE.Vector3(x, 200, z); // Start from above
    const direction = new THREE.Vector3(0, -1, 0); // Point downward
    tempRaycaster.set(origin, direction);
    
    // Check for intersections with terrain (buildings)
    const intersects = tempRaycaster.intersectObjects(terrain.children, true);
    const bigBlockHit = intersects.find(hit => hit.object.userData?.type === "bigBlock");
    
    if (bigBlockHit) {
      // Character should be on top of the building
      return bigBlockHit.point.y + size;
    } else {
      // Character should be on the ground
      return size;
    }
  }

  // Optimized collision detection with caching and smoothing
  let lastValidPosition = null;
  let positionCache = new Map();
  const CACHE_GRID_SIZE = 10; // Grid size for caching positions
  
  function getCacheKey(x, z) {
    const gridX = Math.floor(x / CACHE_GRID_SIZE);
    const gridZ = Math.floor(z / CACHE_GRID_SIZE);
    return `${gridX},${gridZ}`;
  }

  // Helper function to check if a position is valid (not clipping into walls)
  function isValidPosition(x, z, size) {
    // Check cache first for performance
    const cacheKey = getCacheKey(x, z);
    if (positionCache.has(cacheKey)) {
      return positionCache.get(cacheKey);
    }
    
    // Check for collisions with terrain objects at character level
    const tempRaycaster = new THREE.Raycaster();
    const characterHeight = size; // Character's center height
    
    // Reduced number of directions for better performance
    const checkDirections = [
      new THREE.Vector3(1, 0, 0),   // Right
      new THREE.Vector3(-1, 0, 0),  // Left
      new THREE.Vector3(0, 0, 1),   // Forward
      new THREE.Vector3(0, 0, -1),  // Backward
    ];
    
    let isValid = true;
    
    for (const direction of checkDirections) {
      const origin = new THREE.Vector3(x, characterHeight, z);
      tempRaycaster.set(origin, direction);
      
      // Check intersections within character's radius + small buffer
      const intersects = tempRaycaster.intersectObjects(terrain.children, true);
      
      for (const hit of intersects) {
        // If we hit something within the character's radius + buffer
        if (hit.distance < size + 5) { // 5 unit buffer
          // Skip if it's a bigBlock that the character should be on top of
          if (hit.object.userData?.type === "bigBlock") {
            // Check if character is actually on top of this block
            const blockTop = hit.object.position.y + 50; // bigBlock height/2 = 50
            const characterY = getCorrectYPosition(x, z, size);
            if (characterY > blockTop + size - 10) {
              continue; // Character is on top, this is OK
            }
          }
          isValid = false;
          break;
        }
      }
      if (!isValid) break;
    }
    
    // Cache the result
    positionCache.set(cacheKey, isValid);
    return isValid;
  }

  // Find nearest valid position if current position is invalid - optimized version
  function findNearestValidPosition(targetX, targetZ, size) {
    // If the target position is already valid, use it
    if (isValidPosition(targetX, targetZ, size)) {
      lastValidPosition = { x: targetX, z: targetZ };
      return lastValidPosition;
    }
    
    // If we have a recent valid position nearby, prefer smoother transitions
    if (lastValidPosition) {
      const distance = Math.sqrt(
        Math.pow(targetX - lastValidPosition.x, 2) + 
        Math.pow(targetZ - lastValidPosition.z, 2)
      );
      
      // If the target is close to the last valid position, try interpolation first
      if (distance < 30) {
        for (let t = 0.1; t <= 1.0; t += 0.1) {
          const interpX = lastValidPosition.x + (targetX - lastValidPosition.x) * t;
          const interpZ = lastValidPosition.z + (targetZ - lastValidPosition.z) * t;
          
          if (isValidPosition(interpX, interpZ, size)) {
            lastValidPosition = { x: interpX, z: interpZ };
            return lastValidPosition;
          }
        }
      }
    }
    
    // Search in expanding circles for a valid position with reduced search frequency
    const searchRadius = 10; // Increased initial radius
    const maxRadius = 50;
    const angleSteps = 6; // Reduced angle steps for performance
    
    for (let radius = searchRadius; radius <= maxRadius; radius += 10) {
      for (let i = 0; i < angleSteps; i++) {
        const angle = (i / angleSteps) * Math.PI * 2;
        const testX = targetX + Math.cos(angle) * radius;
        const testZ = targetZ + Math.sin(angle) * radius;
        
        if (isValidPosition(testX, testZ, size)) {
          lastValidPosition = { x: testX, z: testZ };
          return lastValidPosition;
        }
      }
    }
    
    // If no valid position found, return last valid or original
    return lastValidPosition || { x: targetX, z: targetZ };
  }

  // Create holographic hover indicator with character size
  function createHoverIndicator(size = 20) {
    // Create a glowing ring geometry based on character size
    const innerRadius = size * 0.75;
    const outerRadius = size * 1.25;
    const ringGeometry = new THREE.RingGeometry(innerRadius, outerRadius, 32);
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
    ring.rotation.x = -Math.PI / 2; // Lay flat on ground
    
    // Create a central glow disc based on character size
    const discRadius = size * 0.6;
    const discGeometry = new THREE.CircleGeometry(discRadius, 32);
    const discMaterial = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.3
    });
    const disc = new THREE.Mesh(discGeometry, discMaterial);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = 0.1; // Slightly above the ring
    
    // Create upward beam effect based on character size
    const beamRadius = size * 0.4;
    const beamHeight = size * 2;
    const beamGeometry = new THREE.CylinderGeometry(beamRadius, beamRadius, beamHeight, 8, 1, true);
    const beamMaterial = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.2,
      side: THREE.DoubleSide
    });
    const beam = new THREE.Mesh(beamGeometry, beamMaterial);
    beam.position.y = beamHeight / 2; // Position center of cylinder
    
    // Group all elements
    const indicator = new THREE.Group();
    indicator.add(ring);
    indicator.add(disc);
    indicator.add(beam);
    indicator.visible = false;
    
    // Add pulsing animation data and size info
    indicator.userData = {
      time: 0,
      size,
      originalRingOpacity: ringMaterial.opacity,
      originalDiscOpacity: discMaterial.opacity,
      originalBeamOpacity: beamMaterial.opacity
    };
    
    scene.add(indicator);
    return indicator;
  }

  // Update hover indicator animation with smooth position transitions
  function updateHoverIndicator() {
    if (!hoverIndicator || !hoverIndicator.visible) return;
    
    hoverIndicator.userData.time += 0.05;
    const pulseValue = Math.sin(hoverIndicator.userData.time) * 0.3 + 0.7; // Pulse between 0.4 and 1.0
    
    // Update opacities for pulsing effect
    hoverIndicator.children[0].material.opacity = hoverIndicator.userData.originalRingOpacity * pulseValue;
    hoverIndicator.children[1].material.opacity = hoverIndicator.userData.originalDiscOpacity * pulseValue;
    hoverIndicator.children[2].material.opacity = hoverIndicator.userData.originalBeamOpacity * pulseValue;
    
    // Rotate the beam slowly
    hoverIndicator.children[2].rotation.y += 0.02;
    
    // Smooth position interpolation if target position exists
    if (hoverIndicator.userData.targetPosition) {
      const current = hoverIndicator.position;
      const target = hoverIndicator.userData.targetPosition;
      const lerpFactor = 0.15; // Smooth interpolation factor
      
      current.lerp(target, lerpFactor);
      
      // Clear target when close enough
      if (current.distanceTo(target) < 1) {
        hoverIndicator.userData.targetPosition = null;
      }
    }
  }

  // Function to show hover indicator at position with smooth movement and correct size
  function showHoverIndicator(x, y, z, size = 20) {
    // Create new indicator if needed or if size changed
    if (!hoverIndicator || (hoverIndicator.userData.size !== size)) {
      if (hoverIndicator) {
        scene.remove(hoverIndicator);
      }
      hoverIndicator = createHoverIndicator(size);
    }
    
    const targetPosition = new THREE.Vector3(x, y, z);
    
    if (!hoverIndicator.visible) {
      // First time showing - set position immediately
      hoverIndicator.position.copy(targetPosition);
      hoverIndicator.visible = true;
    } else {
      // Set target for smooth transition
      hoverIndicator.userData.targetPosition = targetPosition;
    }
  }

  // Function to hide hover indicator
  function hideHoverIndicator() {
    if (hoverIndicator) {
      hoverIndicator.visible = false;
    }
  }
  
  // Függvény karakter és enemyk létrehozására
  function createPlayer(x, z, color = 0x0000ff, name = "Player", size = 20) {
    const geometry = new THREE.SphereGeometry(size, 16, 16);
    const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(color) });
    const sphere = new THREE.Mesh(geometry, material);
    const portreURL = "/images/" + name.toLowerCase() + ".jpg"; // vagy más logika
    const nameLabel = createNameLabel(name, portreURL);
	nameLabel.visible = namesVisible;
    sphere.add(nameLabel);
    nameLabel.position.set(0, size + 20, -size); // A gömb fölé helyezzük

    // Find a valid position that doesn't clip into walls
    const validPosition = findNearestValidPosition(x, z, size);
    const correctY = getCorrectYPosition(validPosition.x, validPosition.z, size);
    sphere.position.set(validPosition.x, correctY, validPosition.z);
  
    sphere.userData = {
      type: "player",
      name,
      size
    };
  

    
    players.add(sphere);
  }
  
  function createEnemy(x, z, color = 0xff0000, name = "Enemy", size = 20) {
    const geometry = new THREE.SphereGeometry(size, 16, 16);
    const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(color) });
    const sphere = new THREE.Mesh(geometry, material);
    const nameLabel = createNameLabel(name);
	nameLabel.visible = namesVisible;
    sphere.add(nameLabel);
    nameLabel.position.set(0, size + 20, -size); // A gömb fölé helyezzük

    // Find a valid position that doesn't clip into walls
    const validPosition = findNearestValidPosition(x, z, size);
    const correctY = getCorrectYPosition(validPosition.x, validPosition.z, size);
    sphere.position.set(validPosition.x, correctY, validPosition.z);
  
    sphere.userData = {
      type: "Enemy",
      name,
      size
    };
      
    enemies.add(sphere);
  }
  
  // Példa: Létrehozunk néhány karaktert és ellenfelet
  createPlayer(-450, 550, 0x0000ff, "Ares");
  createPlayer(-350, 550, 0x0000ff, "Cassius");
  createPlayer(-250, 550, 0x0000ff, "Omega");
  createPlayer(-150, 550, 0x0000ff, "Agrippa");
  createPlayer(-50, 550, 0x0000ff, "Ignatius");
  createEnemy(450, 550, 0xff0000, "Enemy1");
  createEnemy(350, 550, 0xff0000, "Enemy2");
  createEnemy(250, 550, 0xff0000, "Enemy3");
  createEnemy(150, 550, 0xff0000, "Enemy4");
  createEnemy(50, 550, 0xff0000, "Enemy5");
  
  // Seeded Random Number Generator
  let globalSeed = Math.floor(Math.random() * 1000000); // Generate initial seed
  
  function seededRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }
  
  let randomCounter = 0;
  function nextRandom() {
    return seededRandom(globalSeed + randomCounter++);
  }
  
  function setSeed(seed) {
    globalSeed = seed;
    randomCounter = 0;
  }
  
 // TORZÍTó
  function distortGeometry(geometry, amount = 1) {
    const positionAttribute = geometry.attributes.position;
    for (let i = 0; i < positionAttribute.count; i++) {
      const x = positionAttribute.getX(i);
      const y = positionAttribute.getY(i);
      const z = positionAttribute.getZ(i);
  
      // Véletlenszerűen elmozdítjuk a vertexeket
      positionAttribute.setX(i, x + (nextRandom() - 0.9) * amount);
      positionAttribute.setY(i, y + (nextRandom() - 0.9) * amount);
      positionAttribute.setZ(i, z + (nextRandom() - 0.9) * amount);
    }
    positionAttribute.needsUpdate = true;
    geometry.computeVertexNormals();
  }

  // Terrain generation function
  function generateTerrain() {
    // Clear existing terrain
    terrain.clear();
    
    // Clear position cache when terrain changes
    positionCache.clear();
    lastValidPosition = null;
    
    // Reset random counter for consistent generation
    randomCounter = 0;
    
    // random szobák
    const gridSize = 10;
    const cellSize = 100;
    
    const occupied = new Array(gridSize).fill(0).map(() => new Array(gridSize).fill(false));
    const occupiedBigBlocks = new Array(gridSize).fill(0).map(() => new Array(gridSize).fill(false));


    for (let gx = 0; gx < gridSize; gx++) {
      for (let gz = 0; gz < gridSize; gz++) {
        const cellType = nextRandom();
        if (cellType < 0.15) { // pl. 15% eséllyel bigBlock
          occupiedBigBlocks[gx][gz] = true;
        }
      }
    }


    for (let gx = 0; gx < gridSize; gx++) {
      for (let gz = 0; gz < gridSize; gz++) {
        if (occupied[gx][gz]) continue; // Ha már foglalt, átugorjuk
    
        const cellType = nextRandom();
    
        const centerX = gx * cellSize - 500 + cellSize / 2;
        const centerZ = gz * cellSize - 500 + cellSize / 2;
    
        if (cellType < 0.05 && gx < gridSize - 1 && gz < gridSize - 1) {
          // Nagy szoba: 2x2 terület
          occupied[gx][gz] = true;
          occupied[gx+1][gz] = true;
          occupied[gx][gz+1] = true;
          occupied[gx+1][gz+1] = true;
    
          // A szoba középpontja
          const roomCenterX = centerX + cellSize / 2;
          const roomCenterZ = centerZ + cellSize / 2;
    
          // 6 oszlop egy négyzetben, nagyobb távolságra
          for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const x = roomCenterX + Math.cos(angle) * 50;
            const z = roomCenterZ + Math.sin(angle) * 50;
    
            const column = new THREE.Mesh(
              new THREE.CylinderGeometry(10, 10, 80, 8),
              new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            column.position.set(x, 40, z);
            terrain.add(column);
          }
      
        } else if (cellType < 0.1) {
          // ÚJ! Nagy blokk, 1x1 cellás, masszív akadály
      
      function createBlockFence(blockX, blockY, blockZ, blockWidth, blockDepth, gx, gz) {
            const fenceMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const fenceSpacing = 25;
            const fenceHeightBase = -20;
        
            // Irányok: észak (-z), dél (+z), nyugat (-x), kelet (+x)
        
            // Ha NINCS szomszéd felfelé (észak, gz-1)
            if (!(gz > 0 && occupiedBigBlocks[gx][gz - 1])) {
              for (let i = -blockWidth / 2 + 10; i <= blockWidth / 2 - 10; i += fenceSpacing) {
                const height = fenceHeightBase + nextRandom() * 30;
                const block = new THREE.Mesh(
                  new THREE.BoxGeometry(10, height, 10),
                  fenceMaterial
                );
                block.position.set(blockX + i, blockY + height / 2, blockZ - blockDepth / 2 + 5);
                terrain.add(block);
              }
            }
        
            // Ha NINCS szomszéd lefelé (dél, gz+1)
            if (!(gz < gridSize - 1 && occupiedBigBlocks[gx][gz + 1])) {
              for (let i = -blockWidth / 2 + 10; i <= blockWidth / 2 - 10; i += fenceSpacing) {
                const height = fenceHeightBase + nextRandom() * 30;
                const block = new THREE.Mesh(
                  new THREE.BoxGeometry(10, height, 10),
                  fenceMaterial
                );
                block.position.set(blockX + i, blockY + height / 2, blockZ + blockDepth / 2 - 5);
                terrain.add(block);
              }
            }
        
            // Ha NINCS szomszéd balra (nyugat, gx-1)
            if (!(gx > 0 && occupiedBigBlocks[gx - 1][gz])) {
              for (let i = -blockDepth / 2 + 10; i <= blockDepth / 2 - 10; i += fenceSpacing) {
                const height = fenceHeightBase + nextRandom() * 30;
                const block = new THREE.Mesh(
                  new THREE.BoxGeometry(10, height, 10),
                  fenceMaterial
                );
                block.position.set(blockX - blockWidth / 2 + 5, blockY + height / 2, blockZ + i);
                terrain.add(block);
              }
            }
        
            // Ha NINCS szomszéd jobbra (kelet, gx+1)
            if (!(gx < gridSize - 1 && occupiedBigBlocks[gx + 1][gz])) {
              for (let i = -blockDepth / 2 + 10; i <= blockDepth / 2 - 10; i += fenceSpacing) {
                const height = fenceHeightBase + nextRandom() * 30;
                const block = new THREE.Mesh(
                  new THREE.BoxGeometry(10, height, 10),
                  fenceMaterial
                );
                block.position.set(blockX + blockWidth / 2 - 5, blockY + height / 2, blockZ + i);
                terrain.add(block);
              }
            }
          }
      for (let gx2 = 0; gx2 < gridSize; gx2++) {
        for (let gz2 = 0; gz2 < gridSize; gz2++) {
          if (occupiedBigBlocks[gx2][gz2]) {
          const centerX2 = gx2 * cellSize - 500 + cellSize / 2;
          const centerZ2 = gz2 * cellSize - 500 + cellSize / 2;
          
          const bigBlock = new THREE.Mesh(
            new THREE.BoxGeometry(100, 100, 100, 10, 10, 10),
            new THREE.MeshStandardMaterial({ color: 0xffffff })
          );

          // Új torzítás hívás:
          //if (nextRandom() < 0.7) {
          //  distortGeometry(bigBlock.geometry, 1); // 70% eséllyel torzítjuk, 6 egység elmozdulással
          //}
          
          bigBlock.position.set(centerX2, 50, centerZ2);
          bigBlock.userData = { type: "bigBlock" };
          
          // Korlát létrehozása
          createBlockFence(bigBlock.position.x, bigBlock.position.y + 50, bigBlock.position.z, 100, 100, gx2, gz2);
          
          // --- ÚJ: random kivágott lyukak generálása ---
          for (let i = 0; i < Math.floor(nextRandom() * 4) + 2; i++) { // 2-5 "lyuk"
            const hole = new THREE.Mesh(
            new THREE.BoxGeometry(
              nextRandom() * 20 + 10, // szélesség 10-30
              nextRandom() * 20 + 10, // magasság
              nextRandom() * 20 + 10  // mélység
            ),
            new THREE.MeshStandardMaterial({ color: 0x888888 }) // Sötétszürke "lyuk" anyag
            );
          
            hole.position.set(
            bigBlock.position.x + (nextRandom() - 0.5) * 90, // Kb. a blokk belsejében random
            bigBlock.position.y + (nextRandom() - 0.5) * 90,
            bigBlock.position.z + (nextRandom() - 0.5) * 90
            );
          
            terrain.add(hole);
          }
          
          terrain.add(bigBlock);
            }
        }
      }
        
        } else if (cellType < 0.5) {
          // Folyosó generálása
          const isHorizontal = nextRandom() < 0.5; // 50% eséllyel vízszintes vagy függőleges
        
          for (let i = -2; i <= 2; i++) {
            const height = nextRandom() * 30 + 10; // random magasság
        const block = new THREE.Mesh(
              new THREE.BoxGeometry(20, height, 20),
              new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
        
            if (isHorizontal) {
              // Vízszintes folyosó (kelet-nyugat)
              block.position.set(centerX + i * 20, height / 2, centerZ - cellSize/2 + 10); 
            } else {
              // Függőleges folyosó (észak-dél)
              block.position.set(centerX - cellSize/2 + 10, height / 2, centerZ + i * 20);
            }
        
            terrain.add(block);
          }
        } else {
          // Üres cella
        }
      }
    }
  }

  // Generate initial terrain
  generateTerrain();

  // Mozgás Karakter
  function smoothMove(object, targetX, targetY, targetZ, duration = 500) {
    const startPosition = object.position.clone();
    const startTime = performance.now();
  
    function animate() {
      const elapsed = performance.now() - startTime;
      const t = Math.min(elapsed / duration, 1); // 0..1 közötti idő interpoláció
  
      object.position.lerpVectors(startPosition, new THREE.Vector3(targetX, targetY, targetZ), t);
  
      if (t < 1) {
        requestAnimationFrame(animate);
      }
    }
  
    animate();
  }


  
  renderer.domElement.addEventListener('click', (event) => {
      event.preventDefault();
	   
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
      raycaster.setFromCamera(mouse, camera);
  
      if (selectedPlayer) {
          // Ha karaktert mozgatunk
          const terrainIntersects = raycaster.intersectObjects(terrain.children, true);
          const planeIntersects = raycaster.intersectObject(plane, true);
		      const boxIntersects = raycaster.intersectObject(box, true);
          const size = selectedPlayer.userData.size || 20; // ha nincs size, default 20
  
          let targetX, targetZ;
          
          if (terrainIntersects.length > 0) {
              // If we hit terrain (including buildings), use that position
              targetX = terrainIntersects[0].point.x;
              targetZ = terrainIntersects[0].point.z;
          } else if (planeIntersects.length > 0) {
              // If we hit the ground plane
              targetX = planeIntersects[0].point.x;
              targetZ = planeIntersects[0].point.z;
          } else if (boxIntersects.length > 0) {
              // If we hit the box
              targetX = boxIntersects[0].point.x;
              targetZ = boxIntersects[0].point.z;
          }
          
          // Always use getCorrectYPosition to ensure proper positioning
          if (targetX !== undefined && targetZ !== undefined) {
              // Find a valid position that doesn't clip into walls
              const validPosition = findNearestValidPosition(targetX, targetZ, size);
              const targetY = getCorrectYPosition(validPosition.x, validPosition.z, size);
              smoothMove(selectedPlayer, validPosition.x, targetY, validPosition.z, 500);
              updateInfoPanel(null);
          } 
		  
          // Hide hover indicator and release character
          hideHoverIndicator();
          selectedPlayer.material = originalMaterial;
          selectedPlayer = null;
          originalMaterial = null;
  
      } else {
          // Ha karaktert választunk ki
          const intersects = raycaster.intersectObjects([...players.children, ...enemies.children], true);
		  
		      // Szűrés, hogy a Sprite-okat ignoráljuk:
          const validIntersects = intersects.filter(i => !i.object.userData.isNameLabel);
          
          if (validIntersects.length > 0) {
              const intersectedObject = validIntersects[0].object;
          
              if (selectedPlayer && originalMaterial) {
                  selectedPlayer.material = originalMaterial;
                  hideHoverIndicator();
              }
          
              selectedPlayer = intersectedObject;
              originalMaterial = selectedPlayer.material;
          
              selectedPlayer.material = new THREE.MeshStandardMaterial({
                  color: 0x00ffff,
                  emissive: 0x00ffff,
                  emissiveIntensity: 0.5,
                  metalness: 0.3,
                  roughness: 0.5
              });
          
              updateInfoPanel(selectedPlayer);
              console.log('Kiválasztott karakter:', selectedPlayer);
          } else {
              if (selectedPlayer && originalMaterial) {
                  selectedPlayer.material = originalMaterial;
                  hideHoverIndicator();
              }
              selectedPlayer = null;
              originalMaterial = null;
              updateInfoPanel(null);
          }
      }
  });

  // Add mouse move event listener for hover indicator with throttling
  let lastMouseMoveTime = 0;
  const MOUSE_MOVE_THROTTLE = 50; // Throttle to 20fps for smoother performance
  
  renderer.domElement.addEventListener('mousemove', (event) => {
      const now = performance.now();
      if (now - lastMouseMoveTime < MOUSE_MOVE_THROTTLE) {
          return; // Skip this update to reduce jank
      }
      lastMouseMoveTime = now;
      
      if (!selectedPlayer) {
          hideHoverIndicator();
          return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const terrainIntersects = raycaster.intersectObjects(terrain.children, true);
      const planeIntersects = raycaster.intersectObject(plane, true);
      const boxIntersects = raycaster.intersectObject(box, true);
      const size = selectedPlayer.userData.size || 20;

      let targetX, targetZ;

      if (terrainIntersects.length > 0) {
          targetX = terrainIntersects[0].point.x;
          targetZ = terrainIntersects[0].point.z;
      } else if (planeIntersects.length > 0) {
          targetX = planeIntersects[0].point.x;
          targetZ = planeIntersects[0].point.z;
      } else if (boxIntersects.length > 0) {
          targetX = boxIntersects[0].point.x;
          targetZ = boxIntersects[0].point.z;
      }

      if (targetX !== undefined && targetZ !== undefined) {
          // Find the valid position and show hover indicator with character size
          const validPosition = findNearestValidPosition(targetX, targetZ, size);
          const targetY = getCorrectYPosition(validPosition.x, validPosition.z, size);
          showHoverIndicator(validPosition.x, targetY - size + 2, validPosition.z, size); // Use character size
      } else {
          hideHoverIndicator();
      }
  });


  // Render loop
  function animate() {
    requestAnimationFrame(animate);
	controls.update();
    updateHoverIndicator(); // Update the holographic hover effect
    renderer.render(scene, camera);
  }
    
	
  createLetterNumberGrid();
  animate();
    
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  
  loadMapBtn.onclick = () => {
  console.log("📂 Betöltés gomb megnyomva");
  fileInput2.click();
};


fileInput2.onchange = (e) => {
  console.log("📂 File input változott!");

  const file = e.target.files[0];
  if (!file) {
    console.warn("⚠️ Nem lett kiválasztva fájl");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    console.log("📂 Fájl olvasva");
    let data;
    try {
      data = JSON.parse(reader.result);
      console.log("✅ JSON beolvasva:", data);
    } catch (err) {
      console.error("❌ JSON parse error:", err);
      showToast("❌ Hibás fájlformátum!", 'error');
      return;
    }

    // Clear régi térkép
    players.clear();
    enemies.clear();
    
    // Set the seed and regenerate terrain
    if (data.seed !== undefined) {
      setSeed(data.seed);
      generateTerrain();
    }

    // Wait a frame to ensure terrain is fully generated before placing characters
    requestAnimationFrame(() => {
      data.players.forEach(item => {
        createPlayer(item.position.x, item.position.z, item.color, item.name, item.size);
      });

      data.enemies.forEach(item => {
        createEnemy(item.position.x, item.position.z, item.color, item.name, item.size);
      });
    });

    showToast("✅ Betöltés sikeres!");
  };
  reader.readAsText(file);
};

      //MENTÉS
  
  saveMapBtn.onclick = () => {
    const mapData = {
      seed: globalSeed, // Save the terrain generation seed
      players: [],
      enemies: []
    };
  
    players.children.forEach(obj => {
      mapData.players.push({
        name: obj.userData.name,
        size: obj.userData.size,
        color: '#' + obj.material.color.getHexString(),
        position: {
          x: obj.position.x,
          y: obj.position.y,
          z: obj.position.z
        }
      });
    });
  
    enemies.children.forEach(obj => {
      mapData.enemies.push({
        name: obj.userData.name,
        size: obj.userData.size,
        color: '#' + obj.material.color.getHexString(),
        position: {
          x: obj.position.x,
          y: obj.position.y,
          z: obj.position.z
        }
      });
    });
  
    // Generate filename with current date
    const now = new Date();
    const formatter = new Intl.DateTimeFormat('en-CA'); // Canadian format is YYYY-MM-DD
    const filename = `map ${formatter.format(now)}.json`;

    const blob = new Blob([JSON.stringify(mapData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  
</script>
