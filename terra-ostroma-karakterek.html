<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra Ostroma Karakterek</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --border: #5a4930;
      --accent: #d8ad4b;
      --accent-bright: #f0cf77;
      --bone: #d8d0bf;
      --crimson: #6d1712;
      --terra: #c9b56d;
      --mars: #b86a42;
      --text-primary: #efe8d6;
      --text-secondary: #aaa292;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background:
        linear-gradient(90deg, rgba(49, 11, 8, 0.24), rgba(0, 0, 0, 0) 22%, rgba(104, 83, 44, 0.13) 50%, rgba(0, 0, 0, 0) 78%, rgba(49, 11, 8, 0.22)),
        radial-gradient(circle at top, rgba(55, 45, 30, 0.72), rgba(5, 5, 9, 0.96)),
        url('images/starfort.jpg') center/cover fixed;
      color: var(--text-primary);
      padding: clamp(14px, 2vw, 28px);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.055) 0 1px, transparent 1px 7px),
        linear-gradient(90deg, transparent, rgba(216, 173, 75, 0.07) 50%, transparent);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 74%);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1680px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      align-items: end;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.7rem, 2.7vw, 3rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 18px rgba(216, 173, 75, 0.24);
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-secondary);
      font-size: 0.82rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .nav-button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.08) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(28, 24, 20, 0.98), rgba(10, 10, 12, 0.98));
      color: var(--bone);
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(216, 173, 75, 0.08), 0 10px 26px rgba(0, 0, 0, 0.28);
    }

    .nav-button.active {
      border-color: rgba(255, 204, 51, 0.72);
      color: var(--accent-bright);
      box-shadow: inset 0 -3px 0 rgba(216, 173, 75, 0.58), 0 0 10px rgba(216, 173, 75, 0.16);
    }

    .nav-button.terra {
      color: var(--terra);
      border-color: rgba(201, 181, 109, 0.44);
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.07) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(35, 31, 22, 0.96), rgba(11, 14, 14, 0.98));
    }

    .nav-button.mars {
      color: var(--mars);
      border-color: rgba(184, 106, 66, 0.5);
      background:
        repeating-linear-gradient(135deg, rgba(216, 173, 75, 0.06) 0 1px, transparent 1px 7px),
        linear-gradient(145deg, rgba(80, 23, 17, 0.94), rgba(20, 11, 9, 0.98));
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .character-card {
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.045) 0 1px, transparent 1px 8px),
        linear-gradient(160deg, rgba(34, 29, 24, 0.9), rgba(11, 10, 12, 0.96));
      border: 1px solid rgba(216, 173, 75, 0.26);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(239, 207, 119, 0.055), 0 18px 44px rgba(0, 0, 0, 0.44);
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    .character-card:hover {
      border-color: rgba(216, 173, 75, 0.52);
      transform: translateY(-3px);
    }

    .character-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: 50% 18%;
      border-radius: 6px;
      display: block;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
    }

    .character-name {
      margin: 12px 0 0;
      color: var(--accent);
      font-size: 0.98rem;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(0, 0, 0, 0.84);
      padding: 24px;
    }

    .modal.open {
      display: grid;
      place-items: center;
    }

    .modal-content {
      width: min(560px, 92vw);
      max-height: 92vh;
      overflow: auto;
      border: 1px solid rgba(216, 173, 75, 0.42);
      border-radius: 8px;
      background:
        repeating-linear-gradient(0deg, rgba(216, 173, 75, 0.04) 0 1px, transparent 1px 8px),
        #12100f;
      padding: 16px;
      position: relative;
    }

    .modal-image {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      header {
        grid-template-columns: 1fr;
      }

      .top-nav {
        justify-content: flex-start;
      }

      .nav-button {
        flex: 1 1 130px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div>
        <h1>Terra Ostroma Karakterek</h1>
        <p class="subtitle">Játékosi karaktergaléria</p>
      </div>
      <nav class="top-nav" aria-label="Terra Ostroma menü">
        <a class="nav-button" href="terra-ostroma.html">Ostrom</a>
        <a class="nav-button active" href="terra-ostroma-karakterek.html">Karakterek</a>
        <a class="nav-button" href="terra-ostroma-npc.html">NPC</a>
        <a class="nav-button terra" href="earth/index.html">Terra</a>
        <a class="nav-button mars" href="mars/index.html">Mars</a>
      </nav>
    </header>

    <main class="character-grid" id="characterGrid"></main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-modal" type="button" aria-label="Bezárás">&times;</button>
      <img class="modal-image" id="modalImage" src="" alt="">
      <h2 class="character-name" id="modalName"></h2>
    </div>
  </div>

  <script>
    const characters = [
      { id: 'character-01', name: 'Karakter 1', image: 'images/terra-ostroma/character-01.jpg' },
      { id: 'character-02', name: 'Karakter 2', image: 'images/terra-ostroma/character-02.jpg' },
      { id: 'character-03', name: 'Karakter 3', image: 'images/terra-ostroma/character-03.jpg' },
      { id: 'character-04', name: 'Karakter 4', image: 'images/terra-ostroma/character-04.jpg' },
      { id: 'character-05', name: 'Karakter 5', image: 'images/terra-ostroma/character-05.jpg' }
    ];

    const grid = document.getElementById('characterGrid');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const modalName = document.getElementById('modalName');

    grid.innerHTML = characters.map(character => `
      <article class="character-card" data-character-id="${character.id}">
        <img class="character-image" src="${character.image}" alt="${character.name}">
        <h2 class="character-name">${character.name}</h2>
      </article>
    `).join('');

    grid.addEventListener('click', event => {
      const card = event.target.closest('.character-card');
      if (!card) {
        return;
      }
      const character = characters.find(item => item.id === card.dataset.characterId);
      if (!character) {
        return;
      }
      modalImage.src = character.image;
      modalImage.alt = character.name;
      modalName.textContent = character.name;
      modal.classList.add('open');
    });

    modal.addEventListener('click', event => {
      if (event.target === modal || event.target.closest('.close-modal')) {
        modal.classList.remove('open');
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        modal.classList.remove('open');
      }
    });
  </script>
</body>
</html>
