<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <meta name="description" content="Terra ostromának játékosi karakterei.">
  <title>Karakterek | Terra ostroma</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="terra-ostroma-records.css">
</head>
<body class="characters-page">
  <header class="masthead">
    <a class="brand" href="terra-ostroma.html"><span class="brand-mark" aria-hidden="true">I</span><span>Karakterek<small>Terra / Személyi állomány</small></span></a>
    <nav class="top-nav" aria-label="Terra ostroma menü">
      <a href="terra-ostroma.html">Ostrom</a>
      <a href="terra-ostroma-karakterek.html" aria-current="page">Karakterek</a>
      <a href="terra-ostroma-npc.html">NPC</a>
      <a href="terra-ostroma-astronomicon.html">Astronomicon</a>
      <a href="terra-ostroma-eternity-gate.html">Eternity Gate</a>
      <a href="earth/index.html" class="planet">Terra</a>
      <a href="mars/index.html" class="planet mars">Mars</a>
    </nav>
  </header>
  <div class="record-bar"><h1>Játékosi állomány</h1><span>07 karakter</span><span class="record-code">PERSONAE / TERRA</span></div>
  <main class="collection">
    <div class="character-grid" id="characterGrid" aria-label="Játékosi karakterek"></div>
    <footer class="collection-footer"><span>Személyi nyilvántartás</span><span>Terra ostroma / 07</span></footer>
  </main>
  <dialog class="portrait-dialog" id="modal" aria-labelledby="modalName">
    <div class="portrait-toolbar">
      <h2 id="modalName"></h2><span id="portraitCount"></span>
      <button class="portrait-control" id="previousPortrait" type="button" aria-label="Előző karakter" title="Előző karakter"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></button>
      <button class="portrait-control" id="nextPortrait" type="button" aria-label="Következő karakter" title="Következő karakter"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button>
      <button class="portrait-control close-modal" type="button" aria-label="Bezárás" title="Bezárás"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
    </div>
    <div class="portrait-body"><img class="modal-image" id="modalImage" alt=""></div>
  </dialog>
  <script>
    const characters = [
      { id: 'character-01', name: 'Karakter 1', image: 'images/terra-ostroma/character-01.jpg' },
      { id: 'character-02', name: 'Karakter 2', image: 'images/terra-ostroma/character-02.jpg' },
      { id: 'character-03', name: 'Karakter 3', image: 'images/terra-ostroma/character-03.jpg' },
      { id: 'character-04', name: 'Karakter 4', image: 'images/terra-ostroma/character-04.jpg' },
      { id: 'character-05', name: 'Karakter 5', image: 'images/terra-ostroma/character-05.jpg' },
      { id: 'character-06', name: 'Karakter 6', image: 'images/terra-ostroma/character-06.jpg' },
      { id: 'character-07', name: 'Karakter 7', image: 'images/terra-ostroma/character-07.jpg' }
    ];


    const grid = document.getElementById('characterGrid');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const modalName = document.getElementById('modalName');
    let activeIndex = 0;
    let opener = null;

    grid.innerHTML = characters.map((character, index) => `
      <button type="button" class="character-card" data-character-id="${character.id}" aria-label="${character.name} portréjának megnyitása">
        <img class="character-image" src="${character.image}" alt="${character.name}" decoding="async">
        <span class="character-name"><span class="character-number">${String(index + 1).padStart(2, '0')}</span>${character.name}</span>
      </button>
    `).join('');

    function showPortrait(index) {
      activeIndex = (index + characters.length) % characters.length;
      const character = characters[activeIndex];
      modalImage.src = character.image;
      modalImage.alt = character.name;
      modalName.textContent = character.name;
      document.getElementById('portraitCount').textContent = `${activeIndex + 1} / ${characters.length}`;
    }

    grid.addEventListener('click', event => {
      const card = event.target.closest('.character-card');
      if (!card) return;
      const index = characters.findIndex(item => item.id === card.dataset.characterId);
      if (index < 0) return;
      opener = card;
      showPortrait(index);
      modal.showModal();
    });
    document.getElementById('previousPortrait').addEventListener('click', () => showPortrait(activeIndex - 1));
    document.getElementById('nextPortrait').addEventListener('click', () => showPortrait(activeIndex + 1));
    modal.addEventListener('click', event => {
      if (event.target === modal || event.target.closest('.close-modal')) modal.close();
    });
    modal.addEventListener('close', () => opener?.focus());
    document.addEventListener('keydown', event => {
      if (!modal.open) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); showPortrait(activeIndex - 1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); showPortrait(activeIndex + 1); }
    });
  </script>
</body>
</html>
